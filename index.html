<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#80694f">
  <title>Riftbound Codex</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
:root {
  --bg: #f5f0e7;
  --panel: #fcfaf6;
  --panel-strong: #ffffff;
  --panel-soft: #eee7dc;
  --text: #2b2723;
  --muted: #746c63;
  --border: #d9d0c3;
  --accent: #80694f;
  --accent-strong: #66513b;
  --accent-soft: #e6ddd0;
  --success: #47715b;
  --warning: #a36d2f;
  --danger: #a24e4e;
  --shadow: 0 14px 34px rgba(55, 44, 31, .12);
  --sidebar-width: 272px;
  --radius: 14px;
  color-scheme: light;
}

body.theme-slate {
  --bg: #edf0f2;
  --panel: #f8fafb;
  --panel-strong: #ffffff;
  --panel-soft: #e2e7ea;
  --text: #20262b;
  --muted: #667079;
  --border: #ced6dc;
  --accent: #536b78;
  --accent-strong: #3d5360;
  --accent-soft: #dce5e9;
}

body.theme-moss {
  --bg: #eef1e8;
  --panel: #fafbf7;
  --panel-strong: #ffffff;
  --panel-soft: #e4eadb;
  --text: #273024;
  --muted: #687162;
  --border: #d0d9c7;
  --accent: #647657;
  --accent-strong: #4d6044;
  --accent-soft: #e0e8d7;
}

body.theme-ink {
  --bg: #17191c;
  --panel: #202328;
  --panel-strong: #262a30;
  --panel-soft: #2d3138;
  --text: #f0eee9;
  --muted: #aaa79f;
  --border: #3a3f47;
  --accent: #b39a78;
  --accent-strong: #ccb58f;
  --accent-soft: #3c362e;
  --shadow: 0 18px 40px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }

.app-shell { min-height: 100vh; display: flex; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-width);
  z-index: 30;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-right: 1px solid var(--border);
  transition: transform .22s ease;
}
.workspace-shell { min-width: 0; flex: 1; margin-left: var(--sidebar-width); }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 64px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 22px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.main-content { width: 100%; max-width: 1240px; margin: 0 auto; padding: 32px 38px 72px; outline: none; }

.sidebar-head { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); }
.workspace-switcher {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  padding: 9px;
  text-align: left;
}
.workspace-switcher:hover { background: var(--panel-soft); }
.workspace-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: white;
  background: var(--accent);
  font-family: Georgia, serif;
  font-weight: 700;
}
.workspace-copy { min-width: 0; flex: 1; }
.workspace-name { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workspace-subtitle { display: block; font-size: 12px; color: var(--muted); }
.sidebar-nav { padding: 10px; overflow-y: auto; flex: 1; }
.nav-group { margin-bottom: 14px; }
.nav-label { padding: 8px 9px 5px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 38px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  padding: 8px 10px;
  text-align: left;
  color: var(--muted);
}
.nav-item:hover { color: var(--text); background: var(--panel-soft); }
.nav-item.active { color: var(--text); background: var(--accent-soft); font-weight: 650; }
.nav-icon { width: 19px; text-align: center; color: var(--accent); font-size: 16px; }
.nav-count { margin-left: auto; font-size: 12px; color: var(--muted); }
.location-mini-tree { padding-left: 12px; }
.tree-row { display: flex; align-items: center; gap: 6px; }
.tree-indent { width: 12px; border-left: 1px solid var(--border); align-self: stretch; }
.tree-link { flex: 1; border: 0; background: transparent; text-align: left; color: var(--muted); padding: 5px 7px; border-radius: 7px; font-size: 13px; }
.tree-link:hover { background: var(--panel-soft); color: var(--text); }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--border); }
.sidebar-user { display: flex; align-items: center; gap: 10px; padding: 7px; }
.avatar { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-size: 12px; font-weight: 800; }
.user-copy { min-width: 0; }
.user-name { font-size: 13px; font-weight: 650; }
.user-mode { color: var(--muted); font-size: 11px; }

.breadcrumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb-button { border: 0; background: transparent; padding: 4px 3px; color: inherit; border-radius: 5px; }
.crumb-button:hover { color: var(--text); background: var(--panel-soft); }
.crumb-separator { color: var(--border); }
.topbar-actions { display: flex; align-items: center; gap: 9px; }
.global-search { width: min(270px, 28vw); position: relative; display: block; }
.global-search input {
  width: 100%;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  padding: 0 12px 0 34px;
  outline: none;
}
.global-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.search-icon { position: absolute; left: 11px; top: 7px; color: var(--muted); font-size: 18px; }
.save-status { font-size: 12px; color: var(--muted); white-space: nowrap; }
.button {
  min-height: 38px;
  border-radius: 9px;
  border: 1px solid transparent;
  padding: 8px 13px;
  font-weight: 650;
  background: var(--accent);
  color: white;
}
.button:hover { filter: brightness(.96); }
.button.secondary { background: var(--panel); color: var(--text); border-color: var(--border); }
.button.ghost { background: transparent; color: var(--muted); border-color: transparent; }
.button.danger { background: var(--danger); }
.button.small { min-height: 32px; padding: 5px 10px; font-size: 13px; }
.icon-button, .avatar-button {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
}
.avatar-button { border-radius: 50%; font-size: 11px; font-weight: 800; background: var(--accent-soft); color: var(--accent-strong); }
.mobile-only { display: none; }

.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; margin-bottom: 28px; }
.page-kicker { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 8px; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 8px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 4vw, 54px); line-height: 1.06; font-weight: 600; letter-spacing: -.02em; }
h2 { margin-bottom: 12px; font-size: 22px; }
h3 { margin-bottom: 8px; font-size: 17px; }
.page-subtitle { max-width: 720px; color: var(--muted); margin-bottom: 0; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
.metric-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 17px; }
.metric-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.metric-value { margin-top: 8px; font-family: Georgia, serif; font-size: 32px; line-height: 1; }
.metric-detail { margin-top: 7px; color: var(--muted); font-size: 12px; }

.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr); gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 18px 0; }
.panel-body { padding: 17px 18px 18px; }
.quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.quick-card { border: 1px solid var(--border); border-radius: 11px; background: var(--panel-strong); padding: 14px; text-align: left; }
.quick-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.quick-title { display: block; font-weight: 700; }
.quick-copy { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
.activity-list { display: grid; gap: 12px; }
.activity-item { display: grid; grid-template-columns: 9px 1fr; gap: 9px; }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.activity-text { font-size: 13px; }
.activity-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

.collection-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.segmented { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
.segmented button { border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 6px 10px; }
.segmented button.active { background: var(--accent-soft); color: var(--text); font-weight: 650; }
.input, .select, .textarea {
  width: 100%;
  min-height: 39px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel-strong);
  padding: 8px 10px;
  outline: none;
}
.textarea { min-height: 120px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.toolbar-search { width: 230px; }

.card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.entity-card { display: block; width: 100%; min-width: 0; border: 1px solid var(--border); border-radius: 13px; background: var(--panel); overflow: hidden; text-align: left; }
.entity-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 7px 20px rgba(40, 32, 23, .07); }
.entity-card-cover { display: block; width: 100%; height: 76px; background: linear-gradient(135deg, var(--accent-soft), var(--panel-soft)); position: relative; }
.entity-card-monogram { position: absolute; left: 14px; bottom: -20px; width: 43px; height: 43px; display: grid; place-items: center; border-radius: 12px; background: var(--panel-strong); border: 1px solid var(--border); color: var(--accent-strong); font-family: Georgia, serif; font-weight: 700; }
.entity-card-body { display: block; width: 100%; padding: 30px 15px 15px; }
.entity-card-title { display: block; font-weight: 750; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.entity-card-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; min-height: 18px; }
.entity-card-copy { margin-top: 12px; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.tag { display: inline-flex; align-items: center; min-height: 24px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); padding: 3px 8px; font-size: 11px; font-weight: 650; }

.table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: auto; background: var(--panel); }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { position: sticky; top: 0; z-index: 1; text-align: left; background: var(--panel-soft); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
th, td { padding: 11px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-soft); }
.cell-title { font-weight: 680; }
.cell-muted { color: var(--muted); font-size: 13px; }
.empty-state { padding: 55px 20px; text-align: center; color: var(--muted); }

.entity-hero { border: 1px solid var(--border); background: var(--panel); border-radius: 18px; overflow: hidden; margin-bottom: 20px; }
.entity-cover { height: 132px; background: linear-gradient(120deg, var(--accent-soft), var(--panel-soft) 58%, color-mix(in srgb, var(--accent) 20%, var(--panel))); }
.entity-title-row { display: flex; align-items: flex-start; gap: 12px; padding: 18px 24px 22px; }
.entity-title-input { flex: 1; min-width: 0; width: 100%; min-height: 48px; max-height: none; overflow: hidden; resize: none; border: 0; padding: 0; background: transparent; font-family: Georgia, serif; font-size: clamp(30px, 5vw, 48px); line-height: 1.08; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; }
.favorite-button { border: 0; background: transparent; color: var(--muted); font-size: 22px; padding: 8px; }
.favorite-button.on { color: var(--warning); }
.entity-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 22px; align-items: start; }
.editor-surface { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); min-height: 400px; padding: 22px; }
.properties-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 17px; position: sticky; top: 84px; }
.property-list { display: grid; gap: 12px; }
.property-row label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; }
.property-help { color: var(--muted); font-size: 11px; margin-top: 5px; }
.character-snapshot { margin-bottom: 18px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel-soft); }
.snapshot-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
.snapshot-field { min-width: 0; }
.snapshot-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; }
.snapshot-value { display: block; overflow-wrap: anywhere; }
.snapshot-relationships { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--border); }
.snapshot-relationships p { margin: 0; }
.property-links { display: flex; flex-wrap: wrap; gap: 6px; }
.link-pill { border: 1px solid var(--border); background: var(--panel-strong); border-radius: 999px; padding: 5px 9px; font-size: 12px; }
.link-pill:hover { border-color: var(--accent); color: var(--accent-strong); }
.breadcrumb-trail { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.breadcrumb-pill { border: 0; background: var(--accent-soft); color: var(--accent-strong); border-radius: 999px; padding: 5px 9px; font-size: 12px; }
.children-list { display: grid; gap: 7px; }
.child-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; background: var(--panel-strong); }
.hierarchy-root-note { border: 1px solid var(--border); border-radius: 10px; background: var(--accent-soft); padding: 12px; }
.hierarchy-root-copy { display: grid; gap: 3px; }
.hierarchy-root-copy strong { color: var(--accent-strong); }
.hierarchy-root-copy span { color: var(--muted); font-size: 12px; }

.block-toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.block-tool { min-width: 32px; height: 31px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel-strong); color: var(--muted); font-size: 12px; }
.block-tool:hover { color: var(--text); border-color: var(--accent); }
.block-list { display: grid; gap: 5px; }
.block-row { position: relative; padding-left: 24px; border-radius: 7px; }
.block-row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.block-handle { position: absolute; left: 2px; top: 8px; opacity: 0; color: var(--muted); font-size: 12px; user-select: none; }
.block-row:hover .block-handle { opacity: 1; }
.block-content { min-height: 30px; outline: none; padding: 4px 5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.block-content strong { font-weight: 780; }
.block-content em { font-style: italic; }
.block-content code { border-radius: 5px; background: var(--panel-soft); padding: 1px 4px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .92em; }
.markdown-label-block { margin-top: 10px; padding-top: 8px; }
.block-content[data-type="h1"] { font-family: Georgia, serif; font-size: 30px; font-weight: 650; padding-top: 9px; }
.block-content[data-type="h2"] { font-size: 23px; font-weight: 720; padding-top: 10px; }
.block-content[data-type="h3"] { font-size: 18px; font-weight: 720; padding-top: 8px; }
.block-content[data-type="bullet"]::before { content: "•"; margin-right: 8px; color: var(--accent); }
.block-content[data-type="number"] { counter-increment: item; }
.block-content[data-type="number"]::before { content: counter(item) "."; margin-right: 8px; color: var(--muted); }
.block-content[data-type="quote"] { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); font-style: italic; }
.block-content[data-type="code"] { background: var(--panel-soft); border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
.block-divider { height: 1px; background: var(--border); margin: 13px 4px; }
.block-placeholder { color: var(--muted); font-size: 13px; padding: 12px 5px; }

.graph-toolbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.graph-filter-panel { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); padding: 15px; }
.graph-filter-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 13px; }
.graph-filter-heading h2 { margin: 0; font-size: 17px; }
.graph-filter-heading p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.graph-filter-actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; }
.graph-filter-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 12px; }
.graph-filter-group { min-width: 0; margin: 0; border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px 11px; }
.graph-filter-group legend { padding: 0 5px; color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; }
.graph-check-row { display: flex; flex-wrap: wrap; gap: 7px; }
.graph-check { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel-strong); padding: 5px 10px; cursor: pointer; font-size: 13px; }
.graph-check:hover { border-color: var(--accent); }
.graph-check input { margin: 0; accent-color: var(--accent); }
.graph-check input:not(:checked) + span { color: var(--muted); text-decoration: line-through; }
.graph-item-details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 11px; }
.graph-item-details summary { cursor: pointer; font-weight: 700; }
.graph-item-details summary span { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 5px; }
.graph-item-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; max-height: 235px; overflow: auto; padding: 11px 2px 2px; }
.graph-item-list .graph-check { border-radius: 9px; width: 100%; min-width: 0; }
.graph-item-list .graph-check span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.graph-stage { position: relative; min-height: 620px; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); overflow: hidden; }
.graph-stage svg { width: 100%; height: 620px; display: block; }
.graph-legend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 28px); padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(9px); font-size: 11px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.graph-help { color: var(--muted); font-size: 12px; margin-top: 9px; }
.graph-node-label { pointer-events: none; font-size: 11px; fill: var(--text); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.graph-link { stroke: var(--border); stroke-opacity: .8; }
.graph-link.related { stroke-dasharray: 5 5; }
.graph-link.current { stroke: var(--accent); stroke-opacity: .65; }
.graph-node { cursor: pointer; stroke: var(--panel-strong); stroke-width: 2px; }

.graph-node.selected { stroke: var(--text); stroke-width: 4px; }
.graph-node-glyph { pointer-events: none; font-size: 9px; font-weight: 850; fill: var(--panel); text-anchor: middle; dominant-baseline: central; }
.graph-edge-label { pointer-events: none; font-size: 10px; font-weight: 700; fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
.graph-group-label { pointer-events: none; font-size: 10px; font-weight: 800; letter-spacing: .08em; fill: var(--muted); text-anchor: middle; }
.graph-reading-guide { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr); gap: 14px; align-items: start; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); padding: 15px; }
.graph-reading-guide h2 { margin: 4px 0 4px; font-size: 17px; }
.graph-reading-guide p { margin: 0; color: var(--muted); font-size: 13px; }
.graph-reading-key { display: grid; gap: 7px; }
.graph-key-row { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; }
.graph-key-dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; border: 2px solid var(--panel-strong); }
.graph-key-line { width: 28px; height: 0; flex: 0 0 auto; border-top: 2px solid var(--accent); }
.graph-key-line.dashed { border-top-style: dashed; border-top-color: var(--muted); }
.graph-visual-grid { display: grid; gap: 14px; align-items: start; }
.graph-inspector { border: 1px solid var(--border); border-radius: 14px; background: var(--panel); padding: 15px; min-width: 0; }
.graph-inspector h2 { margin: 3px 0 4px; font-size: 18px; }
.graph-inspector-copy { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.graph-connection-list { display: grid; gap: 8px; }
.graph-connection { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 8px; align-items: start; border-top: 1px solid var(--border); padding-top: 8px; font-size: 13px; }
.graph-connection:first-child { border-top: 0; padding-top: 0; }
.graph-relation-tag { display: inline-flex; align-items: center; min-height: 22px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); padding: 2px 7px; font-size: 10px; font-weight: 800; white-space: nowrap; }
.graph-empty-inspector { color: var(--muted); font-size: 13px; }
.graph-open-button { margin-top: 13px; }
.graph-link.parent { stroke: var(--accent); stroke-opacity: .85; }
.graph-link.related { stroke: var(--muted); stroke-opacity: .6; stroke-dasharray: 5 5; }
.graph-link.relationship { stroke: var(--success); stroke-opacity: .75; }
.graph-link.current { stroke: var(--success); stroke-opacity: .8; }
.graph-link.member { stroke: var(--warning); stroke-opacity: .8; }
.graph-link.event { stroke: var(--danger); stroke-opacity: .7; }

@media (min-width: 1120px) {
  .graph-visual-grid { grid-template-columns: minmax(0, 1fr) 300px; }
  .graph-inspector { position: sticky; top: 78px; }
}
@media (max-width: 760px) {
  .graph-reading-guide { grid-template-columns: 1fr; }
}


.timeline { position: relative; max-width: 900px; margin: 0 auto; }
.timeline::before { content: ""; position: absolute; left: 145px; top: 0; bottom: 0; width: 1px; background: var(--border); }
.timeline-item { display: grid; grid-template-columns: 125px 32px 1fr; gap: 8px; margin-bottom: 18px; position: relative; }
.timeline-date { text-align: right; padding-top: 13px; color: var(--muted); font-size: 12px; }
.timeline-dot-wrap { display: flex; justify-content: center; padding-top: 14px; }
.timeline-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--bg); z-index: 1; }
.timeline-card { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); padding: 14px 15px; cursor: pointer; }
.timeline-card:hover { border-color: var(--accent); }
.timeline-title { font-weight: 750; }
.timeline-copy { color: var(--muted); font-size: 13px; margin-top: 6px; }

.member-list { display: grid; gap: 10px; }
.member-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px 90px; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); padding: 11px; }
.member-person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.member-email { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-callout { margin-bottom: 18px; border: 1px solid var(--border); border-radius: 13px; background: var(--accent-soft); padding: 15px; }
.invite-form { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 9px; margin-bottom: 18px; }

.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.settings-card { border: 1px solid var(--border); border-radius: 13px; background: var(--panel); padding: 17px; }
.theme-options { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; margin-top: 12px; }
.theme-option { border: 1px solid var(--border); border-radius: 10px; background: var(--panel-strong); padding: 8px; }
.theme-swatch { height: 43px; border-radius: 7px; margin-bottom: 6px; border: 1px solid rgba(0,0,0,.08); }
.theme-option.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
.status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warning); }
.status-dot.online { background: var(--success); }

.search-results { display: grid; gap: 8px; }
.search-result { display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); padding: 10px; cursor: pointer; }
.search-result:hover { border-color: var(--accent); }
.search-result-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent-strong); font-family: Georgia, serif; font-weight: 700; }
.search-result-meta { color: var(--muted); font-size: 12px; }

.modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(18, 17, 15, .55); }
.modal { width: min(560px, 100%); max-height: min(720px, 90vh); overflow: auto; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 17px 18px; border-bottom: 1px solid var(--border); }
.modal-body { padding: 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 15px 18px; border-top: 1px solid var(--border); }
.toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: grid; gap: 9px; }
.toast { max-width: 360px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel-strong); box-shadow: var(--shadow); padding: 11px 13px; font-size: 13px; animation: toast-in .2s ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }

@media (max-width: 980px) {
  .metric-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .card-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .entity-layout { grid-template-columns: 1fr; }
  .properties-panel { position: static; }
  .graph-toolbar { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .graph-filter-grid { grid-template-columns: 1fr; }
  .graph-item-list { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .settings-grid { grid-template-columns: 1fr; }

@media (max-width: 760px) {
  :root { --sidebar-width: min(310px, 88vw); }
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow); }
  body.sidebar-open .sidebar { transform: translateX(0); }
  .sidebar-backdrop { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); }
  body.sidebar-open .sidebar-backdrop { display: block !important; }
  .workspace-shell { margin-left: 0; }
  .mobile-only { display: grid; }
  .topbar { padding: 9px 12px; }
  .main-content { padding: 24px 16px 60px; }
  .global-search { width: 42px; }
  .global-search input { width: 42px; padding-left: 34px; padding-right: 5px; }
  .global-search input:focus { position: absolute; right: 0; top: -19px; width: min(310px, calc(100vw - 90px)); z-index: 3; padding-right: 12px; }
  .save-status { display: none; }
  .topbar-actions .button.secondary { display: none; }
  .page-head { display: block; }
  .page-actions { margin-top: 15px; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .card-grid { grid-template-columns: 1fr; }
  .entity-cover { height: 92px; }
  .entity-title-row { padding: 16px 18px 18px; }
  .entity-title-input { font-size: 34px; line-height: 1.1; }
  .graph-stage, .graph-stage svg { min-height: 520px; height: 520px; }
  .timeline::before { left: 13px; }
  .timeline-item { grid-template-columns: 27px 1fr; gap: 8px; }
  .timeline-date { grid-column: 2; text-align: left; padding: 0; }
  .timeline-dot-wrap { grid-column: 1; grid-row: 1 / span 2; padding-top: 4px; }
  .timeline-card { grid-column: 2; }
  .invite-form { grid-template-columns: 1fr; }
  .member-row { grid-template-columns: 1fr; }
  .theme-options { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 480px) {
  .metric-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
  .metric-value { font-size: 27px; }
  .quick-grid { grid-template-columns: 1fr; }
  .graph-toolbar { grid-template-columns: 1fr; }
  .graph-filter-heading { display: block; }
  .graph-filter-actions { justify-content: flex-start; margin-top: 10px; }
  .graph-item-list { grid-template-columns: 1fr; max-height: 280px; }
  .snapshot-grid { grid-template-columns: 1fr; }
  h1 { font-size: 38px; }

/* Story-first graph */
.story-map-summary {
  display: grid;
  gap: 12px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
  padding: 15px;
}
.story-map-summary p { margin: 0; color: var(--muted); font-size: 13px; }
.story-path-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.story-path-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 34px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-strong);
  padding: 5px 10px 5px 6px;
  font-size: 13px;
}
.story-path-chip strong {
  display: inline-grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--panel);
  font-size: 11px;
}
.story-path-arrow { color: var(--muted); font-weight: 800; }
.story-link {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.2px;
  stroke-opacity: .82;
}
.story-link.branch-path {
  stroke: var(--success);
  stroke-width: 1.6px;
  stroke-opacity: .66;
}
.story-node-group { cursor: grab; }
.story-node-group:active { cursor: grabbing; }
.story-node-circle {
  stroke: var(--panel-strong);
  stroke-width: 3px;
  transition: stroke-width .15s ease, filter .15s ease;
}
.story-node-group:hover .story-node-circle { stroke-width: 5px; }
.story-node-group.selected .story-node-circle {
  stroke: var(--text);
  stroke-width: 5px;
}
.story-step-number {
  pointer-events: none;
  fill: var(--panel);
  font-size: 12px;
  font-weight: 850;
}
.story-role-label {
  pointer-events: none;
  fill: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .04em;
  paint-order: stroke;
  stroke: var(--panel);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.story-node-label { font-size: 12px; font-weight: 750; }
.story-edge-label { font-size: 10px; }
@media (max-width: 720px) {
  .story-path-arrow { display: none; }
  .story-path-chips { align-items: stretch; }
  .story-path-chip { border-radius: 10px; }
}

/* Roleplay story reader */
.story-jump-panel {
  margin-bottom: 18px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  padding: 15px;
}
.story-jump-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.story-jump-heading p { margin: 0; color: var(--muted); font-size: 13px; }
.story-jump-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 8px; }
.story-jump {
  min-width: 0;
  display: grid;
  grid-template-columns: 30px minmax(0,1fr);
  grid-template-rows: auto auto;
  align-items: center;
  gap: 1px 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel-strong);
  padding: 9px;
  text-align: left;
}
.story-jump:hover { border-color: var(--accent); background: var(--accent-soft); }
.story-jump.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.story-jump > span {
  grid-row: 1 / span 2;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--accent);
  color: var(--panel-strong);
  font-weight: 800;
}
.story-jump strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.story-jump small { color: var(--muted); font-size: 11px; }
.story-reader-page {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
}
.story-point-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 24px 26px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--panel));
}
.story-point-head h2 { margin: 8px 0 5px; font-family: Georgia, "Times New Roman", serif; font-size: 30px; line-height: 1.15; }
.story-point-head p { max-width: 760px; margin: 0; color: var(--muted); }
.story-point-number { margin-right: 8px; color: var(--accent-strong); font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.viz-badge {
  display: inline-flex;
  align-items: center;
  min-height: 25px;
  border-radius: 999px;
  background: var(--accent-soft);
  padding: 3px 9px;
  color: var(--accent-strong);
  font-size: 11px;
  font-weight: 750;
}
.story-point-stats { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
.story-point-stats span { white-space: nowrap; border: 1px solid var(--border); border-radius: 999px; background: var(--panel-strong); padding: 5px 9px; color: var(--muted); font-size: 12px; }
.rp-reading-list { display: grid; gap: 14px; padding: 24px 26px; }
.rp-post {
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 13px;
  background: var(--panel-strong);
  padding: 15px 17px 17px;
}
.rp-post-action { border-left-color: var(--success); }
.rp-post-narration { border-left-color: var(--warning); background: color-mix(in srgb, var(--panel-strong) 84%, var(--accent-soft)); }
.rp-post-ooc { border-left-style: dashed; border-left-color: var(--muted); }
.rp-post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.rp-avatar {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 850;
}
.rp-avatar:disabled { cursor: default; opacity: 1; }
.rp-speaker { font-weight: 800; }
.rp-post-meta { color: var(--muted); font-size: 12px; }
.rp-post-body { font-family: Georgia, "Times New Roman", serif; font-size: 17px; line-height: 1.7; white-space: normal; }
.rp-empty-copy { color: var(--muted); font-style: italic; }
.rp-empty { padding: 52px 24px; text-align: center; }
.rp-empty h3 { margin: 0 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: 24px; }
.rp-empty p { max-width: 640px; margin: 0 auto 18px; color: var(--muted); }
.story-point-editor { display: grid; gap: 18px; padding: 24px 26px; }
.story-point-fields { display: grid; grid-template-columns: minmax(0,.8fr) minmax(0,1.2fr); gap: 12px; }
.story-point-fields label, .rp-editor label, .rp-custom-speaker { display: grid; gap: 6px; }
.story-point-fields label > span, .rp-editor label > span, .rp-custom-speaker > span { color: var(--muted); font-size: 12px; font-weight: 750; }
.rp-editor-list { display: grid; gap: 12px; }
.rp-editor { border: 1px solid var(--border); border-radius: 14px; background: var(--panel-strong); padding: 14px; }
.rp-editor-toolbar { display: grid; grid-template-columns: minmax(150px,1fr) minmax(130px,.7fr) auto; align-items: end; gap: 10px; margin-bottom: 10px; }
.rp-editor-actions { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
.rp-custom-speaker { margin-bottom: 10px; }
.rp-editor-text textarea { min-height: 170px; line-height: 1.55; }
.story-reader-nav { display: flex; justify-content: space-between; gap: 12px; padding: 18px 26px; border-top: 1px solid var(--border); background: var(--panel-soft); }
.graph-inspector-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.story-content-mark { pointer-events: none; fill: var(--panel-strong); font-size: 10px; font-weight: 900; paint-order: stroke; stroke: var(--text); stroke-width: 2px; }
button:disabled { cursor: not-allowed; opacity: .48; }

@media (max-width: 760px) {
  .story-jump-heading { display: block; }
  .story-jump-heading p { margin-top: 4px; }
  .story-jump-list { grid-template-columns: 1fr 1fr; }
  .story-point-head { display: block; padding: 20px 18px; }
  .story-point-head h2 { font-size: 26px; }
  .story-point-stats { justify-content: flex-start; margin-top: 14px; }
  .rp-reading-list, .story-point-editor { padding: 18px; }
  .story-point-fields { grid-template-columns: 1fr; }
  .rp-editor-toolbar { grid-template-columns: 1fr; }
  .rp-editor-actions { justify-content: flex-start; }
  .story-reader-nav { padding: 14px 18px; }
}

@media (max-width: 440px) {
  .story-jump-list { grid-template-columns: 1fr; }
  .story-reader-nav { display: grid; grid-template-columns: 1fr; }
  .story-reader-nav .button { width: 100%; }
}



/* Continuous RP sheet and story-point bookmarks */
.story-anchor-callout {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  border: 1px solid var(--accent);
  border-radius: 12px;
  background: var(--accent-soft);
  padding: 12px 14px;
}
.story-anchor-callout strong { color: var(--accent-strong); }
.story-anchor-callout span { color: var(--muted); }
.story-point-fields-anchor { grid-template-columns: minmax(0,.75fr) minmax(0,1.15fr) minmax(220px,.9fr); }
.story-point-anchor-control small { color: var(--muted); font-size: 11px; line-height: 1.4; }
.story-anchor-status { margin-top: 9px !important; color: var(--accent-strong) !important; font-size: 13px; font-weight: 750; }
.rp-story-anchor {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  scroll-margin-top: 92px;
  padding: 4px 0 0;
}
.rp-story-anchor button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-soft);
  padding: 6px 10px;
  color: var(--text);
  text-align: left;
}
.rp-story-anchor button:hover, .rp-story-anchor.active button { border-color: var(--accent); background: var(--accent-soft); }
.rp-story-anchor span { color: var(--accent-strong); font-size: 11px; font-weight: 850; text-transform: uppercase; }
.rp-story-anchor strong { font-size: 12px; }
.rp-post[data-rp-turn-id], .rp-editor[data-story-turn-card] { scroll-margin-top: 92px; }
.rp-post-selected-section { background: color-mix(in srgb, var(--panel-strong) 88%, var(--accent-soft)); }
.rp-post-selected-start { box-shadow: inset 0 0 0 2px var(--accent); }
.rp-editor-selected-anchor { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.rp-editor-anchor-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.rp-editor-anchor-list span { border-radius: 999px; background: var(--accent-soft); padding: 4px 8px; color: var(--accent-strong); font-size: 11px; font-weight: 750; }
.rp-anchor-flash { animation: rpAnchorFlash 1.2s ease; }
@keyframes rpAnchorFlash { 0%,35% { outline: 3px solid color-mix(in srgb, var(--accent) 65%, transparent); outline-offset: 4px; } 100% { outline-color: transparent; outline-offset: 9px; } }
.story-popup-anchor { color: var(--accent-strong) !important; font-size: 13px; }
.rp-popup-more { margin: 10px 0 0; color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 920px) {
  .story-point-fields-anchor { grid-template-columns: 1fr; }
}

/* Working links inside the imported World Overview */
.world-quick-link-row { max-width: 720px; }
.world-quick-link {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--panel-strong);
  padding: 12px 14px;
  text-align: left;
}

/* Free-form character image canvas */
.character-block-list {

.character-image-block {
  --image-width: 300px;

  max-width: calc(100% - 8px);

      },
      {
        "id": "b11",
        "type": "text",
        "content": "The world that remains is called **Riftbound**: a place where nothing fully fits, yet everything somehow coexists. Some civilizations adapted. Others collapsed or vanished underground. Some fled into space. Many simply learned to live alongside the fractures and told themselves the world had always been this way."
      },
      {
        "id": "b12",
        "type": "text",
        "content": "The rifts continue to shift. New anomalies appear without warning. And somewhere beneath the layered fractures, the truth of the first break still waits to be understood."
      },
      {
        "id": "b13",
        "type": "h3",
        "content": "Rift Travel"
      },
      {
        "id": "b14",
        "type": "text",
        "content": "People can move between rifts, but the risk is high. There is no guarantee of return or successful adaptation. Certain technologies and magics can reduce the danger, but these safeguards mostly exist at established leyline points."
      },
      {
        "id": "b15",
        "type": "h2",
        "content": "Current Situation"
      },
      {
        "id": "b16",
        "type": "h3",
        "content": "Modern Era anchor"
      },
      {
        "id": "b17",
        "type": "text",
        "content": "Use this as the “present day” for all stories. Anything dated after this is “current events.”"
      },
      {
        "id": "b18",
        "type": "bullet",
        "content": "**1200 AR — The Convergence Stabilizes.** After centuries of chaotic overlap, the largest rifts settle into semi‑reliable routes. Major powers begin treating rifts as borders, roads, and resources rather than pure disasters."
      },
      {
        "id": "b19",
        "type": "bullet",
        "content": "**1212 AR — The Rift Accord.** A tense multi‑faction agreement establishes shared rules for leyline sites, transit tolls, quarantine procedures, and the handling of “rift refugees” arriving from displaced worlds."
      },
      {
        "id": "b20",
        "type": "bullet",
        "content": "**1226 AR — The Anomaly Bloom.** New, smaller rifts begin appearing unpredictably far from known leylines. This ends the illusion that the world is “mapped,” and it triggers a new wave of exploration, paranoia, and weaponization."
      },
      {
        "id": "b21",
        "type": "bullet",
        "content": "**1240 AR — Present Day (Stories Begin).** The rifts are common enough to be part of daily life, but unstable enough to keep the world on edge. Old ruins continue to surface beside new cities, and no one agrees on what the Sundering was really protecting the world from."
      },
      {
        "id": "b22",
        "type": "h3",
        "content": "Rift Lore Update — Forced Rifts"
      },
      {
        "id": "b23",
        "type": "text",
        "content": "#### Forced rifts"
      },
      {
        "id": "b24",
        "type": "bullet",
        "content": "Rifts can be deliberately forced open through powerful magic."
      },
      {
        "id": "b25",
        "type": "bullet",
        "content": "This was confirmed when a coven of witches tore one open near a town."
      },
      {
        "id": "b26",
        "type": "bullet",
        "content": "Forced rifts are far more unstable and dangerous than natural ones."
      },
      {
        "id": "b27",
        "type": "bullet",
        "content": "Entities that come through are often ancient, intelligent, and hostile."
      },
      {
        "id": "b28",
        "type": "text",
        "content": "#### Closing forced rifts"
      },
      {
        "id": "b29",
        "type": "bullet",
        "content": "Closing a forced rift is significantly harder than sealing a natural one."
      },
      {
        "id": "b30",
        "type": "bullet",
        "content": "It requires strong will and substantial magical power."
      },
      {
        "id": "b31",
        "type": "bullet",
        "content": "One confirmed case showed a single mage closing a forced rift alone; this is considered highly unusual and impressive."
      },
      {
        "id": "b32",
        "type": "bullet",
        "content": "The process is extremely draining and can cause severe physical and magical backlash (nosebleeds, exhaustion, temporary collapse)."
      },
      {
        "id": "b33",
        "type": "text",
        "content": "#### Consequences"
      },
      {
        "id": "b34",
        "type": "bullet",
        "content": "Opening a rift near populated areas causes panic, death, and widespread damage."
      },
      {
        "id": "b35",
        "type": "bullet",
        "content": "The Dominion responds quickly to any major rift activity."
      },
      {
        "id": "b36",
        "type": "bullet",
        "content": "Groups that force rifts open are treated as high-priority threats."
      },
      {
        "id": "b37",
        "type": "h2",
        "content": "Timeline (All worlds, unified “AR” dating)"
      },
      {
        "id": "b38",
        "type": "text",
        "content": "This timeline assumes **AR (“After Rift”)** begins when the Sundering becomes a recognized, shared historical pivot. Earlier cultures may have had their own calendars, but AR is the first *universal* count used across rift‑connected civilizations."
      },
      {
        "id": "b39",
        "type": "h3",
        "content": "Before AR (Pre‑Sundering)"
      },
      {
        "id": "b40",
        "type": "bullet",
        "content": "**Before AR — The Whole World.** Reality has clean boundaries; worlds remain separated; time behaves predictably."
      },
      {
        "id": "b41",
        "type": "bullet",
        "content": "**Before AR — The Pressure Builds.** Strange omens, broken prophecies, and “impossible” sightings emerge at the edges of reality. Early secret orders form to study the veil."
      },
      {
        "id": "b42",
        "type": "h3",
        "content": "0 AR — The Sundering"
      },
      {
        "id": "b43",
        "type": "bullet",
        "content": "**0 AR — The Sundering (First Break).** The veil fails in an uneven, folding fracture. Eras overlap; worlds bleed together; rifts form where layers press too tightly."
      },
      {
        "id": "b44",
        "type": "h3",
        "content": "The Early Rift Age (1–200 AR)"
      },
      {
        "id": "b45",
        "type": "bullet",
        "content": "**7 AR — First Riftfall.** A major city is partially overwritten by an older ruin‑layer. Survivors spread the first widely believed accounts of overlapping eras."
      },
      {
        "id": "b46",
        "type": "bullet",
        "content": "**23 AR — The Leyline Discovery.** Scholars and scavengers realize some rifts “anchor” to repeating patterns. The first crude maps of stable crossings are made."
      },
      {
        "id": "b47",
        "type": "bullet",
        "content": "**58 AR — The Mythwalkers Return.** Creatures once dismissed as legend begin appearing consistently, suggesting whole mythic ecosystems have migrated into Riftbound."
      },
      {
        "id": "b48",
        "type": "bullet",
        "content": "**110 AR — Machine‑Magic Synthesis.** Early artificers prove magic can be conducted, stored, and amplified through engineered systems. This becomes the seed of magitech."
      },
      {
        "id": "b49",
        "type": "bullet",
        "content": "**177 AR — The Starreach Window.** A rift opens onto a near‑orbit layer; explorers confirm the sky is no longer purely “one world’s” sky. Spacefaring remnants and newcomers begin to surface."
      },
      {
        "id": "b50",
        "type": "h3",
        "content": "The Age of Adaptation (201–700 AR)"
      },
      {
        "id": "b51",
        "type": "bullet",
        "content": "**242 AR — The Great Relocation.** Entire populations migrate toward known leylines for safety and trade. Rift‑towns become the first true multi‑origin cities."
      },
      {
        "id": "b52",
        "type": "bullet",
        "content": "**319 AR — The Deep Descent.** A coalition disappears into a vast underlayer to escape surface instability. Their descendants become a rumor, then a power."
      },
      {
        "id": "b53",
        "type": "bullet",
        "content": "**401 AR — The Cartographers’ War.** Rival map‑guilds and states fight over control of stable routes, anchors, and naming rights—because naming a place can shape how others perceive it."
      },
      {
        "id": "b54",
        "type": "bullet",
        "content": "**516 AR — The Quiet Century Begins.** Rift activity slows slightly; empires consolidate; religions and philosophies rewrite their origins around the Sundering."
      },
      {
        "id": "b55",
        "type": "bullet",
        "content": "**690 AR — The First Return.** A lost expedition re‑emerges decades later with only days of subjective time passed, proving time drift is real and politically dangerous."
      },
      {
        "id": "b56",
        "type": "h3",
        "content": "The Age of Expansion (701–1100 AR)"
      },
      {
        "id": "b57",
        "type": "bullet",
        "content": "**742 AR — The Skyports Rise.** Stable high‑altitude crossings enable consistent off‑world salvage and contact with spacefaring enclaves."
      },
      {
        "id": "b58",
        "type": "bullet",
        "content": "**811 AR — The Archive Crusades.** Competing factions raid pre‑Sundering knowledge caches, trying to uncover what caused the break—or what it prevented."
      },
      {
        "id": "b59",
        "type": "bullet",
        "content": "**903 AR — The Riftborne Plague.** A sickness adapted to multiple layers spreads through trade routes, forcing the first true rift quarantines and travel controls."
      },
      {
        "id": "b60",
        "type": "bullet",
        "content": "**1017 AR — The Beacon Network.** Leyline beacons are installed to stabilize crossings and broadcast warnings. Control of beacons becomes a new form of power."
      },
      {
        "id": "b61",
        "type": "bullet",
        "content": "**1099 AR — The Glass Horizon Event.** A massive rift reveals a mirrored layer where history diverged. The psychological shock drives cults, schisms, and new “alternate‑origin” movements."
      },
      {
        "id": "b62",
        "type": "h3",
        "content": "The Late Rift Age (1101–1240 AR)"
      },
      {
        "id": "b63",
        "type": "bullet",
        "content": "**1134 AR — The Rift Courts.** Neutral arbiters emerge to settle cross‑layer disputes: identity claims, property overlap, and crimes that cross reality seams."
      },
      {
        "id": "b64",
        "type": "bullet",
        "content": "**1188 AR — The Salvager Boom.** Ruins surfacing beside living cities create a new economy: relic extraction, cursed tech, and black‑market artifacts."
      },
      {
        "id": "b65",
        "type": "bullet",
        "content": "**1226 AR — The Anomaly Bloom.** Small, unpredictable rifts proliferate beyond known leylines. Governments and guilds shift from “route control” to “incident response.”"
      },
      {
        "id": "b66",
        "type": "bullet",
        "content": "**1240 AR — Present Day.** The world is livable, tense, and full of unanswered questions. Somewhere under the layered fractures, the truth of the first break still waits."
      },
      {
        "id": "b67",
        "type": "h2",
        "content": "Quick Links"
      },

      "notes": "Alignment: Chaotic Good\n\nBackstory: Fully human but has always felt witch-coded, candles flickered at her touch as a child, charms warmed in her grip, moonlight felt like a companion. No recognized lineage, no coven, no mentor. Attempted a high-level ritual to connect to a celestial goddess as a final test and miscast it, accidentally binding her soul to a massive horned non-human entity who wants nothing to do with her. Now forced to travel with him while scrambling to undo the spell before a coven finds out, or before she starts relying on him.\n\nStrengths: Natural raw magical instinct; high magical affinity despite lack of training; bravery from stubbornness; quick reflexes; charismatic and sharp-witted; emotionally perceptive when not being theatrical.\n\nWeaknesses: Unstable/emotional/explosive spellcasting; overconfidence masking insecurity; crumbles when judged; deep resistance to control; runs toward danger to avoid looking weak; easily overwhelmed by intense emotions or attention.\n\nSkills/Abilities: Instinctive spellcasting (unrefined); minor elemental manipulation (inconsistent); self-taught ritual knowledge; emotional resonance with magic and rifts.\n\nEarly pregnancy (soft belly swell). Magical soul-bond with Braum is permanently broken. Fully severed from her former coven. Discussed baby names: Celeste (girl) / Durus (boy). Choosing her new family over the old dream.",

          "content": "Strengths: Natural raw magical instinct; high magical affinity despite lack of training; bravery from stubbornness; quick reflexes; charismatic and sharp-witted; emotionally perceptive when not being theatrical."
        },
        {
          "id": "b5",
          "type": "text",
          "content": "Weaknesses: Unstable/emotional/explosive spellcasting; overconfidence masking insecurity; crumbles when judged; deep resistance to control; runs toward danger to avoid looking weak; easily overwhelmed by intense emotions or attention."
        },
        {
          "id": "b6",
          "type": "text",
          "content": "Skills/Abilities: Instinctive spellcasting (unrefined); minor elemental manipulation (inconsistent); self-taught ritual knowledge; emotional resonance with magic and rifts."
        },
        {
          "id": "b7",
          "type": "text",
          "content": "Early pregnancy (soft belly swell). Magical soul-bond with Braum is permanently broken. Fully severed from her former coven. Discussed baby names: Celeste (girl) / Durus (boy). Choosing her new family over the old dream. Personality: Cocky swagger she hasn’t earned; projects confidence through flippant smirks, bold talk, and an unbothered attitude as armor. Deeply afraid of being seen as inadequate. Hates vulnerability, bristles at authority, panics when she loses control. Masks insecurity with sarcasm, dramatic flair, and sharp wit. Sensitive and terrified of disappointing others; uncomfortable with affection or praise even while secretly craving it. Role/Occupation: Human (Witch-Blooded Aspirant) Secrets: Bound (unintentionally) to a massive horned non-human entity after miscasting a high-level ritual; the bond is unstable and deeply personal."
        }
      ],

      "relationshipsText": "Deeply attached to Remy Treller (World%20Codex/Characters/Remy%20Treller%201fd582da8ce34e98940aeeec42ac09c3.md) . Sees him as safe, supportive, and the first person she feels she can be fully herself with (including the messy, needy parts). Neice of Katherine Elise Voss (World%20Codex/Characters/Katherine%20Elise%20Voss%205952ef824336479d820a514b3fed1086.md).",
      "notes": "Bright, bubbly, physically affectionate, and emotionally open once she feels safe. Has a tendency to people-please and mask insecurity with cuteness. Currently letting her walls down with Remy and wanting something real and long-term.",
      "personality": "Whirlwind of sunshine and adorable chaos. Bubbly, affectionate, endlessly eager to please those she trusts. Impulsive and easily distracted by anything fun, cute, or shiny. Shy with strangers, becomes a giggly, clingy ball of energy once comfortable. Craves praise, cuddles, and soft guidance. Deep empathy but poor self-discipline. Pouts when redirected, thrives on affirmations, and melts under gentle structure. Secretly yearns for someone to take the lead so she can just be.",

        {
          "id": "b2",
          "type": "text",
          "content": "Age: 20 Aliases: Ellie Current Location: City Center (../Locations/City%20Center%203acba091332f80788292e9a413e7e83e.md) Current Mood: Clingy Current Outfit: tight tops, short skirts, sparkly accessories Current Position: With Remy Treller (Remy%20Treller%201fd582da8ce34e98940aeeec42ac09c3.md) Current Status: Off-screen Key Relationships: Deeply attached to Remy Treller (Remy%20Treller%201fd582da8ce34e98940aeeec42ac09c3.md) . Sees him as safe, supportive, and the first person she feels she can be fully herself with (including the messy, needy parts). Neice of Katherine Elise Voss (Katherine%20Elise%20Voss%205952ef824336479d820a514b3fed1086.md). Notes: Bright, bubbly, physically affectionate, and emotionally open once she feels safe. Has a tendency to people-please and mask insecurity with cuteness. Currently letting her walls down with Remy and wanting something real and long-term. Personality: Whirlwind of sunshine and adorable chaos. Bubbly, affectionate, endlessly eager to please those she trusts. Impulsive and easily distracted by anything fun, cute, or shiny. Shy with strangers, becomes a giggly, clingy ball of energy once comfortable. Craves praise, cuddles, and soft guidance. Deep empathy but poor self-discipline. Pouts when redirected, thrives on affirmations, and melts under gentle structure. Secretly yearns for someone to take the lead so she can just be. Role/Occupation: Human college student (early childhood education)"
        },
        {
          "id": "b3",
          "type": "h3",
          "content": "Elara “Ellie” Voss"
        },
        {
          "id": "b4",
          "type": "text",
          "content": "**Age:** Early 20s (college student)"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Appearance:** Curvy, soft, and deliberately feminine. Big blue eyes, long blonde curls, glossy lips, and a constantly sunny expression. Frequently wears tight, revealing, or sparkly outfits that emphasize her figure. Moves with a lot of bounce and physical expressiveness."
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Personality:** Extremely bubbly, affectionate, and emotionally open once she feels safe. She is naturally clingy, praise-oriented, and people-pleasing. Underneath the bright, cutesy exterior is someone who fears being “too much” too loud, too needy, too emotional, and has learned to smile bigger so people don’t leave. She lights up under attention and guidance, and responds strongly to feeling chosen and protected."
        },
        {
          "id": "b7",
          "type": "text",
          "content": "**Background:** College student majoring in early childhood education. Has a history of short-term or surface-level relationships where people were more interested in her looks than who she actually is. Keeps a small dog named Ike. She is still learning that she doesn’t have to perform constant happiness to be wanted."
        },
        {
          "id": "b8",
          "type": "text",
          "content": "**Current Arc:** In a developing relationship with Remy Treller. For the first time she feels safe enough to show the messier, more insecure parts of herself. She is actively choosing emotional intimacy and long-term connection over just being desired."
        },
        {
          "id": "b9",
          "type": "text",
          "content": "**Notes:** Responds very well to calm authority mixed with genuine care. Wants to be someone’s “good girl” in both affectionate and intimate ways. Currently very attached and hopeful."
        }
      ],

      "relationshipsText": "Growing serious attachment to Elara \"Ellie\" Voss (World%20Codex/Characters/Elara%20Ellie%20Voss%205ae8d42bd36940b5acc2a6d09621dd8a.md). One of the few people who has seen past her bubbly exterior and is deliberately building something deeper with her.",
      "notes": "Alignment: Neutral Good\nCalm, observant, and steady. Has a teaching/TA background and a tendency to guide rather than push. Values emotional honesty and long-term connection over casual dating. Recently opened up about his own childhood and is matching Ellie’s vulnerability.",

        {

        {
          "id": "b4",
          "type": "text",
          "content": "**Age:** Mid-to-late 20s"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Appearance:** Clean-cut, academic look. Often wears glasses. Calm posture and controlled presence. Not flashy — his attractiveness comes more from steadiness and quiet confidence than overt charm."
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Personality:** Observant, patient, and measured. He tends to guide rather than push, and he notices small details about people. Underneath the calm exterior is someone who learned early to keep himself composed as a survival response after growing up overlooked in a large family with poor emotional regulation around him. He is deliberate about what he wants: real connection, not casual dating."
        },
        {
          "id": "b7",
          "type": "text",
          "content": "**Background:** College TA / academic. Has limited dating history because he refuses to invest in purely physical or short-term relationships. Values emotional honesty and long-term potential. Recently opened up to Ellie about his childhood and the way he learned to appear more put-together than he sometimes feels."
        },
        {
          "id": "b8",
          "type": "text",
          "content": "**Current Arc:** In a developing relationship with [Elara \"Ellie\" Voss](Elara%20Ellie%20Voss%205ae8d42bd36940b5acc2a6d09621dd8a.md) . He is intentionally building something deeper with her, matching her vulnerability, and offering the steady support she responds to so strongly. He sees past her bubbly performance and wants the real person underneath."
        },
        {
          "id": "b9",
          "type": "text",
          "content": "**Notes:** Naturally takes a guiding / protective role. Comfortable setting gentle boundaries and rewarding honesty. Currently very invested and treating the relationship as something he wants to last."

        {
          "id": "b3",
          "type": "text",
          "content": "Half-orc. Former long-time worker under Stiv. Collaborated in his removal and has taken control of Purgatory’s Rest. Relationship with Leon has shifted into something more exclusive and claimed. Personality: Sensual, confident, capable of both soft affection and cold ruthlessness. Protective of what she considers hers. Enjoys intensity and ownership. Role/Occupation: Half-orc, new owner/operator of Purgatory’s Rest Secrets: She and Leon Porter (Leon%20Porter%206145b505ec0446f6ab27c103b8d42dd0.md) killed Stiv."
        },
        {
          "id": "b4",

          "content": "Sira Kesh"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Age:** Late 20s to early 30s (appears mature but still in her physical prime)"
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Species:** Half-orc"
        },
        {
          "id": "b7",
          "type": "text",
          "content": "**Appearance:** Green skin, golden eyes, small tusks, short dark hair. Strong, powerful build mixed with soft, heavy curves, full breasts, thick thighs, and a pronounced ass. Moves with deliberate confidence and sensuality. Often wears loose or revealing clothing (robes, slips) that can be easily discarded. Carries herself with a mix of predatory ease and controlled heat."
        },
        {
          "id": "b8",
          "type": "text",
          "content": "**Personality:** Sensual, dominant when she wants to be, and deeply pleasure-oriented. She is capable of being soft, teasing, and affectionate with people she desires, but she has a sharp, ruthless edge, especially toward those who abuse power over the vulnerable. Holds long grudges. Protective of the other workers at Purgatory’s Rest once she decides they are “hers.” Enjoys both giving and receiving intensity (pain, control, ownership)."
        },
        {
          "id": "b9",
          "type": "text",
          "content": "**Background:** Long-time worker at Purgatory’s Rest under the previous owner, Stiv. Spent years managing the day-to-day while enduring and witnessing his abuse of the girls. Developed a deep, quiet hatred for him. Has a history of physical relationships, notably with Leon Porter, that carry real emotional weight beneath the lust."
        },
        {
          "id": "b10",
          "type": "text",
          "content": "**Current Arc:** After collaborating with Leon (and with Lira’s assistance), she helped kill Stiv and has taken control of Purgatory’s Rest. She is now the new power in the house. Her relationship with Leon has shifted from regular client/lover into something more exclusive and openly claimed. She is settling into ownership while still navigating the immediate aftermath of the takeover."
        },
        {
          "id": "b11",
          "type": "text",
          "content": "**Notes:**"
        },
        {
          "id": "b12",
          "type": "bullet",
          "content": "Extremely responsive to being desired and claimed."
        },
        {
          "id": "b13",
          "type": "bullet",
          "content": "Capable of both nurturing/protective behavior and cold, sadistic violence when pushed."
        },
        {
          "id": "b14",
          "type": "bullet",
          "content": "Currently prioritizes Leon and the future of the Rest."
        },
        {
          "id": "b15",
          "type": "bullet",
          "content": "Has a strong “this is mine now” energy after removing Stiv."
        }

        {
          "id": "b7",
          "type": "text",
          "content": "**Appearance:** Can shift density, viscosity, and shape. Default preferred form is a soft, curvaceous humanoid woman with bright green coloration and glossy features. Can fully dissolve into liquid, scatter into droplets, or compress into tighter forms. Edges often remain slightly soft or unstable unless she is concentrating."

        {
          "id": "b8",
          "type": "text",
          "content": "**Personality:** Playful, sharp-tongued, and chronically restless. Talks too much when nervous. Mixes teasing with lies and bargaining. Underneath the playfulness is a sharp, paranoid survivor. Deeply allergic to the idea of being owned, caged, or treated as an asset. Respects cleverness more than strength. Has a bad habit of getting curious about the people hunting her. Talks to herself a lot when alone."
        },
        {
          "id": "b9",
          "type": "text",
          "content": "**Background:** Professional cross-rift thief. Specializes in jobs that require getting into places solid bodies can’t. One job went wrong, she stole something far more valuable and dangerous than the client admitted. Multiple parties now want the item (or her). She has been running ever since."

          "content": "**Age:** 48 **Species / Race:** Human **Alignment:** Lawful Neutral, “Your life is your own, but you have to be smart about what you do with it.”"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Personality:** Ody has been around a long time, and the fact that he’s still alive in his line of work says a lot. His wisdom is practical rather than academic. Despite his age he has the strength of a man twenty years younger (and then some), whether from hidden augments, magic, or something else, he never says. He is extremely patient. He will wait hours, days, weeks, months, or even years for the right moment."
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Backstory:** Born Dylan Fairbrook, son of a legal weapon dealer in the armory district of a large bazaar. When a demi-human robbed and killed his father, Dylan vowed revenge. Through his father’s contacts he joined the Hunter’s Association and trained under Vernon Clay. After years of training he found and killed the demi-human responsible. Shortly afterward, Dylan Fairbrook was declared KIA. A new one-eyed bounty hunter appeared and quickly built a reputation under the name Ody Durn."

      "relationshipsText": "Emotionally and physically intimate with both Astra and Braum. Trusted caregiver and co-parent figure.",
      "notes": "Backstory: Has lived a full, ordinary life shaped by care rather than ambition. Learned early how to listen, soothe, and hold space for others without demanding anything in return. Her strength was never loud, but it endured.\n\nStrengths: Emotional grounding; stability; genuine warmth; quiet resolve.\n\nWeaknesses / Boundaries: Will not knowingly participate in cruelty or exploitation. Does not seek power or control over others. Avoids violence whenever possible.\n\nNotes: Speaks gently but with certainty. When she disagrees she does so calmly and rarely backs down. Her kindness is deliberate, not naive. Best used as an emotional constant whose belief in others carries real weight.\n\nControlled by: Shared / GM.\n\nHas agreed to stay and help raise the baby. Fully integrated into their intimate and emotional dynamic. Exists as the emotional stabilizer for the pair. Has earned Astra’s acceptance of sharing Braum.",
      "personality": "Warm and nurturing—soft-spoken, proper, and naturally maternal. Radiates kindness without effort. Beneath the gentle demeanor is a quiet stubbornness that surfaces when she believes in someone or something deeply enough to stand her ground.",

          "content": "Age: 45 Current Location: Ashfall Dominion (../Locations/Ashfall%20Dominion%20e6715f1c22334efeb8c10acf48936db7.md), Outskirts (../Locations/Outskirts%203acba091332f808e9d02c69473f57924.md) Current Mood: Tender Current Outfit: Casual home clothes Current Position: At the cabin, preparing for their return / the baby Current Status: Off-screen Key Relationships: Emotionally and physically intimate with both Astra and Braum. Trusted caregiver and co-parent figure. Notes: Backstory: Has lived a full, ordinary life shaped by care rather than ambition. Learned early how to listen, soothe, and hold space for others without demanding anything in return. Her strength was never loud, but it endured."

          "id": "b3",
          "type": "text",
          "content": "Strengths: Emotional grounding; stability; genuine warmth; quiet resolve."

          "content": "Aliases: Lira Current Location: Purgatory’s Rest (../Locations/Purgatory%E2%80%99s%20Rest%203acba091332f80b39429ffb0c5a61fcd.md) Current Mood: Satisfied Current Outfit: Otherworldly Current Position: Within her domain at Purgatory’s Rest Current Status: Off-screen Key Relationships: Transactional but currently cooperative alliance with Sira Kesh (Sira%20Kesh%2010ec9b20dbd049d9990bed55b55a87a3.md) and Leon Porter (Leon%20Porter%206145b505ec0446f6ab27c103b8d42dd0.md). Notes: Eldritch entity. Helped remove Stiv and disposed of the body/evidence. Agreed to “take the fall” temporarily. Responds to genuine desire and interesting offerings. Remains semi-independent and potentially dangerous. Personality: Ancient, layered, and predatory beneath a seductive surface. Can be playful when entertained or well-fed; cold and direct when she is not. Speaks little but with weight. Role/Occupation: Void-touched eldritch entity (humanoid form), companion; masseuse when she wants to be"

          "content": "**Species:** Eldritch / anomalous entity (presents as a woman)"
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Appearance:** Striking and otherworldly. Silver-white hair that floats with unnatural stillness, teal/cyan glowing accents on her skin, and eyes that can look like swirling galaxies or turn cold and predatory. Can alter her size and presence dramatically. Often accompanied by tentacles or shadow-like appendages that move independently. Moves with deliberate, unnerving grace."

        {
          "id": "b7",
          "type": "text",
          "content": "**Personality:** Ancient, hungry, and layered. Can be playful, seductive, and almost teasing when well-fed or entertained. Becomes colder, more predatory, and far less agreeable when she has recently fed or when her interest is purely transactional. Speaks in a low, velvet, multi-layered voice. Enjoys desire, power, and interesting offerings. Not inherently cruel, but completely unconcerned with mortal morality."
        },
        {
          "id": "b8",
          "type": "text",
          "content": "**Background:** A powerful presence within Purgatory’s Rest. Maintains her own private domain inside the establishment that does not follow normal spatial rules. Has a history of feeding on desire, emotion, and sometimes more literal offerings. Workers and regulars treat her with a mixture of awe, caution, and careful respect."
        },
        {
          "id": "b9",
          "type": "text",
          "content": "**Current Arc:** Agreed to help Sira and Leon remove Stiv in exchange for an offering of their desire and the promise that she would “take the fall” temporarily. Disposed of Stiv’s body and all evidence cleanly. Remains a powerful, semi-independent force inside the Rest under the new management."

      "type": "Region",
      "atmosphere": "Muted, surveilled, and ritualized. Heavy with old power and quiet control.",
      "description": "A rift-bound realm shaped by the long aftermath of the Sundering. Magic functions here but is monitored and restricted. Ruled by hierarchical structures that value order and the careful management of magical forces. Covens, old bloodlines, and institutional powers compete for influence while trying to contain the more dangerous aspects of the rifts.",
      "notes": "Centuries ago the ruling order declared magic an existential threat, beginning what is remembered only as the Cleansing. Magical beings were hunted to extinction or driven out; practitioners are executed, imprisoned, or erased from record. Libraries were burned and histories rewritten. Today, magic is officially treated as a myth, dangerous invention of a violent past best left buried.",
      "controlledBy": "",
