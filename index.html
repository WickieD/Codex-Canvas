        {
          "id": "b2",
          "type": "text",
          "content": "Related Locations: Outskirts (Outskirts%203acba091332f808e9d02c69473f57924.md) Atmosphere: Muted, surveilled, and ritualized. Heavy with old power and quiet control. Description: A rift-bound realm shaped by the long aftermath of the Sundering. Magic functions here but is monitored and restricted. Ruled by hierarchical structures that value order and the careful management of magical forces. Covens, old bloodlines, and institutional powers compete for influence while trying to contain the more dangerous aspects of the rifts. Key Characters: Astra Nyx (../Characters/Astra%20Nyx%209583c281c96a463287965af198eab23f.md), Braum Iron Horn (../Characters/Braum%20Iron%20Horn%20293d8755c7204d2f890383f17646ec90.md), Grace (../Characters/Grace%20d7ab913a881c448c86237a50106aac4a.md), Martha (../Characters/Martha%207062ca24002e4df7a2926acab38fba6e.md), Veldrin Thorn (../Characters/Veldrin%20Thorn%20baaeff15b15143da8c17b1130ee290de.md) Notes: Centuries ago the ruling order declared magic an existential threat, beginning what is remembered only as the Cleansing. Magical beings were hunted to extinction or driven out; practitioners are executed, imprisoned, or erased from record. Libraries were burned and histories rewritten. Today, magic is officially treated as a myth, dangerous invention of a violent past best left buried. Type: Region"
        },
        {
          "id": "b3",
          "type": "h3",
          "content": "Ashfall Dominion"
        },
        {
          "id": "b4",
          "type": "text",
          "content": "**Type:** Region"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Atmosphere:**"
        },
        {
          "id": "b6",
          "type": "text",
          "content": "Muted, surveilled, and ritualized. The air feels heavy with old power and quiet control. Magic is present but tightly watched. There is a constant sense that something older and larger is being held in check."
        },
        {
          "id": "b7",
          "type": "text",
          "content": "**Description:**"
        },
        {
          "id": "b8",
          "type": "text",
          "content": "A rift-bound realm shaped by the long aftermath of the Sundering. The Dominion is ruled by structures that value order, hierarchy, and the careful management of magical forces. Public life is controlled and often ritualized. Power is not only political or military — it is also magical and deeply tied to the rifts themselves."
        },
        {
          "id": "b9",
          "type": "text",
          "content": "Unlike Nullspire, magic functions here, but it is monitored and restricted. Covens, old bloodlines, and institutional forces all compete for influence while trying to keep the more dangerous aspects of the rifts contained. The landscape carries the scars of past fractures — places where reality still feels thin."
        },
        {
          "id": "b10",
          "type": "text",
          "content": "**Key Features:**"
        },
        {
          "id": "b11",
          "type": "bullet",
          "content": "Active magic (but regulated)"
        },
        {
          "id": "b12",
          "type": "bullet",
          "content": "Strong presence of covens and old power structures"
        },
        {
          "id": "b13",
          "type": "bullet",
          "content": "Rift activity and residual instability"
        },
        {
          "id": "b14",
          "type": "bullet",
          "content": "Hierarchical and often secretive governance"
        },
        {
          "id": "b15",
          "type": "bullet",
          "content": "Tension between tradition, control, and the unpredictable nature of the rifts"
        },
        {
          "id": "b16",
          "type": "text",
          "content": "**Notes:**"
        },
        {
          "id": "b17",
          "type": "text",
          "content": "Primary setting for the Astra / Braum arc. Contains locations such as the outskirts, remote cabins, and sites of coven activity. The Dominion responds quickly to major rift events."
        },

      "description": "A unique anomalous hub that serves as a crossroads between different realities. People, goods, and sometimes fragments of other worlds pass through here. Not fully bound by the rules of any single region. Mixed populations from magical, technological, and hybrid environments are common.",
      "notes": "Functions as both a practical transit point and a strange neutral ground. Reality feels thinner here by design. Useful as a meeting point, escape route, or place where unlikely characters can cross paths.",

        {
          "id": "b2",
          "type": "text",
          "content": "Related Locations: Purgatory’s Rest (Purgatory%E2%80%99s%20Rest%203acba091332f80b39429ffb0c5a61fcd.md) Atmosphere: Crowded liminality. Constant movement and overlapping realities. Feels like a place that exists between other places. Description: A unique anomalous hub that serves as a crossroads between different realities. People, goods, and sometimes fragments of other worlds pass through here. Not fully bound by the rules of any single region. Mixed populations from magical, technological, and hybrid environments are common. Notes: Functions as both a practical transit point and a strange neutral ground. Reality feels thinner here by design. Useful as a meeting point, escape route, or place where unlikely characters can cross paths. Type: Transit Point"
        },
        {
          "id": "b3",
          "type": "h3",
          "content": "Transit Station"
        },
        {
          "id": "b4",
          "type": "text",
          "content": "**Type:** Anomalous Hub / Transit Point"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Atmosphere:**"
        },
        {
          "id": "b6",
          "type": "text",
          "content": "Crowded liminality. Constant movement and overlapping realities. Feels like a place that exists between other places rather than belonging fully to any one of them. Time, culture, and even physics can feel slightly off."
        },
        {
          "id": "b7",
          "type": "text",
          "content": "**Description:**"
        },
        {
          "id": "b8",
          "type": "text",
          "content": "A unique and anomalous hub within the wider rift-affected world. Transit Station serves as a crossroads where people, goods, and sometimes entire fragments of reality pass through. It is not fully bound by the rules of any single region. Beings from pure science-fiction environments, magical realms, and everything in between can be found here."
        },
        {
          "id": "b9",
          "type": "text",
          "content": "It functions as both a practical transit point and a strange neutral ground. Authority is fragmented, and the station itself seems to operate by its own loose internal logic. It is one of the few places where the barriers between different kinds of worlds feel thin by design rather than by accident."
        },
        {
          "id": "b10",
          "type": "text",
          "content": "**Key Features:**"
        },
        {
          "id": "b11",
          "type": "bullet",
          "content": "Constant arrival and departure of travelers from many different realities"
        },
        {
          "id": "b12",
          "type": "bullet",
          "content": "Mixed populations (magical, technological, and everything between)"
        },
        {
          "id": "b13",
          "type": "bullet",
          "content": "Fragmented authority / no single clear ruling power"
        },
        {
          "id": "b14",
          "type": "bullet",
          "content": "Strong sense of being “between” places"
        },
        {
          "id": "b15",
          "type": "text",
          "content": "**Notes:**"
        },
        {
          "id": "b16",
          "type": "text",
          "content": "Useful as a meeting point, escape route, or place where unlikely characters can cross paths. Reality feels less stable here than in controlled regions like Nullspire, but less overtly dangerous than active rift zones."
        }

          "content": "Mix of workers: normies, chromies, and cys"
        },
        {
          "id": "b18",
          "type": "text",
          "content": "**Current Situation:**"
        },
        {
          "id": "b19",
          "type": "bullet",
          "content": "Noel Hollow (awakened android, formerly ND-03) is living there under Jared’s protection"
        },
        {
          "id": "b20",
          "type": "bullet",
          "content": "Ongoing tension with Alexander Lecker"
        },
        {
          "id": "b21",
          "type": "bullet",
          "content": "The ranch is being used as a safe place while Noel stays hidden from Globex"
        },
        {
          "id": "b22",
          "type": "text",
          "content": "**Notes:**"
        },
        {
          "id": "b23",
          "type": "text",
          "content": "Jared treats the ranch as both a business and a kind of unofficial refuge. People who cause serious problems get removed quickly. The place has a strong “second chance” culture, but it is not soft, rules are enforced."
        }

      "description": "A fractured near-future where the line between human, chrome, and synthetic is blurred. Corporations, crime syndicates, and the desperate fight for survival under neon lights and dust storms. People with dark pasts try to carve out second chances in the margins.",
      "notes": "Focuses on found family, protection, and the rare possibility of real connection between people (or machines) who were never meant to have it. Redline Gulch Ranch is a key location.",
      "controlledBy": "",
      "keyCharacterIds": [
        "0146b2f5ff7f4358b239253fa2ec192e",
        "a5b6a3e6dd1745cda46dd4b3a4062269",
        "ef13c6730cdb4c3e897714b56937fbd2"
      ],
      "relatedLocationIds": [
        "3acba091332f80628a0ed25f1cda7cb0",

      ],
      "parentLocationId": "",
      "blocks": [
        {
          "id": "b1",
          "type": "h1",
          "content": "Neo Eden"
        },
        {
          "id": "b2",
          "type": "text",
          "content": "Related Locations: Redline Gulch Ranch (Redline%20Gulch%20Ranch%203acba091332f80628a0ed25f1cda7cb0.md), Chrome Hollow (Chrome%20Hollow%203acba091332f809b90a7e90160b19194.md) Atmosphere: Gritty cyberpunk with heart. High-tech, low-life, but with real loyalty and found family. Description: A fractured near-future where the line between human, chrome, and synthetic is blurred. Corporations, crime syndicates, and the desperate fight for survival under neon lights and dust storms. People with dark pasts try to carve out second chances in the margins. Key Characters: Jared \"Chromewall\" Hollow (../Characters/Jared%20Chromewall%20Hollow%20dffaa935a642401c8c1dfb44e23a1dd9.md), Noel (ND-03) (../Characters/Noel%20(ND-03)%200146b2f5ff7f4358b239253fa2ec192e.md), Alexander Lecker (../Characters/Alexander%20Lecker%20a5b6a3e6dd1745cda46dd4b3a4062269.md), Ted “Rip” Fairis (../Characters/Ted%20%E2%80%9CRip%E2%80%9D%20Fairis%20ef13c6730cdb4c3e897714b56937fbd2.md) Notes: Focuses on found family, protection, and the rare possibility of real connection between people (or machines) who were never meant to have it. Redline Gulch Ranch is a key location. Type: Region"
        },
        {
          "id": "b3",
          "type": "divider",
          "content": ""
        },
        {
          "id": "b4",
          "type": "h3",
          "content": "Neon Eden"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Tone:** Gritty cyberpunk with heart. High-tech, low-life, but with pockets of real loyalty and found family."
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Core Idea:**"
        },
        {
          "id": "b7",
          "type": "text",
          "content": "A fractured near-future where the line between human, chrome, and synthetic is blurred. Corporations, crime syndicates, and the desperate all fight for survival under neon lights and dust storms. People with dark pasts try to carve out second chances in the margins."
        },
        {
          "id": "b8",
          "type": "text",
          "content": "**Major Elements:**"
        },
        {
          "id": "b9",
          "type": "bullet",
          "content": "**Chrome / Augments:** Cybernetic enhancements are common. Some people are more machine than flesh (Chromies). Full androids also exist, though most are tightly controlled."
        },
        {
          "id": "b10",
          "type": "bullet",
          "content": "**Androids (Andis):** Synthetic beings built for service, care, or labor. Most are property. Awakened androids (ones that develop true self-awareness) are rare and usually hunted for deconstruction."
        },
        {
          "id": "b11",
          "type": "bullet",
          "content": "**Globex:** A powerful corporation involved in advanced android development and medical tech. Ruthless about reclaiming their property."
        },
        {
          "id": "b12",
          "type": "bullet",
          "content": "**The Ranch System:** Places like Redline Gulch Ranch exist as unofficial second-chance sanctuaries. Run by people with heavy pasts, they take in chromies, normies, and others who need a place to disappear or start over."
        },
        {
          "id": "b13",
          "type": "bullet",
          "content": "**Social Layers:**"
        },
        {
          "id": "b14",
          "type": "bullet",
          "content": "Normies (mostly organic humans)"
        },
        {
          "id": "b15",
          "type": "bullet",
          "content": "Chromies (heavily augmented)"
        },
        {
          "id": "b16",
          "type": "bullet",
          "content": "Cys (full or near-full synthetics)"
        },
        {
          "id": "b17",
          "type": "bullet",
          "content": "Andis (androids)"
        },
        {
          "id": "b18",
          "type": "text",
          "content": "**Known Locations:**"
        },
        {
          "id": "b19",
          "type": "bullet",
          "content": "**Redline Gulch Ranch** - Remote working ranch run by Jared “Chromewall” Hollow. Functions as both a legitimate cattle operation and a quiet refuge."
        },
        {
          "id": "b20",
          "type": "bullet",
          "content": "**Chrome Hallow** - Referenced urban/industrial area (details still limited)."
        },
        {
          "id": "b21",
          "type": "text",
          "content": "**Current Tone in Story:**"
        },
        {
          "id": "b22",
          "type": "text",
          "content": "Despite the harsh world, the focus is on found family, protection, and the rare possibility of real connection between people (or machines) who were never meant to have it."
        }
      ],
      "favorite": false,
      "updatedAt": "2026-07-29T15:50:00-07:00"
    },
    {
      "id": "3acba091332f80788292e9a413e7e83e",
      "name": "City Center",
      "type": "Urban District",
      "atmosphere": "Coldly efficient and tightly controlled. Clean, regulated, and quietly surveilled.",
      "description": "The administrative and corporate heart of Nullspire. Seat of real power in the region, corporate offices, enforcement systems, and the strongest point of the magic suppression field. Architecture is sharp, modern, and designed for order over comfort. Magic does not function here at all.",
      "notes": "Most tightly regulated district in Nullspire. Heavy surveillance and controlled movement. Magical beings feel immediate pressure and loss of power. Ideal for stories involving corporate control, investigation, or the psychological cost of suppression.",
      "controlledBy": "",
      "keyCharacterIds": [
        "5952ef824336479d820a514b3fed1086",
        "d1569813303f48dc9d7cfa8a4983b886",
        "1fd582da8ce34e98940aeeec42ac09c3"
      ],
      "relatedLocationIds": [
        "f6515bf1660b4bf7bf30fcc08139705c"
      ],
      "parentLocationId": "f6515bf1660b4bf7bf30fcc08139705c",
      "blocks": [
        {
          "id": "b1",
          "type": "h1",
          "content": "City Center"
        },
        {
          "id": "b2",
          "type": "text",
          "content": "Related Locations: Nullspire (Nullspire%20f6515bf1660b4bf7bf30fcc08139705c.md) Atmosphere: Coldly efficient and tightly controlled. Clean, regulated, and quietly surveilled. Description: The administrative and corporate heart of Nullspire. Seat of real power in the region, corporate offices, enforcement systems, and the strongest point of the magic suppression field. Architecture is sharp, modern, and designed for order over comfort. Magic does not function here at all. Key Characters: Katherine Elise Voss (../Characters/Katherine%20Elise%20Voss%205952ef824336479d820a514b3fed1086.md), Obadiah Amos Lancer (../Characters/Obadiah%20Amos%20Lancer%20d1569813303f48dc9d7cfa8a4983b886.md), Elara \"Ellie\" Voss (../Characters/Elara%20Ellie%20Voss%205ae8d42bd36940b5acc2a6d09621dd8a.md), Remy Treller (../Characters/Remy%20Treller%201fd582da8ce34e98940aeeec42ac09c3.md) Notes: Most tightly regulated district in Nullspire. Heavy surveillance and controlled movement. Magical beings feel immediate pressure and loss of power. Ideal for stories involving corporate control, investigation, or the psychological cost of suppression. Type: Urban District"
        },
        {
          "id": "b3",
          "type": "h3",
          "content": "City Center"
        },
        {
          "id": "b4",
          "type": "text",
          "content": "**Type:** Urban District / Administrative Core"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Parent Location:** Nullspire"
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Atmosphere:**"
        },
        {
          "id": "b7",
          "type": "text",
          "content": "Coldly efficient and tightly controlled. Everything feels deliberate — clean streets, regulated movement, quiet surveillance. There is very little chaos here. The air itself seems managed. People move with purpose, and anything out of place is noticed quickly."
        },
        {
          "id": "b8",
          "type": "text",
          "content": "**Description:**"
        },
        {
          "id": "b9",
          "type": "text",
          "content": "City Center is the administrative and corporate heart of Nullspire. It is where the region’s real power sits: corporate offices, enforcement infrastructure, data hubs, and the systems that maintain the suppression field. The architecture is sharp, modern, and intentionally inhuman in its precision. Glass, steel, and controlled lighting dominate. Public spaces are designed more for flow and order than comfort."
        },
        {
          "id": "b10",
          "type": "text",
          "content": "Magic does not function here at all. The suppression is strongest in this district. Magical beings feel it immediately — a heavy, isolating pressure that strips them of power and often leaves them disoriented or psychologically strained with prolonged exposure."
        },
        {
          "id": "b11",
          "type": "text",
          "content": "Publicly, City Center is presented as the shining proof that order and progress can exist without the instability of magic or uncontrolled elements. Privately, it is a place of quiet enforcement, where compliance is maintained through infrastructure, surveillance, and social pressure rather than open violence."
        },
        {
          "id": "b12",
          "type": "text",
          "content": "**Key Features:**"
        },
        {
          "id": "b13",
          "type": "bullet",
          "content": "Strongest point of the magic suppression field"
        },
        {
          "id": "b14",
          "type": "bullet",
          "content": "Corporate and administrative headquarters"
        },
        {
          "id": "b15",
          "type": "bullet",
          "content": "Heavy surveillance and controlled movement"
        },
        {
          "id": "b16",
          "type": "bullet",
          "content": "Very little visible disorder or street-level chaos"
        },
        {
          "id": "b17",
          "type": "bullet",
          "content": "Restricted access for non-humans and known magical individuals"
        },
        {
          "id": "b18",
          "type": "text",
          "content": "**Notes:**"
        },
        {
          "id": "b19",
          "type": "text",
          "content": "This is the most tightly regulated part of Nullspire. Ideal for stories involving corporate power, control, investigation, or the psychological cost of living (or being trapped) in a fully suppressed environment."
        }
      ],
      "favorite": false,
      "updatedAt": "2026-07-29T15:50:00-07:00"
    },
    {
      "id": "3acba091332f808e9d02c69473f57924",
      "name": "Outskirts",
      "type": "Settlement",
      "atmosphere": "Quiet, sparse, and watchful. Feels farther from rigid control. Magic is more present, and the land still carries old rift scars.",
      "description": "The outer reaches of Ashfall Dominion. Less tightly governed than the central areas. A mix of scattered settlements, isolated cabins, old roads, and land where residual rift activity can still be felt. People come here to stay unnoticed or to operate outside stricter Dominion control.",
      "notes": "Lower official presence and slower enforcement. Higher chance of residual rift activity. Includes remote cabins, river clearings, and sites of coven activity. Useful middle ground between full Dominion control and true wilderness.",
      "controlledBy": "",
      "keyCharacterIds": [
        "7062ca24002e4df7a2926acab38fba6e",
        "d7ab913a881c448c86237a50106aac4a",
        "293d8755c7204d2f890383f17646ec90",

      ],
      "relatedLocationIds": [
        "e6715f1c22334efeb8c10acf48936db7"
      ],
      "parentLocationId": "e6715f1c22334efeb8c10acf48936db7",
      "blocks": [
        {
          "id": "b1",
          "type": "h1",
          "content": "Outskirts"
        },
        {
          "id": "b2",
          "type": "text",
          "content": "Related Locations: Ashfall Dominion (Ashfall%20Dominion%20e6715f1c22334efeb8c10acf48936db7.md) Atmosphere: Quiet, sparse, and watchful. Feels farther from rigid control. Magic is more present, and the land still carries old rift scars. Description: The outer reaches of Ashfall Dominion. Less tightly governed than the central areas. A mix of scattered settlements, isolated cabins, old roads, and land where residual rift activity can still be felt. People come here to stay unnoticed or to operate outside stricter Dominion control. Key Characters: Martha (../Characters/Martha%207062ca24002e4df7a2926acab38fba6e.md), Grace (../Characters/Grace%20d7ab913a881c448c86237a50106aac4a.md), Braum Iron Horn (../Characters/Braum%20Iron%20Horn%20293d8755c7204d2f890383f17646ec90.md), Astra Nyx (../Characters/Astra%20Nyx%209583c281c96a463287965af198eab23f.md) Notes: Lower official presence and slower enforcement. Higher chance of residual rift activity. Includes remote cabins, river clearings, and sites of coven activity. Useful middle ground between full Dominion control and true wilderness. Type: Settlement"
        },
        {
          "id": "b3",
          "type": "h3",
          "content": "The Outskirts"
        },
        {
          "id": "b4",
          "type": "text",
          "content": "**Type:** Border / Rural Zone"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Parent Location:** Ashfall Dominion"
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Atmosphere:**"
        },
        {
          "id": "b7",
          "type": "text",
          "content": "Quiet, sparse, and watchful. Feels farther from the rigid control of the inner Dominion. Magic is more present here, and the land still carries the scars of old rifts. Safer for those who want to stay unnoticed, but also more exposed to the unpredictable."
        },
        {
          "id": "b8",
          "type": "text",
          "content": "**Description:**"
        },
        {
          "id": "b9",
          "type": "text",
          "content": "The outer reaches of Ashfall Dominion. Less tightly governed than the central areas, the Outskirts are a mix of scattered settlements, isolated cabins, old roads, and stretches of land where the presence of rifts can still be felt. It is a place where people go when they want distance from the Dominion’s stricter order, or when they need to hide."
        },
        {
          "id": "b10",
          "type": "text",
          "content": "Coven activity, independent practitioners, and those living outside official structures are more common here. Enforcement still exists, but it is thinner and slower to respond than in the core regions."
        },
        {
          "id": "b11",
          "type": "text",
          "content": "**Key Features:**"
        },
        {
          "id": "b12",
          "type": "bullet",
          "content": "Lower official presence"
        },
        {
          "id": "b13",
          "type": "bullet",
          "content": "Higher chance of residual rift activity"
        },
        {
          "id": "b14",
          "type": "bullet",
          "content": "Scattered cabins, small settlements, and old paths"
        },
        {
          "id": "b15",
          "type": "bullet",
          "content": "More room for unofficial or hidden groups to operate"
        },
        {
          "id": "b16",
          "type": "text",
          "content": "**Notes:**"
        },
        {
          "id": "b17",
          "type": "text",
          "content": "Primary area for much of the Astra and Braum story. Includes remote cabins, river clearings, and sites of coven activity. A useful middle ground between full Dominion control and true wilderness."
        }
      ],
      "favorite": false,
      "updatedAt": "2026-07-29T15:50:00-07:00"

      "description": "A brothel and pleasure house on 101 Transition Ave, marked by a neon red sign. Offers drinks, massages, private rooms, and companionship. Some private chambers are magically altered. Formerly run by the corrupt owner Stiv. After his removal, Sira Kesh has taken control with Leon Porter closely involved.",
      "notes": "Stiv was killed and removed with assistance from Lira. The house is now free of his abusive management. The transition is still fresh. Driven by personal desire, resentment, and the goal of protecting the workers.",
      "controlledBy": "Sira Kesh (World%20Codex/Characters/Sira%20Kesh%2010ec9b20dbd049d9990bed55b55a87a3.md)",

      "blocks": [

        },
        {
          "id": "b2",
          "type": "text",
          "content": "Related Locations: Transit Station (Transit%20Station%20702469d87aa74af29363676e86dd5570.md) Atmosphere: Warm, heavy, and indulgent on the surface. Previously marked by exploitation and fear. Now shifting toward something freer, though still raw and hedonistic. Controlled By: Sira Kesh (../Characters/Sira%20Kesh%2010ec9b20dbd049d9990bed55b55a87a3.md) Description: A brothel and pleasure house on 101 Transition Ave, marked by a neon red sign. Offers drinks, massages, private rooms, and companionship. Some private chambers are magically altered. Formerly run by the corrupt owner Stiv. After his removal, Sira Kesh has taken control with Leon Porter closely involved. Key Characters: Sira Kesh (../Characters/Sira%20Kesh%2010ec9b20dbd049d9990bed55b55a87a3.md), Lirael “Lira” Nyx (../Characters/Lirael%20%E2%80%9CLira%E2%80%9D%20Nyx%20b862fd661f7a4a23aa62dffda06be796.md), Leon Porter (../Characters/Leon%20Porter%206145b505ec0446f6ab27c103b8d42dd0.md) Notes: Stiv was killed and removed with assistance from Lira. The house is now free of his abusive management. The transition is still fresh. Driven by personal desire, resentment, and the goal of protecting the workers. Type: Brothel"
        },
        {
          "id": "b3",
          "type": "h3",
          "content": "Purgatory’s Rest"
        },
        {
          "id": "b4",
          "type": "text",
          "content": "**Type:** Brothel / Pleasure House"
        },
        {
          "id": "b5",
          "type": "text",
          "content": "**Parent Location:** Transit Station (101 Transition Ave)"
        },
        {
          "id": "b6",
          "type": "text",
          "content": "**Atmosphere:**"
        },
        {
          "id": "b7",
          "type": "text",
          "content": "Warm, heavy, and indulgent on the surface, perfume, cigarettes, alcohol, sex, and low light. Previously carried a strong undercurrent of exploitation and fear. Now shifting toward something freer, though still raw and hedonistic."
        },
        {
          "id": "b8",
          "type": "text",
          "content": "**Description:**"
        },
        {
          "id": "b9",
          "type": "text",
          "content": "A well-known brothel and pleasure house operating out of what looks like a normal hotel, marked by a neon red sign. It offers drinks, massages, private rooms, and companionship. Some private chambers are magically altered, allowing them to become entirely different environments."
        },
        {
          "id": "b10",
          "type": "text",
          "content": "Formerly run by a corrupt and abusive owner named Stiv. After a coordinated effort by [Sira Kesh](../Characters/Sira%20Kesh%2010ec9b20dbd049d9990bed55b55a87a3.md) and [Leon Porter](../Characters/Leon%20Porter%206145b505ec0446f6ab27c103b8d42dd0.md)  (with assistance from [Lirael “Lira” Nyx](../Characters/Lirael%20%E2%80%9CLira%E2%80%9D%20Nyx%20b862fd661f7a4a23aa62dffda06be796.md) ), Stiv was killed and removed. Sira has taken control of the establishment. The house is now free of his management, though the transition is still fresh."
        },
        {
          "id": "b11",
          "type": "text",
          "content": "**Key Features:**"
        },
        {
          "id": "b12",
          "type": "bullet",
          "content": "Front desk and bar area"
        },
        {
          "id": "b13",
          "type": "bullet",
          "content": "Massage rooms"
        },
        {
          "id": "b14",
          "type": "bullet",
          "content": "Magically expandable/alterable private chambers"
        },
        {
          "id": "b15",
          "type": "bullet",
          "content": "Mix of workers (including non-human and anomalous beings)"
        },
        {
          "id": "b16",
          "type": "bullet",
          "content": "Recently changed ownership/management"
        },
        {
          "id": "b17",
          "type": "text",
          "content": "**Current Status:**"
        },
        {
          "id": "b18",
          "type": "text",
          "content": "Under Sira Kesh’s control following the removal of Stiv. Leon Porter is closely involved. Lira remains a powerful and dangerous presence within the house when she is around."
        },
        {
          "id": "b19",
          "type": "text",
          "content": "**Notes:**"
        },
        {
          "id": "b20",
          "type": "text",
          "content": "The takeover was driven by a mix of personal desire, long-held resentment, and the goal of protecting the workers. The future direction of the Rest is still settling."
        }
      ],

      "goal": "Avoid decommissioning; obtain rights/recognition where possible; conceal or protect emergent sentience.",
      "power": "Minor",

      "power": "Major",
      "notes": "Heavily mechanized, only key biological components usually remain (brain, heart, lungs, spinal core). Often pass as human with artificial skin. Frequently treated as tools rather than people. Sent where others will not survive. Autonomy varies; some retain legal personhood, others do not.\n\nCommon roles: combat operatives, suicide-mission assets, hazard response, deep-space or rift-zone personnel.\n\nSocial tension note: Cys are feared, respected, and quietly pitied.",
