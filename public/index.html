    el.main.innerHTML = `${pageHead('Connections','Story & Relationship Graphs','Use a story path when order matters, or switch to a general relationship view for broader connections.', `<button class="button secondary" type="button" data-nav="locations">Location tree</button>`)}
      <div class="graph-toolbar">
        <div class="property-row"><label>Graph</label><select class="select" id="graphType"><option value="story" ${graphSettings.graphType==='story'?'selected':''}>Story</option><option value="locations" ${graphSettings.graphType==='locations'?'selected':''}>Locations</option><option value="characters" ${graphSettings.graphType==='characters'?'selected':''}>People</option><option value="world" ${graphSettings.graphType==='world'?'selected':''}>Whole world</option></select></div>
        <div class="property-row"><label>Layout</label><select class="select" id="graphLayout">${layouts.map(([value,label])=>`<option value="${value}" ${graphSettings.layout===value?'selected':''}>${label}</option>`).join('')}</select></div>
        ${thirdControl}
      </div>
      ${storySummaryHtml()}
      <section class="graph-reading-guide" aria-label="How to read this graph">
        <div><span class="eyebrow">How to read this view</span><h2>${esc(guide.title)}</h2><p>${esc(guide.copy)}</p></div>
        <div class="graph-reading-key">${graphNodeKey()}<span class="graph-key-row"><span class="graph-key-line"></span><strong>${graphSettings.graphType==='story'?'Story direction':'Direct or structural connection'}</strong></span>${graphSettings.graphType==='story'?'':`<span class="graph-key-row"><span class="graph-key-line dashed"></span><strong>Related or secondary connection</strong></span>`}</div>
      </section>
      <section class="graph-filter-panel" aria-label="Graph filters">
        <div class="graph-filter-heading"><div><h2>What appears in the graph</h2><p>Uncheck anything you want hidden. Recheck it to add it back.</p></div><div class="graph-filter-actions"><button class="button secondary small" type="button" data-graph-items="all">Select all items</button><button class="button ghost small" type="button" data-graph-items="none">Clear all items</button><button class="button ghost small" type="button" data-reset-graph-layout>Reset positions</button></div></div>
        <div class="graph-filter-grid">
          <fieldset class="graph-filter-group"><legend>Item types</legend><div class="graph-check-row">${typeOptions.map(option=>graphCheckbox(`type:${option.key}`,option.label,graphSettings.visibleTypes[option.key] !== false,'data-graph-type')).join('')}</div></fieldset>
          <fieldset class="graph-filter-group"><legend>Connections</legend><div class="graph-check-row">${relationOptions.map(option=>graphCheckbox(`relation:${option.key}`,option.label,graphSettings.visibleRelations[option.key] !== false,'data-graph-relation')).join('')}</div></fieldset>
        </div>
        <details class="graph-item-details"><summary>Included ${includedLabel} <span id="graphItemCount">${items.filter(item=>!graphSettings.hiddenNodeIds.includes(item.nodeId)).length} of ${items.length}</span></summary><div class="graph-item-list">${items.map(item=>graphCheckbox(item.nodeId,item.label,!graphSettings.hiddenNodeIds.includes(item.nodeId),'data-graph-node',item.type)).join('')}</div></details>
      </section>
      <div class="graph-visual-grid">
        <div class="graph-stage" id="graphStage"><svg id="graphSvg" role="img" aria-label="Interactive story and relationship graph"></svg><div class="graph-legend" id="graphLegend"></div></div>
        <aside class="graph-inspector" id="graphInspector" aria-live="polite">${graphSettings.graphType==='story'?'<span class="eyebrow">Story graph</span><h2>Choose a story point</h2><p class="graph-empty-inspector">Tap a circle to preview that part of the RP. Drag a circle to rearrange the story map.</p>':'<span class="eyebrow">Connection details</span><h2>Select a circle</h2><p class="graph-empty-inspector">Select an item to see why it is connected. Double-click a circle to open its full page.</p>'}</aside>
      </div>
      <p class="graph-help">${esc(help)}</p>`;
    requestAnimationFrame(drawGraph);
  }

  function graphCheckbox(value,label,checked,dataAttribute,type='') {
    return `<label class="graph-check${type ? ` graph-check-${type.toLowerCase()}` : ''}"><input type="checkbox" ${dataAttribute}="${esc(value)}" ${checked?'checked':''}><span>${esc(label)}</span></label>`;
  }

  function resolveGraphNode(nodeId) {
    const [prefix,refId] = String(nodeId || '').split(':');
    const kind = prefix === 'location' ? 'locations' : prefix === 'character' ? 'characters' : prefix === 'faction' ? 'factions' : prefix === 'event' ? 'events' : '';
    const item = kind ? getItem(kind,refId) : null;
    if (!item) return null;
    const type = prefix === 'location' ? 'Location' : prefix === 'character' ? 'Person' : prefix === 'faction' ? 'Faction' : 'Event';
    return { id:nodeId, label:item.name, type, refId, kind };
  }

  function graphItemsForCurrentType() {
    if (graphSettings.graphType === 'story') {
      const story = activeStoryGraph();
      return (story?.nodes || []).slice().sort((a,b)=>(a.order||0)-(b.order||0)).map(node => {
        const resolved = resolveGraphNode(node.id);
        return resolved ? {nodeId:resolved.id,label:resolved.label,type:resolved.type} : null;
      }).filter(Boolean);
    }
    if (graphSettings.graphType === 'locations') return state.locations.map(item=>({nodeId:`location:${item.id}`,label:item.name,type:'Location'}));
    if (graphSettings.graphType === 'characters') return state.characters.map(item=>({nodeId:`character:${item.id}`,label:item.name,type:'Person'}));
    return [
      ...state.locations.map(item=>({nodeId:`location:${item.id}`,label:item.name,type:'Location'})),
      ...state.characters.map(item=>({nodeId:`character:${item.id}`,label:item.name,type:'Person'})),
      ...state.factions.map(item=>({nodeId:`faction:${item.id}`,label:item.name,type:'Faction'})),
      ...state.events.map(item=>({nodeId:`event:${item.id}`,label:item.name,type:'Event'}))
    ].sort((a,b)=>a.type.localeCompare(b.type)||a.label.localeCompare(b.label));
  }

  function graphTypeFilters() {
    if (graphSettings.graphType === 'story') return [{key:'Location',label:'Locations'},{key:'Person',label:'People'}];
    if (graphSettings.graphType === 'locations') return [{key:'Location',label:'Locations'}];
    if (graphSettings.graphType === 'characters') return [{key:'Person',label:'People'}];
    return [{key:'Location',label:'Locations'},{key:'Person',label:'People'},{key:'Faction',label:'Factions'},{key:'Event',label:'Events'}];
  }

  function graphRelationFilters() {
    if (graphSettings.graphType === 'story') return [{key:'story',label:'Story connections'}];
    if (graphSettings.graphType === 'locations') return [{key:'parent',label:'Parent and child'},{key:'related',label:'Related locations'}];
    if (graphSettings.graphType === 'characters') return [{key:'relationship',label:'People relationships'}];
    return [
      {key:'parent',label:'Parent and child'},
      {key:'related',label:'Related locations'},
      {key:'relationship',label:'People relationships'},
      {key:'current',label:'Current locations'},
      {key:'member',label:'Faction members'},
      {key:'event',label:'Event involvement'},
      {key:'keyPerson',label:'Key people at locations'}
    ];
  }

  function graphFocusOptions() {
    if (graphSettings.graphType === 'story') return graphItemsForCurrentType().map(item=>({value:item.nodeId,label:item.label}));
    if (graphSettings.graphType === 'locations') return state.locations.map(x=>({value:`location:${x.id}`,label:x.name}));
    if (graphSettings.graphType === 'characters') return state.characters.map(x=>({value:`character:${x.id}`,label:x.name}));
    return [
      ...state.locations.map(x=>({value:`location:${x.id}`,label:`Location: ${x.name}`})),
      ...state.characters.map(x=>({value:`character:${x.id}`,label:`Person: ${x.name}`})),
      ...state.factions.map(x=>({value:`faction:${x.id}`,label:`Faction: ${x.name}`})),
      ...state.events.map(x=>({value:`event:${x.id}`,label:`Event: ${x.name}`}))
    ];
  }

  function graphData() {
    const nodes=[]; const links=[]; const nodeSet=new Set(); const linkSet=new Set();
    const addNode=(id,label,type,refId,kind,extra={})=>{ if(!nodeSet.has(id)){nodeSet.add(id);nodes.push({id,label,type,refId,kind,...extra});} };
    const addLink=(source,target,type,label='',extra={})=>{
      if(!source||!target||source===target||graphSettings.visibleRelations[type]===false)return;
      const key = type === 'story' ? `${source}|${target}|${type}|${label}` : `${[source,target].sort().join('|')}|${type}`;
      if(!linkSet.has(key)){linkSet.add(key);links.push({source,target,type,label,...extra});}
    };

    if (graphSettings.graphType === 'story') {
      const story = activeStoryGraph();
      for (const storyNode of story?.nodes || []) {
        const resolved = resolveGraphNode(storyNode.id);
        if (resolved) addNode(resolved.id,resolved.label,resolved.type,resolved.refId,resolved.kind,{
          order:storyNode.order,
          role:storyNode.role || '',
          passage:ensureStoryPassage(storyNode),
          storyPointCount:storyPointRange(story,storyNode).turns.length,
          hasAnchor:Boolean(ensureStoryPassage(storyNode).anchorTurnId),
          storyX:story.positions?.[storyNode.id]?.x ?? storyNode.defaultX ?? .5,
          storyY:story.positions?.[storyNode.id]?.y ?? storyNode.defaultY ?? .5
        });
      }
      for (const storyLink of story?.links || []) addLink(storyLink.source,storyLink.target,'story',storyLink.label || 'continues to',{
        curve:Number(storyLink.curve)||0,
        mainPath:storyLink.mainPath !== false
      });
    } else {
      if (graphSettings.graphType === 'locations' || graphSettings.graphType === 'world') {
        for(const x of state.locations) addNode(`location:${x.id}`,x.name,'Location',x.id,'locations');
        for(const x of state.locations){
          if(x.parentLocationId) addLink(`location:${x.parentLocationId}`,`location:${x.id}`,'parent','contains');
          for(const rel of x.relatedLocationIds||[]) addLink(`location:${x.id}`,`location:${rel}`,'related','related');
        }
      }
      if (graphSettings.graphType === 'characters' || graphSettings.graphType === 'world') {
        for(const x of state.characters) addNode(`character:${x.id}`,x.name,'Person',x.id,'characters');
        for(const x of state.characters){
          for(const rel of x.relationshipIds||[]) addLink(`character:${x.id}`,`character:${rel}`,'relationship','relationship');
          if(graphSettings.graphType==='world') for(const loc of x.currentLocationIds||[]) addLink(`character:${x.id}`,`location:${loc}`,'current','currently in');
        }
      }
      if (graphSettings.graphType === 'world') {
        for(const x of state.factions) addNode(`faction:${x.id}`,x.name,'Faction',x.id,'factions');
        for(const x of state.events) addNode(`event:${x.id}`,x.name,'Event',x.id,'events');
        for(const f of state.factions) for(const person of f.keyMemberIds||[]) addLink(`faction:${f.id}`,`character:${person}`,'member','member');
        for(const e of state.events) for(const person of e.characterIds||[]) addLink(`event:${e.id}`,`character:${person}`,'event','involved');
        for(const l of state.locations) for(const person of l.keyCharacterIds||[]) addLink(`location:${l.id}`,`character:${person}`,'keyPerson','key person');
      }
    }

    const hidden = new Set(graphSettings.hiddenNodeIds || []);
    const filteredNodes = nodes.filter(node=>graphSettings.visibleTypes[node.type] !== false && !hidden.has(node.id));
    const keptIds = new Set(filteredNodes.map(node=>node.id));
    const filteredLinks = links.filter(link=>keptIds.has(typeof link.source==='string'?link.source:link.source.id) && keptIds.has(typeof link.target==='string'?link.target:link.target.id));

    if (graphSettings.layout === 'focus' && graphSettings.focus) {
      const keep = new Set([graphSettings.focus]);
      for(const link of filteredLinks){
        const source=typeof link.source==='string'?link.source:link.source.id;
        const target=typeof link.target==='string'?link.target:link.target.id;
        if(source===graphSettings.focus)keep.add(target);
        if(target===graphSettings.focus)keep.add(source);
      }
      return { nodes:filteredNodes.filter(node=>keep.has(node.id)), links:filteredLinks.filter(link=>keep.has(typeof link.source==='string'?link.source:link.source.id)&&keep.has(typeof link.target==='string'?link.target:link.target.id)) };
    }
    return {nodes:filteredNodes,links:filteredLinks};
  }

  function graphRelationLabel(type) {
    return ({
      story:'story direction',
      parent:'contains',
      related:'related place',
      relationship:'relationship',
      current:'currently in',
      member:'member',
      event:'involved',
      keyPerson:'key person'
    })[type] || type;
  }

  function graphConnectionSentence(nodeId, link, byId) {
    const sourceId = typeof link.source === 'string' ? link.source : link.source.id;
    const targetId = typeof link.target === 'string' ? link.target : link.target.id;
    const source = byId.get(sourceId);
    const target = byId.get(targetId);
    const other = sourceId === nodeId ? target : source;
    if (!other) return '';
    if (link.type === 'story') return sourceId === nodeId ? `${link.label || 'Continues to'} ${other.label}` : `Reached from ${other.label} through “${link.label || 'continues to'}”`;
    if (link.type === 'parent') return sourceId === nodeId ? `Contains ${other.label}` : `Inside ${other.label}`;
    if (link.type === 'current') return sourceId === nodeId ? `Currently in ${other.label}` : `${other.label} is currently here`;
    if (link.type === 'member') return sourceId === nodeId ? `${other.label} is a member` : `Member of ${other.label}`;
    if (link.type === 'event') return sourceId === nodeId ? `${other.label} was involved` : `Involved in ${other.label}`;
    if (link.type === 'keyPerson') return sourceId === nodeId ? `${other.label} is a key person here` : `Key person at ${other.label}`;
    if (link.type === 'relationship') return `Connected to ${other.label}`;
    return `Related to ${other.label}`;
  }

  function updateGraphInspector(nodeId, data) {
    const inspector = document.getElementById('graphInspector');
    if (!inspector) return;
    const byId = new Map(data.nodes.map(node => [node.id,node]));
    const node = byId.get(nodeId);
    const story = graphSettings.graphType === 'story' ? activeStoryGraph() : null;
    if (!node) {
      inspector.innerHTML = story
        ? `<span class="eyebrow">Story graph</span><h2>Choose a story point</h2><p class="graph-empty-inspector">Tap a circle to preview that part of the RP. Drag a circle to rearrange the story map.</p>`
        : `<span class="eyebrow">Connection details</span><h2>Select a circle</h2><p class="graph-empty-inspector">Select an item to see why it is connected. Double-click a circle to open its full page.</p>`;
      return;
    }
    if (story) {
      const storyNode = story.nodes.find(item => item.id === nodeId);
      const passage = storyNode ? ensureStoryPassage(storyNode) : null;
      const range = storyNode ? storyPointRange(story,storyNode) : null;
      inspector.innerHTML = `<span class="eyebrow">Selected story point</span><h2>${esc(node.label)}</h2><p class="graph-inspector-copy">${esc(storyRoleSentence(storyNode))}</p><div class="story-inspector-bookmark"><strong>${passage?.anchorTurnId?esc(storyAnchorDescription(story,storyNode)):'Not linked to the RP yet'}</strong><span>${passage?.anchorTurnId?`${range?.turns.length || 0} post${range?.turns.length===1?'':'s'} in this section.`:'Link this point to the exact RP post where it begins.'}</span></div><div class="graph-inspector-actions"><button class="button small" type="button" data-story-preview-point="${esc(storyRouteValue(story.id,nodeId))}">Preview story point</button><button class="button secondary small" type="button" data-story-edit-point="${esc(storyRouteValue(story.id,nodeId))}">${passage?.anchorTurnId?'Change bookmark':'Link to RP'}</button></div><p class="graph-empty-inspector">Drag this circle to move it. Opening the preview will not leave the graph.</p>`;
      return;
    }
    const connections = data.links.filter(link => {
      const sourceId = typeof link.source === 'string' ? link.source : link.source.id;
      const targetId = typeof link.target === 'string' ? link.target : link.target.id;
      return sourceId === nodeId || targetId === nodeId;
    });
    inspector.innerHTML = `<span class="eyebrow">${esc(node.type)}</span><h2>${esc(node.label)}</h2><p class="graph-inspector-copy">${connections.length} visible connection${connections.length===1?'':'s'} in this view.</p>${connections.length ? `<div class="graph-connection-list">${connections.map(link=>`<div class="graph-connection"><span class="graph-relation-tag">${esc(link.label || graphRelationLabel(link.type))}</span><span>${esc(graphConnectionSentence(nodeId,link,byId))}</span></div>`).join('')}</div>` : '<p class="graph-empty-inspector">No visible connections. Try turning on another connection type or including more items.</p>'}<button class="button secondary small graph-open-button" type="button" data-open="${node.kind}:${node.refId}">Open full page</button>`;
  }

  function graphLayoutKey() {
    const focusPart = graphSettings.layout === 'focus' ? graphSettings.focus || 'none' : 'all';
    return `${graphSettings.graphType}:${graphSettings.layout}:${focusPart}`;
  }

  function resetCurrentGraphPositions() {
    if (graphSettings.graphType === 'story') {
      const story = activeStoryGraph();
      if (story) story.positions = {};
    } else {
      delete state.workspace.graphPositions[graphLayoutKey()];
    }
    scheduleSave('Saving graph layout…');
    drawGraph();
  }

  function drawGraph() {
    if (!window.d3) return;
    const stage = document.getElementById('graphStage');
    const svgEl = document.getElementById('graphSvg');
    if (!stage || !svgEl) return;
    const width = Math.max(720, stage.clientWidth || 960);
    const height = window.innerWidth < 760 ? 520 : 620;
    const data = graphData();
    const svg = d3.select(svgEl).attr('viewBox',`0 0 ${width} ${height}`);
    svg.selectAll('*').remove();
    const colors={Location:'var(--accent)',Person:'var(--success)',Species:'var(--muted)',Faction:'var(--warning)',Event:'var(--danger)'};
    if (!data.nodes.length) {
      svg.append('text').attr('x',width/2).attr('y',height/2).attr('text-anchor','middle').attr('fill','var(--muted)').attr('font-size',16).text('No items are selected for this graph.');
      document.getElementById('graphLegend').innerHTML='<span class="legend-item">0 items · 0 connections</span>';
      updateGraphInspector('',data);
      return;
    }

    if (graphSettings.graphType === 'story' && graphSettings.layout === 'story') {
      drawStoryGraph(svg,width,height,data,colors);
      return;
    }

    if (graphSettings.layout === 'focus' && !graphSettings.focus) graphSettings.focus = data.nodes[0]?.id || '';
    svg.append('defs').append('marker').attr('id','arrow').attr('viewBox','0 -5 10 10').attr('refX',22).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--accent)');
    const g=svg.append('g');
    svg.call(d3.zoom().scaleExtent([.35,3]).on('zoom',event=>g.attr('transform',event.transform)));
    const link=g.append('g').selectAll('line').data(data.links).join('line').attr('class',d=>`graph-link ${d.type}`).attr('stroke-width',d=>d.type==='parent'?2.4:1.5).attr('marker-end',d=>d.type==='parent'?'url(#arrow)':null);
    const edgeLabel=g.append('g').selectAll('text').data(data.links).join('text').attr('class','graph-edge-label').text(d=>d.label || graphRelationLabel(d.type));
    const node=g.append('g').selectAll('circle').data(data.nodes).join('circle').attr('class','graph-node').attr('r',d=>d.type==='Event'?10:13).attr('fill',d=>colors[d.type]||'var(--accent)');
    const glyph=g.append('g').selectAll('text').data(data.nodes).join('text').attr('class','graph-node-glyph').text(d=>d.type[0]);
    const label=g.append('g').selectAll('text').data(data.nodes).join('text').attr('class','graph-node-label').attr('text-anchor','middle').attr('dy',30).text(d=>shortText(d.label,28));
    node.append('title').text(d=>`${d.type}: ${d.label}. Click to explain; double-click to open.`);

    const chooseNode = (nodeId) => {
      graphSelectedNode = nodeId;
      node.classed('selected',d=>d.id===nodeId);
      updateGraphInspector(nodeId,data);
    };
    node.on('click',(event,d)=>{event.stopPropagation();chooseNode(d.id);})
      .on('dblclick',(event,d)=>{event.stopPropagation();navigate(d.kind,d.refId);});
    svg.on('click',()=>{graphSelectedNode='';node.classed('selected',false);updateGraphInspector('',data);});

    if(graphSettings.layout==='hierarchy'){
      drawHierarchy(data,width,height,node,glyph,label,link,edgeLabel);
      enableFixedNodeDrag(data,width,height,node,glyph,label,link,edgeLabel);
    } else if(graphSettings.layout==='focus') {
      drawFocusLayout(data,width,height,g,node,glyph,label,link,edgeLabel);
      enableFixedNodeDrag(data,width,height,node,glyph,label,link,edgeLabel);
    } else {
      const saved = state.workspace.graphPositions[graphLayoutKey()] || {};
      data.nodes.forEach(item=>{
        const position=saved[item.id];
        if(position){item.x=position.x*width;item.y=position.y*height;item.fx=item.x;item.fy=item.y;}
      });
      const sim=d3.forceSimulation(data.nodes)
        .force('link',d3.forceLink(data.links).id(d=>d.id).distance(d=>d.type==='parent'?125:165).strength(d=>d.type==='parent'?.9:.35))
        .force('charge',d3.forceManyBody().strength(graphSettings.graphType==='world'?-260:-340))
        .force('center',d3.forceCenter(width/2,height/2))
        .force('collision',d3.forceCollide().radius(55));
      node.call(d3.drag().on('start',(event,d)=>{if(!event.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;}).on('drag',(event,d)=>{d.fx=event.x;d.fy=event.y;}).on('end',(event,d)=>{
        if(!event.active)sim.alphaTarget(0);
        d.fx=d.x;d.fy=d.y;
        state.workspace.graphPositions[graphLayoutKey()] ||= {};
        state.workspace.graphPositions[graphLayoutKey()][d.id]={x:d.x/width,y:d.y/height};
        scheduleSave('Saving graph layout…');
      }));
      sim.on('tick',()=>{
        link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
        edgeLabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-4);
        node.attr('cx',d=>d.x=Math.max(35,Math.min(width-35,d.x))).attr('cy',d=>d.y=Math.max(35,Math.min(height-45,d.y)));
        glyph.attr('x',d=>d.x).attr('y',d=>d.y);
        label.attr('x',d=>d.x).attr('y',d=>d.y);
      });
    }
    const types=[...new Set(data.nodes.map(n=>n.type))];
    const relations=[...new Set(data.links.map(link=>link.type))];
    document.getElementById('graphLegend').innerHTML=types.map(t=>`<span class="legend-item"><span class="legend-dot" style="background:${colors[t]}"></span>${esc(t)}</span>`).join('')+relations.map(type=>`<span class="legend-item"><span class="graph-key-line ${type==='related'||type==='keyPerson'?'dashed':''}"></span>${esc(graphRelationLabel(type))}</span>`).join('')+`<span class="legend-item">${data.nodes.length} items · ${data.links.length} connections</span>`;
    const preferred = data.nodes.some(n=>n.id===graphSelectedNode) ? graphSelectedNode : (graphSettings.layout==='focus' ? graphSettings.focus : '');
    if (preferred) chooseNode(preferred); else updateGraphInspector('',data);
  }

  function storyCurveGeometry(link,byId) {
    const source=byId.get(typeof link.source==='string'?link.source:link.source.id);
    const target=byId.get(typeof link.target==='string'?link.target:link.target.id);
    if(!source||!target)return {path:'',labelX:0,labelY:0};
    const dx=target.x-source.x;
    const dy=target.y-source.y;
    const length=Math.max(1,Math.hypot(dx,dy));
    const curve=Number(link.curve)||0;
    if(!curve) return {path:`M${source.x},${source.y} L${target.x},${target.y}`,labelX:(source.x+target.x)/2,labelY:(source.y+target.y)/2-8};
    const midX=(source.x+target.x)/2;
    const midY=(source.y+target.y)/2;
    const controlX=midX+(-dy/length)*curve;
    const controlY=midY+(dx/length)*curve;
    return {
      path:`M${source.x},${source.y} Q${controlX},${controlY} ${target.x},${target.y}`,
      labelX:.25*source.x+.5*controlX+.25*target.x,
      labelY:.25*source.y+.5*controlY+.25*target.y-8
    };
  }

  function drawStoryGraph(svg,width,height,data,colors) {
    const marginX=55;
    const marginY=55;
    const story=activeStoryGraph();
    const byId=new Map(data.nodes.map(node=>[node.id,node]));
    data.nodes.forEach(node=>{
      node.x=marginX+Math.max(0,Math.min(1,node.storyX ?? .5))*(width-marginX*2);
      node.y=marginY+Math.max(0,Math.min(1,node.storyY ?? .5))*(height-marginY*2);
    });

    const defs=svg.append('defs');
    defs.append('marker').attr('id','storyArrow').attr('viewBox','0 -5 10 10').attr('refX',30).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto').append('path').attr('d','M0,-5L10,0L0,5').attr('fill','var(--accent)');
    const g=svg.append('g');
    svg.call(d3.zoom().scaleExtent([.45,3]).on('zoom',event=>g.attr('transform',event.transform)));

    const link=g.append('g').selectAll('path').data(data.links).join('path')
      .attr('class',d=>`story-link ${d.mainPath?'main-path':'branch-path'}`)
      .attr('marker-end','url(#storyArrow)');
    const edgeLabel=g.append('g').selectAll('text').data(data.links).join('text')
      .attr('class','graph-edge-label story-edge-label')
      .text(d=>d.label || 'continues to');

    const nodeGroup=g.append('g').selectAll('g').data(data.nodes).join('g')
      .attr('class','story-node-group')
      .attr('role','button')
      .attr('aria-label',d=>`${d.order}. ${d.label}, ${d.role || d.type}`);
    nodeGroup.append('circle').attr('class','story-node-circle').attr('r',19).attr('fill',d=>colors[d.type]||'var(--accent)');
    nodeGroup.append('text').attr('class','story-step-number').attr('text-anchor','middle').attr('dominant-baseline','central').text(d=>d.order || '');
    nodeGroup.append('text').attr('class','story-role-label').attr('text-anchor','middle').attr('y',-28).text(d=>shortText(d.role || d.type,24));
    nodeGroup.append('text').attr('class','graph-node-label story-node-label').attr('text-anchor','middle').attr('y',34).text(d=>shortText(d.label,28));
    nodeGroup.append('text').attr('class','story-content-mark').attr('x',15).attr('y',-14).attr('text-anchor','middle').text(d=>d.storyPointCount?'▤':d.hasAnchor?'⌖':'+');
    nodeGroup.append('title').text(d=>`${d.order}. ${d.label}. Drag to move or click to preview the bookmarked section in the full RP.`);

    const updateGeometry=()=>{
      nodeGroup.attr('transform',d=>`translate(${d.x},${d.y})`);
      link.attr('d',d=>storyCurveGeometry(d,byId).path);
      edgeLabel.attr('x',d=>storyCurveGeometry(d,byId).labelX).attr('y',d=>storyCurveGeometry(d,byId).labelY);
    };
    updateGeometry();

    const chooseNode=nodeId=>{
      graphSelectedNode=nodeId;
      nodeGroup.classed('selected',d=>d.id===nodeId);
      updateGraphInspector(nodeId,data);
    };

    nodeGroup.on('click',(event,d)=>{event.stopPropagation();chooseNode(d.id);const storyNode=story?.nodes.find(item=>item.id===d.id);showStoryPointPopup(story,storyNode);})
      .call(d3.drag().clickDistance(5)
        .on('start',(event,d)=>{event.sourceEvent?.stopPropagation();d.__dragStart={x:event.x,y:event.y};d.__wasDragged=false;})
        .on('drag',(event,d)=>{
          if(d.__dragStart&&Math.hypot(event.x-d.__dragStart.x,event.y-d.__dragStart.y)>4)d.__wasDragged=true;
          d.x=Math.max(30,Math.min(width-30,event.x));
          d.y=Math.max(34,Math.min(height-48,event.y));
          story.positions ||= {};
          story.positions[d.id]={
            x:Math.max(0,Math.min(1,(d.x-marginX)/(width-marginX*2))),
            y:Math.max(0,Math.min(1,(d.y-marginY)/(height-marginY*2)))
          };
          updateGeometry();
        })
        .on('end',(event,d)=>{delete d.__dragStart;scheduleSave('Saving story layout…');}));

    svg.on('click',()=>{graphSelectedNode='';nodeGroup.classed('selected',false);updateGraphInspector('',data);});
    const types=[...new Set(data.nodes.map(n=>n.type))];
    document.getElementById('graphLegend').innerHTML=types.map(type=>`<span class="legend-item"><span class="legend-dot" style="background:${colors[type]}"></span>${esc(type)}</span>`).join('')+`<span class="legend-item"><span class="graph-key-line"></span>Story direction</span><span class="legend-item">${data.nodes.length} items · ${data.links.length} story connections</span>`;
    const preferred=data.nodes.some(node=>node.id===graphSelectedNode)?graphSelectedNode:data.nodes.slice().sort((a,b)=>(a.order||0)-(b.order||0))[0]?.id;
    if(preferred)chooseNode(preferred);else updateGraphInspector('',data);
  }

  function updateFixedGeometry(data,node,glyph,label,link,edgeLabel) {
    const byId=new Map(data.nodes.map(item=>[item.id,item]));
    link.attr('x1',d=>byId.get(typeof d.source==='string'?d.source:d.source.id)?.x||0)
      .attr('y1',d=>byId.get(typeof d.source==='string'?d.source:d.source.id)?.y||0)
      .attr('x2',d=>byId.get(typeof d.target==='string'?d.target:d.target.id)?.x||0)
      .attr('y2',d=>byId.get(typeof d.target==='string'?d.target:d.target.id)?.y||0);
    edgeLabel.attr('x',d=>{
      const source=byId.get(typeof d.source==='string'?d.source:d.source.id);
      const target=byId.get(typeof d.target==='string'?d.target:d.target.id);
      return ((source?.x||0)+(target?.x||0))/2;
    }).attr('y',d=>{
      const source=byId.get(typeof d.source==='string'?d.source:d.source.id);
      const target=byId.get(typeof d.target==='string'?d.target:d.target.id);
      return ((source?.y||0)+(target?.y||0))/2-5;
    });
    node.attr('cx',d=>d.x).attr('cy',d=>d.y);
    glyph.attr('x',d=>d.x).attr('y',d=>d.y);
    label.attr('x',d=>d.x).attr('y',d=>d.y);
  }

  function enableFixedNodeDrag(data,width,height,node,glyph,label,link,edgeLabel) {
    const key=graphLayoutKey();
    const saved=state.workspace.graphPositions[key] || {};
    data.nodes.forEach(item=>{
      if(saved[item.id]){
        item.x=Math.max(35,Math.min(width-35,saved[item.id].x*width));
        item.y=Math.max(35,Math.min(height-45,saved[item.id].y*height));
      }
    });
    updateFixedGeometry(data,node,glyph,label,link,edgeLabel);
    node.call(d3.drag()
      .on('start',(event)=>event.sourceEvent?.stopPropagation())
      .on('drag',(event,d)=>{
        d.x=Math.max(35,Math.min(width-35,event.x));
        d.y=Math.max(35,Math.min(height-45,event.y));
        state.workspace.graphPositions[key] ||= {};
        state.workspace.graphPositions[key][d.id]={x:d.x/width,y:d.y/height};
        updateFixedGeometry(data,node,glyph,label,link,edgeLabel);
      })
      .on('end',()=>scheduleSave('Saving graph layout…')));
  }

  function drawFocusLayout(data,width,height,g,node,glyph,label,link,edgeLabel) {
    const byId=new Map(data.nodes.map(n=>[n.id,n]));
    const focus=byId.get(graphSettings.focus) || data.nodes[0];
    focus.x=width/2; focus.y=height/2;
    const others=data.nodes.filter(n=>n.id!==focus.id);
    const groups=new Map();
    for(const item of others){if(!groups.has(item.type))groups.set(item.type,[]);groups.get(item.type).push(item);}
    const anchors={Location:[width*.16,height*.40],Person:[width*.84,height*.40],Species:[width*.18,height*.79],Faction:[width*.50,height*.84],Event:[width*.82,height*.79]};
    for(const [type,items] of groups){
      const [ax,ay]=anchors[type]||[width*.5,height*.78];
      const spacing=Math.min(82,Math.max(48,(height*.55)/Math.max(1,items.length)));
      items.sort((a,b)=>a.label.localeCompare(b.label));
      items.forEach((item,index)=>{item.x=ax;item.y=ay+(index-(items.length-1)/2)*spacing;});
      g.append('text').attr('class','graph-group-label').attr('x',ax).attr('y',Math.max(22,ay-(items.length-1)*spacing/2-34)).text(type.toUpperCase());
    }
    updateFixedGeometry(data,node,glyph,label,link,edgeLabel);
  }

  function drawHierarchy(data,width,height,node,glyph,label,link,edgeLabel) {
    const byId=new Map(data.nodes.map(n=>[n.id,n]));
    const parentLinks=data.links.filter(l=>l.type==='parent');
    const parentOf=new Map(parentLinks.map(l=>[typeof l.target==='string'?l.target:l.target.id,typeof l.source==='string'?l.source:l.source.id]));
    const children=new Map();
    for(const l of parentLinks){
      const source=typeof l.source==='string'?l.source:l.source.id;
      const target=typeof l.target==='string'?l.target:l.target.id;
      if(!children.has(source))children.set(source,[]);
      children.get(source).push(target);
    }
    const roots=data.nodes.filter(n=>!parentOf.has(n.id));
    const levels=[]; const visited=new Set();
    const walk=(nodeId,depth)=>{
      if(visited.has(nodeId))return;
      visited.add(nodeId);
      levels[depth]||=[];
      levels[depth].push(nodeId);
      for(const child of children.get(nodeId)||[])walk(child,depth+1);
    };
    roots.forEach(root=>walk(root.id,0));
    data.nodes.forEach(item=>{if(!visited.has(item.id))walk(item.id,levels.length);});
    levels.forEach((ids,depth)=>ids.forEach((nodeId,index)=>{
      const item=byId.get(nodeId);
      item.x=(width/(ids.length+1))*(index+1);
      item.y=70+depth*Math.min(135,(height-130)/Math.max(1,levels.length-1));
    }));
    link.attr('opacity',d=>d.type==='parent'?1:.22);
    edgeLabel.attr('opacity',d=>d.type==='parent'?1:.35);
    updateFixedGeometry(data,node,glyph,label,link,edgeLabel);
  }

  function renderSearch(query='') {
    const q=query.toLowerCase();
    const results=[];
    for(const kind of Object.keys(COLLECTIONS)) for(const item of state[kind]) {
      if(!q || JSON.stringify(item).toLowerCase().includes(q)) results.push({kind,item});
    }
    const storyResults=[];
    for(const story of state.storyGraphs||[]) for(const node of story.nodes||[]) {
      const passage=ensureStoryPassage(node);
      const range=storyPointRange(story,node);
      const searchable={title:storyPointTitle(story,node),summary:passage.summary,turns:range.turns};
      if(!q || JSON.stringify(searchable).toLowerCase().includes(q)) storyResults.push({story,node,range});
    }
    el.main.innerHTML = `${pageHead('Workspace search',query?`Results for “${query}”`:'Search everything',query?'Matching pages across characters, locations, species, factions, events, and the full RP.':'Type in the search box above to search every imported page, property, and story bookmark.')}
      <div class="search-results">${storyResults.slice(0,30).map(({story,node,range})=>{const passage=ensureStoryPassage(node);return `<div class="search-result" data-story-point="${esc(storyRouteValue(story.id,node.id))}"><div class="search-result-icon">▤</div><div><strong>${esc(storyPointTitle(story,node))}</strong><div class="search-result-meta">RP bookmark · ${esc(storyAnchorDescription(story,node))} · ${range.turns.length} post${range.turns.length===1?'':'s'} · ${esc(shortText(passage.summary||range.turns.map(turn=>turn.text).join(' '),100))}</div></div><span>›</span></div>`;}).join('')}${results.slice(0,80).map(({kind,item})=>`<div class="search-result" data-open="${kind}:${item.id}"><div class="search-result-icon">${uiIcon(COLLECTIONS[kind].icon)}</div><div><strong>${esc(item.name)}</strong><div class="search-result-meta">${esc(COLLECTIONS[kind].singular)} · ${esc(shortText(cardMeta(kind,item).copy,100))}</div></div><span>›</span></div>`).join('') || (!storyResults.length?'<div class="panel empty-state">No matches found.</div>':'')}</div>`;
  }

  function addItem(kind,parentId='') {
    const meta=COLLECTIONS[kind];
    const itemId=id(kind.slice(0,-1));
    let item={id:itemId,name:`Untitled ${meta.singular}`,favorite:false,updatedAt:nowISO(),blocks:[{id:id('block'),type:'text',content:'Start writing here…'}]};
    if(kind==='characters') Object.assign(item,{age:'',aliases:'',role:'',mood:'',outfit:'',position:'',status:'Active',currentLocationIds:[],relationshipIds:[],relationshipsText:'',notes:'',personality:'',secrets:''});
    if(kind==='locations') Object.assign(item,{type:parentId?'Settlement':'Region',atmosphere:'',description:'',notes:'',controlledBy:'',keyCharacterIds:[],relatedLocationIds:[],parentLocationId:parentId});
    if(kind==='factions') Object.assign(item,{goal:'',power:'Minor',notes:'',keyMemberIds:[],alliesEnemies:''});
    if(kind==='events') Object.assign(item,{date:'',status:'Planned',description:'',consequences:'',notes:'',characterIds:[]});
    state[kind].push(item); logActivity(`Created ${item.name}`); scheduleSave(); navigate(kind,itemId);
  }

  function deleteItem(kind,itemId) {
    const item=getItem(kind,itemId); if(!item)return;
    if(!confirm(`Delete “${item.name}”? This removes it from this workspace.`))return;
    state[kind]=state[kind].filter(x=>x.id!==itemId);
    if(kind==='locations'){
      state.locations.forEach(x=>{if(x.parentLocationId===itemId)x.parentLocationId='';x.relatedLocationIds=(x.relatedLocationIds||[]).filter(id=>id!==itemId);});
      state.characters.forEach(x=>x.currentLocationIds=(x.currentLocationIds||[]).filter(id=>id!==itemId));
    }
    if(kind==='characters'){
      state.characters.forEach(x=>x.relationshipIds=(x.relationshipIds||[]).filter(id=>id!==itemId));
      state.locations.forEach(x=>x.keyCharacterIds=(x.keyCharacterIds||[]).filter(id=>id!==itemId));
      state.factions.forEach(x=>x.keyMemberIds=(x.keyMemberIds||[]).filter(id=>id!==itemId));
      state.events.forEach(x=>x.characterIds=(x.characterIds||[]).filter(id=>id!==itemId));
    }
    logActivity(`Deleted ${item.name}`); scheduleSave(); navigate(kind);
  }

  function resolveBlockTarget(kind,itemId) {
    if(kind==='world') return state.world;
    return getItem(kind,itemId);
  }

  function blockFromRef(ref) {
    const [kind,itemId,indexRaw]=String(ref||'').split(':');
    const target=resolveBlockTarget(kind,itemId);
    const index=Number(indexRaw);
    return {kind,itemId,index,target,block:target?.blocks?.[index]||null};
  }

  async function imageFileToBlock(file, character) {
    if (!file || !file.type?.startsWith('image/')) throw new Error('Choose an image file.');
    if (file.size > 12 * 1024 * 1024) throw new Error('That image is larger than 12 MB.');
    const source = await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('The image could not be read.'));reader.readAsDataURL(file);});
    const image = await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('The image could not be opened.'));img.src=source;});
    const maxSide=1500;
    const scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
    const width=Math.max(1,Math.round(image.naturalWidth*scale));
    const height=Math.max(1,Math.round(image.naturalHeight*scale));
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const context=canvas.getContext('2d');context.drawImage(image,0,0,width,height);
    let data=canvas.toDataURL('image/jpeg',.84);
    if(data.length>1_200_000)data=canvas.toDataURL('image/jpeg',.68);
    return {id:id('image'),type:'image',content:'',src:data,alt:`${character?.name || 'Character'} image`,layout:'front',wrapSide:'left',width:Math.min(360,width),padding:18,xPct:8,y:24,opacity:1,ratio:width/height};
  }

  async function setCharacterPageImage(characterId, slot, file) {
    const character = getItem('characters', characterId);
    if (!character) return;
    try {
      el.saveStatus.textContent = 'Preparing image…';
      const prepared = await imageFileToBlock(file, character);
      const key = characterMediaKey(slot);
      character[key] = {
        src: prepared.src,
        alt: `${character.name} ${characterMediaLabel(slot)}`,
        positionX: 50,
        positionY: characterMediaDefaultY(slot),
        zoom: 1,
        fit: 'cover'
      };
      character.updatedAt = nowISO();
      logActivity(`Updated the ${characterMediaLabel(slot)} for ${character.name}`);
      scheduleSave('Saving image…');
      renderEntity('characters', characterId);
      toast(`${characterMediaLabel(slot).replace(/^./, ch => ch.toUpperCase())} added.`);
    } catch (error) {
      console.error(error);
      toast(error.message || 'The image could not be added.', 'error');
      el.saveStatus.textContent = 'Save failed';
    }
  }

  function removeCharacterPageImage(characterId, slot) {
    const character = getItem('characters', characterId);
    if (!character) return;
    const key = characterMediaKey(slot);
    character[key] = null;
    character.updatedAt = nowISO();
    scheduleSave();
    renderEntity('characters', characterId);
  }


  function characterMediaRecord(characterId, slot) {
    const character = getItem('characters', characterId);
    if (!character) return { character: null, media: null, key: '' };
    const key = characterMediaKey(slot);
    return { character, media: character[key], key };
  }

  function syncCharacterCropPreview(characterId, slot) {
    const { media } = characterMediaRecord(characterId, slot);
    if (!media) return;
    const ref = `${slot}:${characterId}`;
    const style = characterMediaStyle(media, slot);
    const preview = el.modal.querySelector(`[data-character-crop-preview="${CSS.escape(ref)}"]`);
    if (preview) preview.style.cssText = style;
    const pageImage = document.querySelector(`[data-character-media-select="${CSS.escape(ref)}"] img`);
    if (pageImage) pageImage.style.cssText = style;
    const zoomOutput = el.modal.querySelector('[data-character-crop-zoom-output]');
    if (zoomOutput) zoomOutput.textContent = `${Math.round(Number(media.zoom || 1) * 100)}%`;
  }

  function showCharacterMediaEditor(characterId, slot) {
    const { character, media } = characterMediaRecord(characterId, slot);
    if (!character || !media?.src) return;
    media.positionX = Math.max(0, Math.min(100, Number(media.positionX ?? 50)));
    media.positionY = Math.max(0, Math.min(100, Number(media.positionY ?? characterMediaDefaultY(slot))));
    media.zoom = Math.max(1, Math.min(3, Number(media.zoom ?? 1)));
    media.fit = media.fit === 'contain' ? 'contain' : 'cover';
    const ref = `${slot}:${characterId}`;
    const label = characterMediaLabel(slot);
    showModal(`Edit ${label}`, `<div class="character-crop-editor" data-character-crop-editor="${esc(ref)}">
      <div class="character-crop-stage ${slot === 'header' ? 'is-cover' : 'is-portrait'}" data-character-crop-stage="${esc(ref)}" aria-label="Drag the image to choose which part is visible">
        <img src="${esc(media.src)}" alt="${esc(media.alt || `${character.name} ${label}`)}" data-character-crop-preview="${esc(ref)}" style="${characterMediaStyle(media,slot)}">
        <div class="character-crop-guide" aria-hidden="true"></div>
        <span class="character-crop-tip">Drag image to reposition</span>
      </div>
      <div class="character-crop-controls">
        <label class="property-row"><span>Image size <output data-character-crop-zoom-output>${Math.round(media.zoom * 100)}%</output></span><input type="range" min="100" max="300" step="1" value="${Math.round(media.zoom * 100)}" data-character-crop-zoom="${esc(ref)}"></label>
        <label class="property-row"><span>How it fills the frame</span><select class="select" data-character-crop-fit="${esc(ref)}"><option value="cover" ${media.fit === 'cover' ? 'selected' : ''}>Fill the frame</option><option value="contain" ${media.fit === 'contain' ? 'selected' : ''}>Show the whole image</option></select></label>
        <div class="character-crop-actions">
          <button class="button ghost small" type="button" data-character-crop-reset="${esc(ref)}">Reset position</button>
          <label class="button secondary small character-crop-file-label">Replace image<input type="file" accept="image/*" hidden data-character-crop-file="${esc(ref)}"></label>
        </div>
        <p class="property-help">Move the image inside the frame, then use Image size to zoom in or out. The frame itself stays aligned with the character details.</p>
      </div>
    </div>`, `<button class="button danger" type="button" data-character-crop-remove="${esc(ref)}">Remove ${label}</button><button class="button primary" type="button" data-close-modal>Done</button>`);
    el.modal.querySelector('.modal')?.classList.add('character-crop-modal');
  }

  function beginCharacterCropDrag(event, ref) {
    if (event.button !== undefined && event.button !== 0) return;
    const [slot, characterId] = String(ref || '').split(':');
    const { character, media } = characterMediaRecord(characterId, slot);
    const stage = event.target.closest('[data-character-crop-stage]');
    if (!character || !media || !stage) return;
    event.preventDefault();
    const startClientX = event.clientX;
    const startClientY = event.clientY;
    const startX = Number(media.positionX ?? 50);
    const startY = Number(media.positionY ?? characterMediaDefaultY(slot));
    stage.classList.add('is-dragging');
    try { stage.setPointerCapture(event.pointerId); } catch (error) {}
    const move = moveEvent => {
      const rect = stage.getBoundingClientRect();
      const dx = moveEvent.clientX - startClientX;
      const dy = moveEvent.clientY - startClientY;
      media.positionX = Math.max(0, Math.min(100, startX - (dx / Math.max(1, rect.width)) * 100));
      media.positionY = Math.max(0, Math.min(100, startY - (dy / Math.max(1, rect.height)) * 100));
      syncCharacterCropPreview(characterId, slot);
    };
    const up = () => {
      stage.classList.remove('is-dragging');
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      character.updatedAt = nowISO();
      scheduleSave('Saving image position…');
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up, { once: true });
  }

  async function addCharacterImage(characterId,file,insertIndex=null) {
    const character=getItem('characters',characterId);if(!character)return;
    try{
      el.saveStatus.textContent='Preparing image…';
      const block=await imageFileToBlock(file,character);
      character.blocks ||= [];
      const index=insertIndex==null?character.blocks.length:Math.max(0,Math.min(character.blocks.length,insertIndex));
      character.blocks.splice(index,0,block);
      character.updatedAt=nowISO();
      logActivity(`Added an image to ${character.name}`);
      scheduleSave('Saving image…');
      renderEntity('characters',characterId);
      toast('Image added. Drag it between paragraphs or choose Behind words.');
    }catch(error){console.error(error);toast(error.message || 'The image could not be added.','error');el.saveStatus.textContent='Save failed';}
  }

  function moveBlock(kind,itemId,fromIndex,toIndex) {
    const target=resolveBlockTarget(kind,itemId);if(!target?.blocks?.[fromIndex])return;
    const [block]=target.blocks.splice(fromIndex,1);
    const adjusted=fromIndex<toIndex?toIndex-1:toIndex;
    target.blocks.splice(Math.max(0,Math.min(target.blocks.length,adjusted)),0,block);
    target.updatedAt=nowISO();scheduleSave();
    if(kind==='world')renderWorld();else renderEntity(kind,itemId);
  }

  function removeImageBlock(ref) {
    const {kind,itemId,index,target,block}=blockFromRef(ref);if(!block||block.type!=='image')return;
    if(activeImageRef===ref)activeImageRef='';if(editingImageRef===ref)editingImageRef='';
    target.blocks.splice(index,1);target.updatedAt=nowISO();scheduleSave();renderEntity(kind,itemId);
  }

  function imageLayoutLabel(layout) {
    return ({wrap:'Fit words around the image',front:'Place image in front of the words',behind:'Place image behind the words'})[layout] || 'Fit words around the image';
  }

  function clearImageSelection() {
    activeImageRef = '';
    editingImageRef = '';
    document.querySelectorAll('.character-image-block.is-selected,.character-image-block.is-editing').forEach(node=>node.classList.remove('is-selected','is-editing'));
  }

  function selectImage(ref) {
    activeImageRef = ref;
    editingImageRef = '';
    document.querySelectorAll('.character-image-block').forEach(node=>node.classList.toggle('is-selected',node.dataset.imageBlock===ref));
    document.querySelectorAll('.character-image-block.is-editing').forEach(node=>node.classList.remove('is-editing'));
  }

  function startImageEditing(ref) {
    activeImageRef = ref;
    editingImageRef = ref;
    document.querySelectorAll('.character-image-block').forEach(node=>{
      const active=node.dataset.imageBlock===ref;
      node.classList.toggle('is-selected',active);
      node.classList.toggle('is-editing',active);
    });
  }

  function finishImageEditing(ref) {
    if (editingImageRef === ref) editingImageRef = '';
    document.querySelector(`[data-image-block="${CSS.escape(ref)}"]`)?.classList.remove('is-editing');
  }

  function pointInsideRect(x, y, rect) {
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  function closeLayerPicker() {
    layerPickerNode?.remove();
    layerPickerNode = null;
  }

  function writingLayersAtPoint(list, x, y) {
    const choices = [];
    const seen = new Set();
    for (const line of list.querySelectorAll('[data-flow-edit]')) {
      if (!pointInsideRect(x, y, line.getBoundingClientRect())) continue;
      const ref = line.dataset.flowEdit;
      if (seen.has(`flow:${ref}`)) continue;
      seen.add(`flow:${ref}`);
      choices.push({type:'flow', ref, label:shortText(line.textContent || 'Writing', 48)});
    }
    for (const block of list.querySelectorAll('[data-block]')) {
      const source = block.closest('.character-writing-source');
      if (source?.getAttribute('aria-hidden') === 'true') continue;
      if (!pointInsideRect(x, y, block.getBoundingClientRect())) continue;
      const ref = block.dataset.block;
      if (seen.has(`block:${ref}`)) continue;
      seen.add(`block:${ref}`);
      choices.push({type:'block', ref, label:shortText(block.textContent || 'Writing', 48)});
    }
    return choices;
  }

  function imageLayersAtPoint(list, x, y) {
    return [...list.querySelectorAll('.character-image-block[data-image-block]')]
      .filter(figure => pointInsideRect(x, y, figure.getBoundingClientRect()))
      .sort((a,b) => {
        const zA = Number(getComputedStyle(a).zIndex) || 0;
        const zB = Number(getComputedStyle(b).zIndex) || 0;
        return zB - zA;
      })
      .map(figure => {
        const ref = figure.dataset.imageBlock;
        const info = blockFromRef(ref);
        return {type:'image', ref, label:shortText(info.block?.alt || 'Character image', 48), layout:info.block?.layout || 'wrap'};
      });
  }

  function showLayerPickerAt(x, y, choices) {
    closeLayerPicker();
    const picker = document.createElement('div');
    picker.className = 'layer-picker-popover';
    picker.setAttribute('role','dialog');
    picker.setAttribute('aria-label','Choose what to edit');
    picker.innerHTML = `<div class="layer-picker-title"><strong>Choose what to edit</strong><button type="button" data-layer-picker-close aria-label="Close">×</button></div><div class="layer-picker-list">${choices.map(choice => {
      const attr = choice.type === 'image' ? `data-layer-pick-image="${esc(choice.ref)}"` : choice.type === 'flow' ? `data-layer-pick-flow="${esc(choice.ref)}"` : `data-layer-pick-block="${esc(choice.ref)}"`;
      const kind = choice.type === 'image' ? `${choice.layout === 'behind' ? 'Image behind words' : choice.layout === 'front' ? 'Image in front of words' : 'Wrapping image'}` : 'Writing';
      return `<button class="layer-picker-choice" type="button" ${attr}><span class="layer-picker-icon" aria-hidden="true">${choice.type === 'image' ? '▧' : 'T'}</span><span><strong>${esc(kind)}</strong><small>${esc(choice.label || kind)}</small></span></button>`;
    }).join('')}</div>`;
    document.body.append(picker);
    const width = picker.offsetWidth;
    const height = picker.offsetHeight;
    picker.style.left = `${Math.max(10, Math.min(window.innerWidth - width - 10, x + 10))}px`;
    picker.style.top = `${Math.max(10, Math.min(window.innerHeight - height - 10, y + 10))}px`;
    layerPickerNode = picker;
    requestAnimationFrame(()=>picker.querySelector('.layer-picker-choice')?.focus());
  }

  function chooseStackedLayer(event, list) {
    if (!list || event.button > 0 || event.target.closest('.image-edit-toolbar,.image-selection-edit,.image-resize-dot,.layer-picker-popover')) return false;
    const x = event.clientX;
    const y = event.clientY;
    const images = imageLayersAtPoint(list, x, y);
    if (!images.length) return false;
    if (editingImageRef && images.some(choice => choice.ref === editingImageRef)) return false;
    const writing = writingLayersAtPoint(list, x, y);
    const choices = [...images, ...writing];
    event.preventDefault();
    event.stopPropagation();
    if (choices.length === 1 && choices[0].type === 'image') {
      selectImage(choices[0].ref);
    } else {
      showLayerPickerAt(x, y, choices);
    }
    return true;
  }

  function syncImageFigure(ref) {
    const info=blockFromRef(ref);if(!info.block||info.block.type!=='image')return;
    const figure=document.querySelector(`[data-image-block="${CSS.escape(ref)}"]`);if(!figure)return;
    const layout=['wrap','front','behind'].includes(info.block.layout)?info.block.layout:'wrap';
    figure.classList.remove('image-layout-wrap','image-layout-front','image-layout-behind','image-wrap-left','image-wrap-right');
    figure.classList.add(`image-layout-${layout}`);
    figure.style.setProperty('--image-width',`${Math.max(120,Number(info.block.width)||300)}px`);
    figure.style.setProperty('--image-gap',`${Math.max(0,Math.min(80,Number(info.block.padding)||0))}px`);
    figure.style.setProperty('--image-opacity',Math.max(.15,Math.min(1,Number(info.block.opacity)||1)));
    const list=figure.closest('.character-block-list');
    const maxLeft=Math.max(0,(list?.clientWidth||0)-figure.offsetWidth);
    const left=maxLeft*(Math.max(0,Math.min(100,Number(info.block.xPct)||0))/100);
    figure.style.left=`${left}px`;
    figure.style.top=`${Math.max(0,Number(info.block.y)||0)}px`;
    figure.style.removeProperty('--image-y');
    const quick=figure.querySelector('[data-image-quick-layout]');if(quick)quick.value=layout;
    const img=figure.querySelector('img');if(img){img.src=info.block.src;img.alt=info.block.alt||'Character image';}
    if(list){list.style.minHeight=`${characterCanvasMinHeight(info.target.blocks)}px`;requestAnimationFrame(()=>layoutCharacterFlow(list));}
  }

  function makeImageEditorPanelDraggable() {
    const backdrop=el.modal.querySelector('.modal-backdrop');
    const modal=backdrop?.querySelector('.modal');
    const handle=modal?.querySelector('.modal-head');
    if(!backdrop||!modal||!handle)return;
    const rect=modal.getBoundingClientRect();
    backdrop.classList.add('image-settings-backdrop');
    modal.classList.add('image-settings-floating');
    handle.classList.add('image-settings-drag-handle');
    modal.style.left=`${Math.max(8,Math.min(window.innerWidth-rect.width-8,rect.left))}px`;
    modal.style.top=`${Math.max(8,Math.min(window.innerHeight-rect.height-8,rect.top))}px`;
    const begin=event=>{
      if(event.button>0||event.target.closest('button,input,select,textarea,label'))return;
      event.preventDefault();
      const startX=event.clientX,startY=event.clientY;
      const startLeft=parseFloat(modal.style.left)||modal.getBoundingClientRect().left;
      const startTop=parseFloat(modal.style.top)||modal.getBoundingClientRect().top;
      modal.classList.add('is-dragging');
      try{handle.setPointerCapture(event.pointerId);}catch(error){}
      const move=moveEvent=>{
        const bounds=modal.getBoundingClientRect();
        const left=Math.max(6,Math.min(window.innerWidth-bounds.width-6,startLeft+moveEvent.clientX-startX));
        const top=Math.max(6,Math.min(window.innerHeight-Math.min(bounds.height,window.innerHeight-12)-6,startTop+moveEvent.clientY-startY));
        modal.style.left=`${left}px`;modal.style.top=`${top}px`;
      };
      const end=()=>{
        modal.classList.remove('is-dragging');
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',end);
        document.removeEventListener('pointercancel',end);
        try{handle.releasePointerCapture(event.pointerId);}catch(error){}
      };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',end,{once:true});
      document.addEventListener('pointercancel',end,{once:true});
    };
    handle.addEventListener('pointerdown',begin);
  }

  function showImageEditor(ref) {
    const info=blockFromRef(ref);if(!info.block||info.block.type!=='image')return;
    const block=info.block;
    const layout=['wrap','front','behind'].includes(block.layout)?block.layout:'wrap';

    startImageEditing(ref);
    showModal('Image settings',`<div class="image-editor-modal" data-image-editor-ref="${esc(ref)}">

        <label><span>Image width <output data-image-editor-width-output>${width}px</output></span><input type="range" min="120" max="900" step="5" value="${width}" data-image-editor-width="${esc(ref)}"></label>
        <label data-image-editor-cushion-row ${layout!=='wrap'?'hidden':''}><span>Space between image and words <output data-image-editor-padding-output>${padding}px</output></span><input type="range" min="0" max="80" step="2" value="${padding}" data-image-editor-padding="${esc(ref)}"></label>
        <label><span>Image strength <output data-image-editor-opacity-output>${opacity}%</output></span><input type="range" min="15" max="100" step="5" value="${opacity}" data-image-editor-opacity="${esc(ref)}"></label>
        <label><span>Editor panel visibility <output data-image-panel-opacity-output>78%</output></span><input type="range" min="45" max="95" step="5" value="78" data-image-panel-opacity></label>
        <label><span>Image description</span><input class="input" type="text" value="${esc(block.alt||'')}" placeholder="Describe the image" data-image-editor-alt="${esc(ref)}"></label>

  function flowBlockStyle(type='text', content='') {
    const labelOnly=/^\s*(?:\*\*|__)[^\n]+?(?:\*\*|__)\s*$/.test(String(content||''));
    const styles={
      h1:{size:34,line:42,weight:800,italic:false,before:18,after:10},
      h2:{size:25,line:33,weight:800,italic:false,before:16,after:8},
      h3:{size:20,line:28,weight:800,italic:false,before:13,after:7},

  }

  function flowTokens(markdown='') {
    const source=cleanNotionRefs(markdown);
    const tokens=[];
    let bold=false,italic=false,code=false,buffer='';
    const flush=()=>{if(!buffer)return;for(const part of buffer.split(/(\s+)/)){if(!part)continue;tokens.push({text:part,bold,italic,code,space:/^\s+$/.test(part)});}buffer='';};
    for(let i=0;i<source.length;){
      if(source.slice(i,i+2)==='**'||source.slice(i,i+2)==='__'){flush();bold=!bold;i+=2;continue;}
      if(source[i]==='`'){flush();code=!code;i++;continue;}
      if(source[i]==='*'){flush();italic=!italic;i++;continue;}
      if(source[i]==='\n'){flush();tokens.push({newline:true});i++;continue;}
      buffer+=source[i++];
    }
    flush();return tokens;
  }

  function flowFont(style,token={}) {
    const weight=token.bold?800:(style.weight||400);
    const italic=token.italic||style.italic?'italic ':'';
    const family=token.code?'ui-monospace, SFMono-Regular, Menlo, monospace':'Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    return `${italic}${weight} ${style.size}px ${family}`;
  }

  function subtractFlowObstacle(segments, obstacle) {
    const out=[];
    for(const segment of segments){
      if(obstacle.right<=segment.left||obstacle.left>=segment.right){out.push(segment);continue;}
      if(obstacle.left>segment.left)out.push({left:segment.left,right:Math.min(segment.right,obstacle.left)});
      if(obstacle.right<segment.right)out.push({left:Math.max(segment.left,obstacle.right),right:segment.right});
    }
    return out.filter(segment=>segment.right-segment.left>=88);
  }

  function flowSegmentsForLine(list, images, y, lineHeight, indent=0) {
    let segments=[{left:28+indent,right:Math.max(29+indent,list.clientWidth-18)}];
    for(const image of images){
      const gap=image.gap;
      if(y+lineHeight<=image.top-gap||y>=image.bottom+gap)continue;
      segments=subtractFlowObstacle(segments,{left:image.left-gap,right:image.right+gap});
    }
    return segments.sort((a,b)=>a.left-b.left);
  }

    if(prefix){const bullet=document.createElement('span');bullet.className='character-flow-bullet';bullet.textContent=prefix;line.append(bullet);}

  function layoutCharacterFlow(list=document.querySelector('.character-block-list')) {
    if(!list||!list.dataset.characterDropZone)return;
    const characterId=list.dataset.characterDropZone;
    const character=getItem('characters',characterId);if(!character)return;
    const layer=list.querySelector('[data-character-flow]');const source=list.querySelector('.character-writing-source');if(!layer||!source)return;
    const wrapFigures=[...list.querySelectorAll('.character-image-block.image-layout-wrap')];
    if(!wrapFigures.length){list.classList.remove('has-custom-wrap');layer.replaceChildren();source.removeAttribute('aria-hidden');source.inert=false;return;}
    list.classList.add('has-custom-wrap');source.setAttribute('aria-hidden','true');source.inert=true;layer.replaceChildren();
    const listRect=list.getBoundingClientRect();
    const images=wrapFigures.map(figure=>{
      const ref=figure.dataset.imageBlock;const info=blockFromRef(ref);const maxLeft=Math.max(0,list.clientWidth-figure.offsetWidth);const left=maxLeft*(Math.max(0,Math.min(100,Number(info.block?.xPct)||0))/100);const top=Math.max(0,Number(info.block?.y)||0);figure.style.left=`${left}px`;figure.style.top=`${top}px`;return {left,right:left+figure.offsetWidth,top,bottom:top+figure.offsetHeight,gap:Math.max(0,Number(info.block?.padding)||0)};
    });
    const visibleBlocks=character.blocks.map((block,index)=>({block,index})).filter(({block})=>{
      if(block.type==='image'||isImportedCharacterSummary(block))return false;
      if(/^h[1-3]$/.test(block.type)&&stripMd(block.content).toLowerCase()===stripMd(character.name).toLowerCase())return false;
      return true;
    });
    const canvas=layoutCharacterFlow.canvas||(layoutCharacterFlow.canvas=document.createElement('canvas'));const ctx=canvas.getContext('2d');
    let y=12;
    for(const {block,index} of visibleBlocks){
      if(block.type==='divider'){y+=12;const divider=document.createElement('div');divider.className='character-flow-divider';divider.style.top=`${y}px`;layer.append(divider);y+=18;continue;}
      const style=flowBlockStyle(block.type,block.content);y+=style.before;
      const tokens=flowTokens(block.content||'');let cursor=0;let firstLine=true;let guard=0;
      while(cursor<tokens.length&&guard++<5000){
        const segments=flowSegmentsForLine(list,images,y,style.line,firstLine?(style.indent||0):0);
        if(!segments.length){y+=style.line;continue;}
        let forcedNewline=false;let placedOnLine=false;
        for(let s=0;s<segments.length&&cursor<tokens.length;s++){
          while(cursor<tokens.length&&tokens[cursor].space)cursor++;
          if(cursor>=tokens.length)break;
          if(tokens[cursor].newline){cursor++;forcedNewline=true;break;}
          const segment=segments[s];let width=0;const parts=[];let hadWord=false;
          const prefix=firstLine&&block.type==='bullet'?'• ':'';
          if(prefix){ctx.font=flowFont(style,{});width=ctx.measureText(prefix).width;}
          while(cursor<tokens.length){
            const token=tokens[cursor];
            if(token.newline){cursor++;forcedNewline=true;break;}
            ctx.font=flowFont(style,token);const measured=ctx.measureText(token.text).width;
            if(width+measured>segment.right-segment.left){
              if(hadWord)break;
              if(token.space){cursor++;continue;}
              break;
            }
            parts.push(token);width+=measured;cursor++;if(!token.space)hadWord=true;
          }
          while(parts.length&&parts[parts.length-1].space)parts.pop();
          if(parts.length){appendFlowLine(layer,index,style,segment,y,parts,prefix);placedOnLine=true;firstLine=false;}
          if(forcedNewline)break;
        }
        y+=style.line;
        if(!placedOnLine&&!forcedNewline)continue;
      }
      y+=style.after;
    }
    const imageBottom=images.reduce((max,image)=>Math.max(max,image.bottom+image.gap),0);const total=Math.max(300,y+24,imageBottom+40);
    layer.style.height=`${total}px`;list.style.minHeight=`${total}px`;
  }

  function parseCSV(text) {
    const rows=[];let row=[];let cell='';let quoted=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(ch==='"') { if(quoted&&text[i+1]==='"'){cell+='"';i++;} else quoted=!quoted; }
      else if(ch===','&&!quoted){row.push(cell);cell='';}
      else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];}
      else cell+=ch;
    }
    if(cell||row.length){row.push(cell);rows.push(row);}
    const headers=rows.shift()?.map(x=>x.trim())||[];
    return rows.map(values=>Object.fromEntries(headers.map((h,i)=>[h,(values[i]||'').trim()])));
  }

  function notionLinkNames(value='') {
    const out=[];const re=/\(([^\n]*?\.md)\)/g;let m;
    while((m=re.exec(value))){let part=decodeURIComponent(m[1]).replace(/\\/g,'/').split('/').pop().replace(/\s+[0-9a-f]{32}\.md$/i,'').replace(/\.md$/i,'');if(part&&!out.includes(part))out.push(part);}
    return out;
  }

  async function initFirebase() {

    try{
      const appMod=await import('https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js');

      const app=appMod.initializeApp(window.FIREBASE_CONFIG);const auth=authMod.getAuth(app);const db=fsMod.getFirestore(app);const worldRef=fsMod.doc(db,'worlds',window.FIREBASE_WORLD_ID||state.workspace.worldId||'riftbound-world');
      firebase.api={...authMod,...fsMod,auth,db,worldRef};
      authMod.onAuthStateChanged(auth,user=>{
        firebase.user=user;firebase.connected=!!user;

          if(user.email&&!state.workspace.access[user.email.toLowerCase()])state.workspace.access[user.email.toLowerCase()]='Owner';
          firebase.unsubscribe?.();
          firebase.unsubscribe=fsMod.onSnapshot(worldRef,snap=>{
            if(snap.exists()){
              firebase.applyingRemote=true;state=snap.data();normalizeState();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));firebase.applyingRemote=false;render();

  function modelImageRect(figure,list) {
    const ref = figure.dataset.imageBlock;
    const info = blockFromRef(ref);
    const block = info.block || {};
    const listRect = list.getBoundingClientRect();
    const width = Math.max(1, figure.offsetWidth || Number(block.width) || 300);
    const img = figure.querySelector('img');
    const ratio = Number(block.ratio) || (img?.naturalWidth && img?.naturalHeight ? img.naturalWidth/img.naturalHeight : 1.25);
    const height = Math.max(1, figure.offsetHeight || img?.offsetHeight || width/ratio);
    let left = Number.isFinite(figure.offsetLeft) ? figure.offsetLeft : 0;
    let top = Number.isFinite(figure.offsetTop) ? figure.offsetTop : (Number(block.y)||0);
    if (!figure.offsetParent) {
      const maxLeft = Math.max(0,list.clientWidth-width);
      left = maxLeft * (Math.max(0,Math.min(100,Number(block.xPct)||0))/100);
      top = Math.max(0,Number(block.y)||0);
    }
    return {left:listRect.left+left,top:listRect.top+top,right:listRect.left+left+width,bottom:listRect.top+top+height,width,height};
  }

  const imageLayersAtPointBeforeModelFix = imageLayersAtPoint;
  imageLayersAtPoint = function(list,x,y) {
    const choices = imageLayersAtPointBeforeModelFix(list,x,y) || [];
    const seen = new Set(choices.map(choice=>choice.ref));
    for (const figure of list.querySelectorAll('.character-image-block[data-image-block]')) {

      if (seen.has(ref)) continue;
      const rect = modelImageRect(figure,list);
      if (!pointInsideRect(x,y,rect)) continue;
      const info = blockFromRef(ref);
      choices.push({type:'image',ref,label:shortText(info.block?.alt||'Character image',48),layout:info.block?.layout||'wrap'});
      seen.add(ref);
    }
    return choices.sort((a,b)=>{
      const nodeA=document.querySelector(`[data-image-block="${CSS.escape(a.ref)}"]`);
      const nodeB=document.querySelector(`[data-image-block="${CSS.escape(b.ref)}"]`);

  function snapCanvasBlock(ref) {
    if (!ref || canvasPlacementMode()!=='grid') return;
    const info=blockFromRef(ref);
    if (!info.block) return;
    const grid=canvasGridSize();
    const list=document.querySelector(`[data-block-list="${CSS.escape(info.kind+':'+info.itemId)}"]`) || document.querySelector('.character-block-list');
    if (!list) return;
    const node=info.block.type==='image' ? document.querySelector(`[data-image-block="${CSS.escape(ref)}"]`) : document.querySelector(`[data-text-block="${CSS.escape(ref)}"]`);
    if (!node || (info.block.type!=='image' && textElementLayout(info.block)==='inline')) return;
    const minimumWidth=info.block.type==='image'?120:90;
    const snappedWidth=Math.max(minimumWidth,Math.round(node.offsetWidth/grid)*grid);
    const snappedHeight=Math.max(info.block.type==='divider'?28:40,Math.round(node.offsetHeight/grid)*grid);
    const left=Math.max(0,Math.round(node.offsetLeft/grid)*grid);
    const top=Math.max(0,Math.round(node.offsetTop/grid)*grid);
    info.block.width=snappedWidth;
    if (info.block.type!=='image') info.block.height=snappedHeight;
    const maxLeft=Math.max(0,list.clientWidth-snappedWidth);
    const boundedLeft=Math.min(maxLeft,left);
    info.block.xPct=maxLeft?boundedLeft/maxLeft*100:0;
    info.block.y=top;
    info.target.updatedAt=nowISO();
    if (info.block.type==='image') syncImageFigure(ref);
    else {
      node.style.setProperty('--text-width',`${snappedWidth}px`);
      node.style.setProperty('--text-height',`${snappedHeight}px`);
      node.style.left=`${boundedLeft}px`;
      node.style.top=`${top}px`;
      node.classList.add('has-manual-height');

  function codexLocationSubtreeVisible(item,allowed,seen=new Set()) {
    if (seen.has(item.id)) return false;

  function renderCodexLocationNodes(items=state.locations,surface='collection') {
    const allowed=new Set(items.map(item=>item.id));
    const filtering=surface==='collection' && Boolean((collectionFilters.locations||'').trim());
    const expanded=new Set(state.workspace.locationTreeExpanded||[]);
    const roots=state.locations.filter(item=>!item.parentLocationId||!getItem('locations',item.parentLocationId));
    const renderNode=(item,seen=new Set())=>{
      if (seen.has(item.id)||!codexLocationSubtreeVisible(item,allowed,seen)) return '';
      const next=new Set(seen);next.add(item.id);
      const children=childrenOf(item.id).filter(child=>codexLocationSubtreeVisible(child,allowed,next));
      const open=Boolean(children.length&&(expanded.has(item.id)||filtering));
      return `<li class="codex-tree-node${open?' is-open':''}" data-codex-tree-node="${esc(item.id)}">
        <div class="codex-tree-pill">
          ${children.length?`<button class="codex-tree-toggle" type="button" data-codex-tree-toggle="${esc(item.id)}" aria-expanded="${open}" aria-label="${open?'Collapse':'Expand'} locations inside ${esc(item.name)}"><span class="codex-tree-chevron" aria-hidden="true">⌄</span></button>`:`<span class="codex-tree-leaf-dot" aria-hidden="true"></span>`}

        </div>
        ${children.length?`<div class="codex-tree-collapse"><div class="codex-tree-collapse-inner"><ul class="codex-tree-children">${children.map(child=>renderNode(child,next)).join('')}</ul></div></div>`:''}
      </li>`;
    };
    return `<ul class="codex-tree-root" data-codex-tree-surface="${surface}">${roots.map(root=>renderNode(root)).join('')||'<li class="empty-state">No location hierarchy yet.</li>'}</ul>`;
  }

  /* Reliable character image wrapping.
     The image can finish decoding after the page first renders. Previously the
     flow engine measured a nearly zero-height image, then left the original
     writing underneath it. Estimate the image box immediately and reflow again
     whenever the actual image dimensions become available. */
  let characterWrapFrame = 0;
  const observedCharacterWrapLists = new WeakSet();

  function requestCharacterWrap(list) {
    if (!list || !list.isConnected) return;
    cancelAnimationFrame(characterWrapFrame);
    characterWrapFrame = requestAnimationFrame(() => {
      characterWrapFrame = 0;
      if (list.isConnected) layoutCharacterFlow(list);
    });
  }

  const layoutCharacterFlowBeforeImageDecodeFix = layoutCharacterFlow;
  layoutCharacterFlow = function(list = document.querySelector('.character-block-list')) {
    if (!list || !list.dataset.characterDropZone) return;

    for (const figure of list.querySelectorAll('.character-image-block.image-layout-wrap[data-image-block]')) {
      const img = figure.querySelector('img');
      const info = blockFromRef(figure.dataset.imageBlock);
      const width = Math.max(1, figure.getBoundingClientRect().width || figure.offsetWidth || Number(info.block?.width) || 300);
      const storedRatio = Math.max(.1, Number(info.block?.ratio) || 1);
      const decoded = Boolean(img?.complete && img.naturalWidth > 0 && img.naturalHeight > 0);

      if (!decoded) {
        // ratio is stored as width / height.
        figure.style.height = `${Math.max(80, width / storedRatio)}px`;
      } else {
        figure.style.removeProperty('height');
        if (info.block && (!Number(info.block.ratio) || Math.abs(Number(info.block.ratio) - (img.naturalWidth / img.naturalHeight)) > .01)) {
          info.block.ratio = img.naturalWidth / img.naturalHeight;
        }
      }
    }

    layoutCharacterFlowBeforeImageDecodeFix(list);
  };

  const installCharacterImageInteractionsBeforeDecodeFix = installCharacterImageInteractions;
  installCharacterImageInteractions = function() {
    installCharacterImageInteractionsBeforeDecodeFix();
    const list = document.querySelector('.character-block-list');
    if (!list || observedCharacterWrapLists.has(list)) return;
    observedCharacterWrapLists.add(list);

    const reflow = () => requestCharacterWrap(list);
    list.addEventListener('load', event => {
      if (event.target.matches?.('.character-image-block img')) reflow();
    }, true);
    list.addEventListener('error', event => {
      if (event.target.matches?.('.character-image-block img')) reflow();
    }, true);

    for (const img of list.querySelectorAll('.character-image-block img')) {
      if (img.complete && img.naturalWidth > 0) {
        reflow();
      } else if (typeof img.decode === 'function') {
        img.decode().then(reflow).catch(() => {});
      }
    }

    if ('ResizeObserver' in window) {
      const observer = new ResizeObserver(reflow);
      list.querySelectorAll('.character-image-block,.character-image-block img').forEach(node => observer.observe(node));
      list._codexWrapResizeObserver = observer;
    }

    reflow();
  };

  document.addEventListener('dragover', event => {
    const slot = event.target.closest?.('[data-character-media-drop]');
    if (!slot) return;
    event.preventDefault();
    slot.classList.add('is-dragover');
  });
  document.addEventListener('dragleave', event => {
    const slot = event.target.closest?.('[data-character-media-drop]');

  });
  document.addEventListener('drop', event => {
    const slot = event.target.closest?.('[data-character-media-drop]');
    if (!slot) return;
    event.preventDefault();
    slot.classList.remove('is-dragover');
    const file = [...(event.dataTransfer?.files || [])].find(item => item.type?.startsWith('image/'));
    if (!file) return;
    const [mediaSlot, characterId] = slot.dataset.characterMediaDrop.split(':');
    setCharacterPageImage(characterId, mediaSlot, file);
  });
