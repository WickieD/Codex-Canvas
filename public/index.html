<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#80694f">
  <title>Riftbound Codex</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
:root {
  --bg: #f5f0e7;
  --panel: #fcfaf6;
  --panel-strong: #ffffff;
  --panel-soft: #eee7dc;
  --text: #2b2723;
  --muted: #746c63;
  --border: #d9d0c3;
  --accent: #80694f;
  --accent-strong: #66513b;
  --accent-soft: #e6ddd0;
  --success: #47715b;
  --warning: #a36d2f;
  --danger: #a24e4e;
  --shadow: 0 14px 34px rgba(55, 44, 31, .12);
  --sidebar-width: 272px;
  --radius: 14px;
  color-scheme: light;
}

body.theme-slate {
  --bg: #edf0f2;
  --panel: #f8fafb;
  --panel-strong: #ffffff;
  --panel-soft: #e2e7ea;
  --text: #20262b;
  --muted: #667079;
  --border: #ced6dc;
  --accent: #536b78;
  --accent-strong: #3d5360;
  --accent-soft: #dce5e9;
}

body.theme-moss {
  --bg: #eef1e8;
  --panel: #fafbf7;
  --panel-strong: #ffffff;
  --panel-soft: #e4eadb;
  --text: #273024;
  --muted: #687162;
  --border: #d0d9c7;
  --accent: #647657;
  --accent-strong: #4d6044;
  --accent-soft: #e0e8d7;
}

body.theme-ink {
  --bg: #17191c;
  --panel: #202328;
  --panel-strong: #262a30;
  --panel-soft: #2d3138;
  --text: #f0eee9;
  --muted: #aaa79f;
  --border: #3a3f47;
  --accent: #b39a78;
  --accent-strong: #ccb58f;
  --accent-soft: #3c362e;
  --shadow: 0 18px 40px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }

.app-shell { min-height: 100vh; display: flex; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-width);
  z-index: 30;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-right: 1px solid var(--border);
  transition: transform .22s ease;
}
.workspace-shell { min-width: 0; flex: 1; margin-left: var(--sidebar-width); }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 64px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 22px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.main-content { width: 100%; max-width: 1240px; margin: 0 auto; padding: 32px 38px 72px; outline: none; }

.sidebar-head { padding: 18px 16px 14px; border-bottom: 1px solid var(--border); }
.workspace-switcher {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  padding: 9px;
  text-align: left;
}
.workspace-switcher:hover { background: var(--panel-soft); }
.workspace-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: white;
  background: var(--accent);
  font-family: Georgia, serif;
  font-weight: 700;
}
.workspace-copy { min-width: 0; flex: 1; }
.workspace-name { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workspace-subtitle { display: block; font-size: 12px; color: var(--muted); }
.sidebar-nav { padding: 10px; overflow-y: auto; flex: 1; }
.nav-group { margin-bottom: 14px; }
.nav-label { padding: 8px 9px 5px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 38px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  padding: 8px 10px;
  text-align: left;
  color: var(--muted);
}
.nav-item:hover { color: var(--text); background: var(--panel-soft); }
.nav-item.active { color: var(--text); background: var(--accent-soft); font-weight: 650; }
.nav-icon { width: 20px; height: 20px; display: grid; place-items: center; color: var(--accent); flex: 0 0 20px; }
.nav-icon svg,.search-result-icon svg { width: 18px; height: 18px; display: block; fill: currentColor; stroke: currentColor; stroke-width: 0; }
.nav-item > span:not(.nav-count),.nav-item .nav-icon * { pointer-events: none; }
.nav-item { position: relative; z-index: 1; cursor: pointer; }
.nav-count { margin-left: auto; font-size: 12px; color: var(--muted); pointer-events: none; }
.location-mini-tree { padding-left: 12px; }
.tree-row { display: flex; align-items: center; gap: 6px; }
.tree-indent { width: 12px; border-left: 1px solid var(--border); align-self: stretch; }
.tree-link { flex: 1; border: 0; background: transparent; text-align: left; color: var(--muted); padding: 5px 7px; border-radius: 7px; font-size: 13px; }
.tree-link:hover { background: var(--panel-soft); color: var(--text); }
.sidebar-foot { padding: 12px; border-top: 1px solid var(--border); }
.sidebar-user { display: flex; align-items: center; gap: 10px; padding: 7px; }
.avatar { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-size: 12px; font-weight: 800; }
.user-copy { min-width: 0; }
.user-name { font-size: 13px; font-weight: 650; }
.user-mode { color: var(--muted); font-size: 11px; }

.breadcrumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.crumb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb-button { border: 0; background: transparent; padding: 4px 3px; color: inherit; border-radius: 5px; }
.crumb-button:hover { color: var(--text); background: var(--panel-soft); }
.crumb-separator { color: var(--border); }
.topbar-actions { display: flex; align-items: center; gap: 9px; }
.global-search { width: min(270px, 28vw); position: relative; display: block; }
.global-search input {
  width: 100%;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  padding: 0 12px 0 34px;
  outline: none;
}
.global-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.search-icon { position: absolute; left: 11px; top: 7px; color: var(--muted); font-size: 18px; }
.save-status { font-size: 12px; color: var(--muted); white-space: nowrap; }
.button {
  min-height: 38px;
  border-radius: 9px;
  border: 1px solid transparent;
  padding: 8px 13px;
  font-weight: 650;
  background: var(--accent);
  color: white;
}
.button:hover { filter: brightness(.96); }
.button.secondary { background: var(--panel); color: var(--text); border-color: var(--border); }
.button.ghost { background: transparent; color: var(--muted); border-color: transparent; }
.button.danger { background: var(--danger); }
.button.small { min-height: 32px; padding: 5px 10px; font-size: 13px; }
.icon-button, .avatar-button {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
}
.avatar-button { border-radius: 50%; font-size: 11px; font-weight: 800; background: var(--accent-soft); color: var(--accent-strong); }
.mobile-only { display: none; }

.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; margin-bottom: 28px; }
.page-kicker { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 8px; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 8px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 4vw, 54px); line-height: 1.06; font-weight: 600; letter-spacing: -.02em; }
h2 { margin-bottom: 12px; font-size: 22px; }
h3 { margin-bottom: 8px; font-size: 17px; }
.page-subtitle { max-width: 720px; color: var(--muted); margin-bottom: 0; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
.metric-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 17px; }
.metric-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.metric-value { margin-top: 8px; font-family: Georgia, serif; font-size: 32px; line-height: 1; }
.metric-detail { margin-top: 7px; color: var(--muted); font-size: 12px; }

.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr); gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 18px 0; }
.panel-body { padding: 17px 18px 18px; }
.quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
.quick-card { border: 1px solid var(--border); border-radius: 11px; background: var(--panel-strong); padding: 14px; text-align: left; }
.quick-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.quick-title { display: block; font-weight: 700; }
.quick-copy { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
.activity-list { display: grid; gap: 12px; }
.activity-item { display: grid; grid-template-columns: 9px 1fr; gap: 9px; }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.activity-text { font-size: 13px; }
.activity-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

.collection-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.segmented { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
.segmented button { border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 6px 10px; }
.segmented button.active { background: var(--accent-soft); color: var(--text); font-weight: 650; }
.input, .select, .textarea {
  width: 100%;
  min-height: 39px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel-strong);
  padding: 8px 10px;
  outline: none;
}
.textarea { min-height: 120px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.toolbar-search { width: 230px; }

.card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.entity-card { display: block; width: 100%; min-width: 0; border: 1px solid var(--border); border-radius: 13px; background: var(--panel); overflow: hidden; text-align: left; }
.entity-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 7px 20px rgba(40, 32, 23, .07); }
.entity-card-cover { display: block; width: 100%; height: 76px; background: linear-gradient(135deg, var(--accent-soft), var(--panel-soft)); position: relative; }
.entity-card-monogram { position: absolute; left: 14px; bottom: -20px; width: 43px; height: 43px; display: grid; place-items: center; border-radius: 12px; background: var(--panel-strong); border: 1px solid var(--border); color: var(--accent-strong); font-family: Georgia, serif; font-weight: 700; }
.entity-card-body { display: block; width: 100%; padding: 30px 15px 15px; }
.entity-card-title { display: block; font-weight: 750; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.entity-card-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; min-height: 18px; }
.entity-card-copy { margin-top: 12px; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.tag { display: inline-flex; align-items: center; min-height: 24px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong); padding: 3px 8px; font-size: 11px; font-weight: 650; }

.table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: auto; background: var(--panel); }
table { width: 100%; border-collapse: collapse; min-width: 760px; }
th { position: sticky; top: 0; z-index: 1; text-align: left; background: var(--panel-soft); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
th, td { padding: 11px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-soft); }
.cell-title { font-weight: 680; }
.cell-muted { color: var(--muted); font-size: 13px; }
.empty-state { padding: 55px 20px; text-align: center; color: var(--muted); }

.entity-hero { border: 1px solid var(--border); background: var(--panel); border-radius: 18px; overflow: hidden; margin-bottom: 20px; }
.entity-cover { height: 132px; background: linear-gradient(120deg, var(--accent-soft), var(--panel-soft) 58%, color-mix(in srgb, var(--accent) 20%, var(--panel))); }
.entity-title-row { display: flex; align-items: flex-start; gap: 12px; padding: 18px 24px 22px; }
.entity-title-input { flex: 1; min-width: 0; width: 100%; min-height: 48px; max-height: none; overflow: hidden; resize: none; border: 0; padding: 0; background: transparent; font-family: Georgia, serif; font-size: clamp(30px, 5vw, 48px); line-height: 1.08; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; }
.favorite-button { border: 0; background: transparent; color: var(--muted); font-size: 22px; padding: 8px; }
.favorite-button.on { color: var(--warning); }
.entity-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 22px; align-items: start; }
.editor-surface { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); min-height: 400px; padding: 22px; }
.properties-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 17px; position: sticky; top: 84px; }
.property-list { display: grid; gap: 12px; }
.property-row label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; }
.property-help { color: var(--muted); font-size: 11px; margin-top: 5px; }
.character-snapshot { margin-bottom: 18px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel-soft); }
.snapshot-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
.snapshot-field { min-width: 0; }
.snapshot-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; }
.snapshot-value { display: block; overflow-wrap: anywhere; }
.snapshot-relationships { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--border); }
.snapshot-relationships p { margin: 0; }
.property-links { display: flex; flex-wrap: wrap; gap: 6px; }
.link-pill { border: 1px solid var(--border); background: var(--panel-strong); border-radius: 999px; padding: 5px 9px; font-size: 12px; }
.link-pill:hover { border-color: var(--accent); color: var(--accent-strong); }
.breadcrumb-trail { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.breadcrumb-pill { border: 0; background: var(--accent-soft); color: var(--accent-strong); border-radius: 999px; padding: 5px 9px; font-size: 12px; }
.children-list { display: grid; gap: 7px; }
.child-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; background: var(--panel-strong); }
.hierarchy-root-note { border: 1px solid var(--border); border-radius: 10px; background: var(--accent-soft); padding: 12px; }
.hierarchy-root-copy { display: grid; gap: 3px; }
.hierarchy-root-copy strong { color: var(--accent-strong); }
.hierarchy-root-copy span { color: var(--muted); font-size: 12px; }

.block-toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.block-tool { min-width: 32px; height: 31px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel-strong); color: var(--muted); font-size: 12px; }
.block-tool:hover { color: var(--text); border-color: var(--accent); }
.block-list { display: grid; gap: 5px; }
.block-row { position: relative; padding-left: 24px; border-radius: 7px; }
.block-row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.block-handle { position: absolute; left: 2px; top: 8px; opacity: 0; color: var(--muted); font-size: 12px; user-select: none; }
.block-row:hover .block-handle { opacity: 1; }
.block-content { min-height: 30px; outline: none; padding: 4px 5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.block-content strong { font-weight: 780; }
.block-content em { font-style: italic; }
.block-content code { border-radius: 5px; background: var(--panel-soft); padding: 1px 4px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .92em; }
.markdown-label-block { margin-top: 10px; padding-top: 8px; }
.block-content[data-type="h1"] { font-family: Georgia, serif; font-size: 30px; font-weight: 650; padding-top: 9px; }
.block-content[data-type="h2"] { font-size: 23px; font-weight: 720; padding-top: 10px; }
.block-content[data-type="h3"] { font-size: 18px; font-weight: 720; padding-top: 8px; }
.block-content[data-type="bullet"]::before { content: "•"; margin-right: 8px; color: var(--accent); }
.block-content[data-type="number"] { counter-increment: item; }
.block-content[data-type="number"]::before { content: counter(item) "."; margin-right: 8px; color: var(--muted); }
.block-content[data-type="quote"] { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); font-style: italic; }
.block-content[data-type="code"] { background: var(--panel-soft); border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
.block-divider { height: 1px; background: var(--border); margin: 13px 4px; }
.block-placeholder { color: var(--muted); font-size: 13px; padding: 12px 5px; }

.graph-toolbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.graph-filter-panel { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); padding: 15px; }
.graph-filter-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 13px; }
.graph-filter-heading h2 { margin: 0; font-size: 17px; }
.graph-filter-heading p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.graph-filter-actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; }
.graph-filter-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 12px; }
.graph-filter-group { min-width: 0; margin: 0; border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px 11px; }
.graph-filter-group legend { padding: 0 5px; color: var(--muted); font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .05em; }
.graph-check-row { display: flex; flex-wrap: wrap; gap: 7px; }
.graph-check { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel-strong); padding: 5px 10px; cursor: pointer; font-size: 13px; }
.graph-check:hover { border-color: var(--accent); }
.graph-check input { margin: 0; accent-color: var(--accent); }
.graph-check input:not(:checked) + span { color: var(--muted); text-decoration: line-through; }
.graph-item-details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 11px; }
.graph-item-details summary { cursor: pointer; font-weight: 700; }
.graph-item-details summary span { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 5px; }
.graph-item-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; max-height: 235px; overflow: auto; padding: 11px 2px 2px; }
.graph-item-list .graph-check { border-radius: 9px; width: 100%; min-width: 0; }
.graph-item-list .graph-check span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.graph-stage { position: relative; min-height: 620px; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); overflow: hidden; }
.graph-stage svg { width: 100%; height: 620px; display: block; }
.graph-legend { position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 28px); padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(9px); font-size: 11px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.graph-help { color: var(--muted); font-size: 12px; margin-top: 9px; }
.graph-node-label { pointer-events: none; font-size: 11px; fill: var(--text); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.graph-link { stroke: var(--border); stroke-opacity: .8; }
.graph-link.related { stroke-dasharray: 5 5; }
.graph-link.current { stroke: var(--accent); stroke-opacity: .65; }
.graph-node { cursor: pointer; stroke: var(--panel-strong); stroke-width: 2px; }

.graph-node.selected { stroke: var(--text); stroke-width: 4px; }
.graph-node-glyph { pointer-events: none; font-size: 9px; font-weight: 850; fill: var(--panel); text-anchor: middle; dominant-baseline: central; }
.graph-edge-label { pointer-events: none; font-size: 10px; font-weight: 700; fill: var(--muted); paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
.graph-group-label { pointer-events: none; font-size: 10px; font-weight: 800; letter-spacing: .08em; fill: var(--muted); text-anchor: middle; }
.graph-reading-guide { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr); gap: 14px; align-items: start; margin-bottom: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); padding: 15px; }
.graph-reading-guide h2 { margin: 4px 0 4px; font-size: 17px; }
.graph-reading-guide p { margin: 0; color: var(--muted); font-size: 13px; }
.graph-reading-key { display: grid; gap: 7px; }
.graph-key-row { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; }
.graph-key-dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; border: 2px solid var(--panel-strong); }
.graph-key-line { width: 28px; height: 0; flex: 0 0 auto; border-top: 2px solid var(--accent); }
.graph-key-line.dashed { border-top-style: dashed; border-top-color: var(--muted); }
.graph-visual-grid { display: grid; gap: 14px; align-items: start; }
.graph-inspector { border: 1px solid var(--border); border-radius: 14px; background: var(--panel); padding: 15px; min-width: 0; }
.graph-inspector h2 { margin: 3px 0 4px; font-size: 18px; }
.graph-inspector-copy { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.graph-connection-list { display: grid; gap: 8px; }
.graph-connection { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 8px; align-items: start; border-top: 1px solid var(--border); padding-top: 8px; font-size: 13px; }
.graph-connection:first-child { border-top: 0; padding-top: 0; }
.graph-relation-tag { display: inline-flex; align-items: center; min-height: 22px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); padding: 2px 7px; font-size: 10px; font-weight: 800; white-space: nowrap; }
.graph-empty-inspector { color: var(--muted); font-size: 13px; }
.graph-open-button { margin-top: 13px; }
.graph-link.parent { stroke: var(--accent); stroke-opacity: .85; }
.graph-link.related { stroke: var(--muted); stroke-opacity: .6; stroke-dasharray: 5 5; }
.graph-link.relationship { stroke: var(--success); stroke-opacity: .75; }
.graph-link.current { stroke: var(--success); stroke-opacity: .8; }
.graph-link.member { stroke: var(--warning); stroke-opacity: .8; }
.graph-link.event { stroke: var(--danger); stroke-opacity: .7; }
.graph-link.keyPerson { stroke: var(--accent); stroke-opacity: .7; stroke-dasharray: 2 4; }
@media (min-width: 1120px) {
  .graph-visual-grid { grid-template-columns: minmax(0, 1fr) 300px; }
  .graph-inspector { position: sticky; top: 78px; }
}
@media (max-width: 760px) {
  .graph-reading-guide { grid-template-columns: 1fr; }
}


.timeline { position: relative; max-width: 900px; margin: 0 auto; }
.timeline::before { content: ""; position: absolute; left: 145px; top: 0; bottom: 0; width: 1px; background: var(--border); }
.timeline-item { display: grid; grid-template-columns: 125px 32px 1fr; gap: 8px; margin-bottom: 18px; position: relative; }
.timeline-date { text-align: right; padding-top: 13px; color: var(--muted); font-size: 12px; }
.timeline-dot-wrap { display: flex; justify-content: center; padding-top: 14px; }
.timeline-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--bg); z-index: 1; }
.timeline-card { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); padding: 14px 15px; cursor: pointer; }
.timeline-card:hover { border-color: var(--accent); }
.timeline-title { font-weight: 750; }
.timeline-copy { color: var(--muted); font-size: 13px; margin-top: 6px; }

.member-list { display: grid; gap: 10px; }
.member-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px 90px; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); padding: 11px; }
.member-person { display: flex; align-items: center; gap: 10px; min-width: 0; }
.member-email { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-callout { margin-bottom: 18px; border: 1px solid var(--border); border-radius: 13px; background: var(--accent-soft); padding: 15px; }
.invite-form { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 9px; margin-bottom: 18px; }

.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.settings-card { border: 1px solid var(--border); border-radius: 13px; background: var(--panel); padding: 17px; }
.theme-options { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; margin-top: 12px; }
.theme-option { border: 1px solid var(--border); border-radius: 10px; background: var(--panel-strong); padding: 8px; }
.theme-swatch { height: 43px; border-radius: 7px; margin-bottom: 6px; border: 1px solid rgba(0,0,0,.08); }
.theme-option.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent); }
.status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warning); }
.status-dot.online { background: var(--success); }

.search-results { display: grid; gap: 8px; }
.search-result { display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); padding: 10px; cursor: pointer; }
.search-result:hover { border-color: var(--accent); }
.search-result-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent-strong); font-family: Georgia, serif; font-weight: 700; }
.search-result-meta { color: var(--muted); font-size: 12px; }

.modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(18, 17, 15, .55); }
.modal { width: min(560px, 100%); max-height: min(720px, 90vh); overflow: auto; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 17px 18px; border-bottom: 1px solid var(--border); }
.modal-body { padding: 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 15px 18px; border-top: 1px solid var(--border); }
.toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: grid; gap: 9px; }
.toast { max-width: 360px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel-strong); box-shadow: var(--shadow); padding: 11px 13px; font-size: 13px; animation: toast-in .2s ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }

@media (max-width: 980px) {
  .metric-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .card-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .entity-layout { grid-template-columns: 1fr; }
  .properties-panel { position: static; }
  .graph-toolbar { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .graph-filter-grid { grid-template-columns: 1fr; }
  .graph-item-list { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .settings-grid { grid-template-columns: 1fr; }
}

@media (max-width: 760px) {
  :root { --sidebar-width: min(310px, 88vw); }
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow); }
  body.sidebar-open .sidebar { transform: translateX(0); }
  .sidebar-backdrop { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); }
  body.sidebar-open .sidebar-backdrop { display: block !important; }
  .workspace-shell { margin-left: 0; }
  .mobile-only { display: grid; }
  .topbar { padding: 9px 12px; }
  .main-content { padding: 24px 16px 60px; }
  .global-search { width: 42px; }
  .global-search input { width: 42px; padding-left: 34px; padding-right: 5px; }
  .global-search input:focus { position: absolute; right: 0; top: -19px; width: min(310px, calc(100vw - 90px)); z-index: 3; padding-right: 12px; }
  .save-status { display: none; }
  .topbar-actions .button.secondary { display: none; }
  .page-head { display: block; }
  .page-actions { margin-top: 15px; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .card-grid { grid-template-columns: 1fr; }
  .entity-cover { height: 92px; }
  .entity-title-row { padding: 16px 18px 18px; }
  .entity-title-input { font-size: 34px; line-height: 1.1; }
  .graph-stage, .graph-stage svg { min-height: 520px; height: 520px; }
  .timeline::before { left: 13px; }
  .timeline-item { grid-template-columns: 27px 1fr; gap: 8px; }
  .timeline-date { grid-column: 2; text-align: left; padding: 0; }
  .timeline-dot-wrap { grid-column: 1; grid-row: 1 / span 2; padding-top: 4px; }
  .timeline-card { grid-column: 2; }
  .invite-form { grid-template-columns: 1fr; }
  .member-row { grid-template-columns: 1fr; }
  .theme-options { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 480px) {
  .metric-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
  .metric-value { font-size: 27px; }
  .quick-grid { grid-template-columns: 1fr; }
  .graph-toolbar { grid-template-columns: 1fr; }
  .graph-filter-heading { display: block; }
  .graph-filter-actions { justify-content: flex-start; margin-top: 10px; }
  .graph-item-list { grid-template-columns: 1fr; max-height: 280px; }
  .snapshot-grid { grid-template-columns: 1fr; }
  h1 { font-size: 38px; }
}

/* Story-first graph */
.story-map-summary {
  display: grid;
  gap: 12px;
  margin-bottom: 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--panel);
  padding: 15px;
}
.story-map-summary p { margin: 0; color: var(--muted); font-size: 13px; }
.story-path-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.story-path-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 34px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-strong);
  padding: 5px 10px 5px 6px;
  font-size: 13px;
}
.story-path-chip strong {
  display: inline-grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--panel);
  font-size: 11px;
}
.story-path-arrow { color: var(--muted); font-weight: 800; }
.story-link {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.2px;
  stroke-opacity: .82;
}
.story-link.branch-path {
  stroke: var(--success);
  stroke-width: 1.6px;
  stroke-opacity: .66;
}
.story-node-group { cursor: grab; }
.story-node-group:active { cursor: grabbing; }
.story-node-circle {
  stroke: var(--panel-strong);
  stroke-width: 3px;
  transition: stroke-width .15s ease, filter .15s ease;
}
.story-node-group:hover .story-node-circle { stroke-width: 5px; }
.story-node-group.selected .story-node-circle {
  stroke: var(--text);
  stroke-width: 5px;
}
.story-step-number {
  pointer-events: none;
  fill: var(--panel);
  font-size: 12px;
  font-weight: 850;
}
.story-role-label {
  pointer-events: none;
  fill: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .04em;
  paint-order: stroke;
  stroke: var(--panel);
  stroke-width: 4px;
  stroke-linejoin: round;
}
.story-node-label { font-size: 12px; font-weight: 750; }
.story-edge-label { font-size: 10px; }
@media (max-width: 720px) {
  .story-path-arrow { display: none; }
  .story-path-chips { align-items: stretch; }
  .story-path-chip { border-radius: 10px; }
}

/* Roleplay story reader */
.story-jump-panel {
  margin-bottom: 18px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel);
  padding: 15px;
}
.story-jump-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.story-jump-heading p { margin: 0; color: var(--muted); font-size: 13px; }
.story-jump-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 8px; }
.story-jump {
  min-width: 0;
  display: grid;
  grid-template-columns: 30px minmax(0,1fr);
  grid-template-rows: auto auto;
  align-items: center;
  gap: 1px 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel-strong);
  padding: 9px;
  text-align: left;
}
.story-jump:hover { border-color: var(--accent); background: var(--accent-soft); }
.story-jump.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.story-jump > span {
  grid-row: 1 / span 2;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--accent);
  color: var(--panel-strong);
  font-weight: 800;
}
.story-jump strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.story-jump small { color: var(--muted); font-size: 11px; }
.story-reader-page {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
}
.story-point-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 24px 26px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--panel));
}
.story-point-head h2 { margin: 8px 0 5px; font-family: Georgia, "Times New Roman", serif; font-size: 30px; line-height: 1.15; }
.story-point-head p { max-width: 760px; margin: 0; color: var(--muted); }
.story-point-number { margin-right: 8px; color: var(--accent-strong); font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
.viz-badge {
  display: inline-flex;
  align-items: center;
  min-height: 25px;
  border-radius: 999px;
  background: var(--accent-soft);
  padding: 3px 9px;
  color: var(--accent-strong);
  font-size: 11px;
  font-weight: 750;
}
.story-point-stats { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
.story-point-stats span { white-space: nowrap; border: 1px solid var(--border); border-radius: 999px; background: var(--panel-strong); padding: 5px 9px; color: var(--muted); font-size: 12px; }
.rp-reading-list { display: grid; gap: 14px; padding: 24px 26px; }
.rp-post {
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 13px;
  background: var(--panel-strong);
  padding: 15px 17px 17px;
}
.rp-post-action { border-left-color: var(--success); }
.rp-post-narration { border-left-color: var(--warning); background: color-mix(in srgb, var(--panel-strong) 84%, var(--accent-soft)); }
.rp-post-ooc { border-left-style: dashed; border-left-color: var(--muted); }
.rp-post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.rp-avatar {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 850;
}
.rp-avatar:disabled { cursor: default; opacity: 1; }
.rp-speaker { font-weight: 800; }
.rp-post-meta { color: var(--muted); font-size: 12px; }
.rp-post-body { font-family: Georgia, "Times New Roman", serif; font-size: 17px; line-height: 1.7; white-space: normal; }
.rp-empty-copy { color: var(--muted); font-style: italic; }
.rp-empty { padding: 52px 24px; text-align: center; }
.rp-empty h3 { margin: 0 0 8px; font-family: Georgia, "Times New Roman", serif; font-size: 24px; }
.rp-empty p { max-width: 640px; margin: 0 auto 18px; color: var(--muted); }
.story-point-editor { display: grid; gap: 18px; padding: 24px 26px; }
.story-point-fields { display: grid; grid-template-columns: minmax(0,.8fr) minmax(0,1.2fr); gap: 12px; }
.story-point-fields label, .rp-editor label, .rp-custom-speaker { display: grid; gap: 6px; }
.story-point-fields label > span, .rp-editor label > span, .rp-custom-speaker > span { color: var(--muted); font-size: 12px; font-weight: 750; }
.rp-editor-list { display: grid; gap: 12px; }
.rp-editor { border: 1px solid var(--border); border-radius: 14px; background: var(--panel-strong); padding: 14px; }
.rp-editor-toolbar { display: grid; grid-template-columns: minmax(150px,1fr) minmax(130px,.7fr) auto; align-items: end; gap: 10px; margin-bottom: 10px; }
.rp-editor-actions { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
.rp-custom-speaker { margin-bottom: 10px; }
.rp-editor-text textarea { min-height: 170px; line-height: 1.55; }
.story-reader-nav { display: flex; justify-content: space-between; gap: 12px; padding: 18px 26px; border-top: 1px solid var(--border); background: var(--panel-soft); }
.graph-inspector-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.story-content-mark { pointer-events: none; fill: var(--panel-strong); font-size: 10px; font-weight: 900; paint-order: stroke; stroke: var(--text); stroke-width: 2px; }
button:disabled { cursor: not-allowed; opacity: .48; }

@media (max-width: 760px) {
  .story-jump-heading { display: block; }
  .story-jump-heading p { margin-top: 4px; }
  .story-jump-list { grid-template-columns: 1fr 1fr; }
  .story-point-head { display: block; padding: 20px 18px; }
  .story-point-head h2 { font-size: 26px; }
  .story-point-stats { justify-content: flex-start; margin-top: 14px; }
  .rp-reading-list, .story-point-editor { padding: 18px; }
  .story-point-fields { grid-template-columns: 1fr; }
  .rp-editor-toolbar { grid-template-columns: 1fr; }
  .rp-editor-actions { justify-content: flex-start; }
  .story-reader-nav { padding: 14px 18px; }
}

@media (max-width: 440px) {
  .story-jump-list { grid-template-columns: 1fr; }
  .story-reader-nav { display: grid; grid-template-columns: 1fr; }
  .story-reader-nav .button { width: 100%; }
}



/* Continuous RP sheet and story-point bookmarks */
.story-anchor-callout {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  border: 1px solid var(--accent);
  border-radius: 12px;
  background: var(--accent-soft);
  padding: 12px 14px;
}
.story-anchor-callout strong { color: var(--accent-strong); }
.story-anchor-callout span { color: var(--muted); }
.story-point-fields-anchor { grid-template-columns: minmax(0,.75fr) minmax(0,1.15fr) minmax(220px,.9fr); }
.story-point-anchor-control small { color: var(--muted); font-size: 11px; line-height: 1.4; }
.story-anchor-status { margin-top: 9px !important; color: var(--accent-strong) !important; font-size: 13px; font-weight: 750; }
.rp-story-anchor {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  scroll-margin-top: 92px;
  padding: 4px 0 0;
}
.rp-story-anchor button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--panel-soft);
  padding: 6px 10px;
  color: var(--text);
  text-align: left;
}
.rp-story-anchor button:hover, .rp-story-anchor.active button { border-color: var(--accent); background: var(--accent-soft); }
.rp-story-anchor span { color: var(--accent-strong); font-size: 11px; font-weight: 850; text-transform: uppercase; }
.rp-story-anchor strong { font-size: 12px; }
.rp-post[data-rp-turn-id], .rp-editor[data-story-turn-card] { scroll-margin-top: 92px; }
.rp-post-selected-section { background: color-mix(in srgb, var(--panel-strong) 88%, var(--accent-soft)); }
.rp-post-selected-start { box-shadow: inset 0 0 0 2px var(--accent); }
.rp-editor-selected-anchor { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.rp-editor-anchor-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.rp-editor-anchor-list span { border-radius: 999px; background: var(--accent-soft); padding: 4px 8px; color: var(--accent-strong); font-size: 11px; font-weight: 750; }
.rp-anchor-flash { animation: rpAnchorFlash 1.2s ease; }
@keyframes rpAnchorFlash { 0%,35% { outline: 3px solid color-mix(in srgb, var(--accent) 65%, transparent); outline-offset: 4px; } 100% { outline-color: transparent; outline-offset: 9px; } }
.story-popup-anchor { color: var(--accent-strong) !important; font-size: 13px; }
.rp-popup-more { margin: 10px 0 0; color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 920px) {
  .story-point-fields-anchor { grid-template-columns: 1fr; }
}

/* Working links inside the imported World Overview */
.world-quick-link-row { max-width: 720px; }
.world-quick-link {

/* Character image layout editor */
.block-toolbar-help { margin-left: auto; align-self: center; color: var(--muted); font-size: 11px; }

.character-block-list {

.character-image-block {

.character-image-block.image-layout-wrap-right {
  float: right;

}
.character-image-block.image-layout-center {
  clear: both;

}
.character-image-block.image-layout-behind {

.character-image-block img {

}
.image-move-handle,
.image-resize-handle {
  position: absolute;
  z-index: 5;

  place-items: center;
  width: 31px;
  height: 31px;
  border: 1px solid var(--border);

.image-layout-controls {

.character-image-block:hover .image-layout-controls,

.image-layout-controls label { display: grid; gap: 4px; min-width: 0; }
.image-layout-controls label > span { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 10px; font-weight: 750; }

.image-editor-modal { display: grid; grid-template-columns: minmax(180px, .7fr) minmax(260px, 1.3fr); gap: 18px; align-items: start; }
.image-editor-preview { min-height: 220px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 14px; background: var(--panel-soft); padding: 12px; }

.image-editor-help { grid-column: 1 / -1; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 10px 12px; color: var(--muted); font-size: 12px; }
.button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }

/* Story point popup that reads like a bookmark, not a technical report */

@media (max-width: 760px) {

/* Free-form character image canvas */
.character-block-list {
  position: relative;
  display: block;
  min-height: 300px;
  isolation: isolate;
}
.character-block-list::after {
  content: "";
  display: block;
  clear: both;
}
.character-block-list > .block-row {
  position: relative;
  z-index: 2;
  margin-bottom: 5px;
}
.character-image-block {
  --image-width: 300px;
  --image-gap: 18px;
  --image-opacity: 1;
  --image-y: 0px;
  width: min(var(--image-width), calc(100% - 8px));
  max-width: calc(100% - 8px);
  border: 1px solid transparent;
  border-radius: 13px;
  background: transparent;
  box-shadow: none;
  user-select: none;
  touch-action: none;
}
.character-image-block.image-layout-wrap {
  position: relative;
  z-index: 3;
  margin-top: var(--image-y);
  margin-bottom: var(--image-gap);
}
.character-image-block.image-layout-wrap.image-wrap-left {
  float: left;
  clear: left;
  margin-right: var(--image-gap);
  margin-left: 0;
}
.character-image-block.image-layout-wrap.image-wrap-right {
  float: right;
  clear: right;
  margin-right: 0;
  margin-left: var(--image-gap);
}
.character-image-block.image-layout-front,
.character-image-block.image-layout-behind {
  position: absolute;
  margin: 0;
}
.character-image-block.image-layout-front { z-index: 7; }
.character-image-block.image-layout-behind { z-index: 0; }
.character-image-block img {
  display: block;
  width: 100%;
  height: auto;
  max-height: none;
  border-radius: 12px;
  object-fit: contain;
  opacity: var(--image-opacity);
  pointer-events: auto !important;
  cursor: pointer;
  touch-action: none;
}
.character-image-block.image-layout-behind img { pointer-events: auto !important; }
.character-image-block.is-selected {
  outline: 2px solid color-mix(in srgb, var(--accent) 78%, transparent);
  outline-offset: 3px;
}
.character-image-block.is-editing {
  z-index: 12;
  outline: 2px dashed var(--accent);
  outline-offset: 4px;
}
.character-image-block.is-editing img { cursor: move; }
.image-selection-edit,
.image-edit-toolbar,
.image-resize-dot { display: none; }
.character-image-block.is-selected:not(.is-editing) .image-selection-edit {
  position: absolute;
  z-index: 16;
  top: 8px;
  right: 8px;
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: color-mix(in srgb, var(--panel-strong) 95%, transparent);
  padding: 7px 13px;
  color: var(--accent-strong);
  box-shadow: 0 6px 18px rgba(35, 28, 21, .18);
  font-size: 12px;
  font-weight: 800;
}
.character-image-block.is-editing .image-edit-toolbar {
  position: absolute;
  z-index: 18;
  left: 8px;
  top: 8px;
  display: flex;
  align-items: end;
  flex-wrap: wrap;
  gap: 7px;
  max-width: calc(100% - 16px);
  border: 1px solid var(--border);
  border-radius: 11px;
  background: color-mix(in srgb, var(--panel-strong) 96%, transparent);
  padding: 8px;
  box-shadow: 0 8px 22px rgba(35, 28, 21, .2);
  pointer-events: auto;
}
.image-edit-toolbar label { display: grid; gap: 3px; min-width: min(210px, 100%); }
.image-edit-toolbar label span { color: var(--muted); font-size: 10px; font-weight: 800; }
.image-edit-toolbar select,
.image-edit-toolbar button {
  min-height: 32px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-strong);

}

  height: 22px;
  border: 3px solid var(--panel-strong);

.character-image-block.is-arranging,

@media (max-width: 760px) {

/* Collapsible location branches without a vertical trunk */
.location-tree-list,
.location-tree-children {
  list-style: none;
  margin: 0;
  padding: 0;
}
.location-tree-list { display: grid; gap: 8px; }
.location-tree-node { position: relative; min-width: 0; }
.location-tree-row {
  display: grid;
  grid-template-columns: 30px minmax(0,1fr) auto;
  align-items: center;
  gap: 7px;
}
.location-tree-toggle,
.location-tree-toggle-spacer {
  width: 30px;
  height: 30px;
}
.location-tree-toggle {
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel-strong);
  color: var(--accent-strong);
  font-weight: 900;
}

.location-tree-main {
  min-width: 0;

  align-items: baseline;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel-strong);
  padding: 9px 11px;
  text-align: left;
}
.location-tree-main:hover { border-color: var(--accent); background: var(--accent-soft); }
.location-tree-main strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.location-tree-main span { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
.location-tree-count {
  min-width: 25px;

@media (max-width: 520px) {

  .location-tree-main { display: grid; gap: 2px; }

.character-image-block.image-layout-front,

/* === World section templates and matching color families === */
.section-themed-shell {
  --section-paper:#f5efe4;
  --section-paper-2:#fffaf2;
  --section-panel:#fff8ed;
  --section-ink:#2d261f;
  --section-muted:#756958;
  --section-line:#d7c6aa;
  --section-accent:#9a7442;
  --section-chip:#efe3d1;
  --bg:var(--section-paper);
  --panel:var(--section-panel);
  --panel-strong:var(--section-paper-2);
  --panel-soft:color-mix(in srgb,var(--section-panel) 86%,var(--section-paper));
  --text:var(--section-ink);
  --muted:var(--section-muted);
  --border:var(--section-line);
  --line:var(--section-line);
  --accent:var(--section-accent);
  --accent-strong:color-mix(in srgb,var(--section-accent) 82%,var(--section-ink));
  --accent-soft:color-mix(in srgb,var(--section-accent) 15%,var(--section-panel));
  --accent-text:var(--section-paper-2);
  --success:color-mix(in srgb,var(--section-accent) 68%,#4e9472);
  --warning:color-mix(in srgb,var(--section-accent) 68%,#b57a3e);
  --danger:color-mix(in srgb,var(--section-accent) 52%,#b55353);
  min-height:calc(100vh - 118px);
  margin:-4px;
  border:1px solid var(--section-line);
  border-radius:22px;
  background:
    radial-gradient(circle at 90% 2%,color-mix(in srgb,var(--section-accent) 12%,transparent),transparent 28%),
    linear-gradient(145deg,var(--section-paper-2),var(--section-paper));
  color:var(--section-ink);
  padding:20px;
  box-shadow:0 18px 50px color-mix(in srgb,var(--section-ink) 7%,transparent);
}
.section-themed-shell .page-head { margin-bottom:18px; }
.section-themed-shell .page-kicker { color:var(--section-accent); }
.section-themed-shell .page-subtitle { color:var(--section-muted); }
.section-design-toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
  border:1px solid var(--section-line);
  border-radius:15px;
  background:color-mix(in srgb,var(--section-panel) 92%,transparent);
  padding:10px 12px;
  backdrop-filter:blur(9px);
}
.section-design-heading { display:flex; align-items:center; gap:10px; min-width:0; }
.section-design-icon {
  width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--section-line);
  border-radius:12px;background:var(--section-chip);color:var(--section-accent);font-size:19px;
}
.section-design-copy { min-width:0; display:grid; gap:1px; }
.section-design-copy span { color:var(--section-muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800; }
.section-design-copy strong { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.section-design-actions { display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end; }
.section-themed-shell .button { border-color:var(--section-line); }
.section-themed-shell .button.secondary,
.section-themed-shell .button.ghost { background:var(--section-panel);color:var(--section-ink); }
.section-themed-shell .segmented { border-color:var(--section-line);background:var(--section-panel); }
.section-themed-shell .segmented button { color:var(--section-muted); }
.section-themed-shell .segmented button.active { background:var(--section-accent);color:var(--section-paper-2); }
.section-themed-shell .input,.section-themed-shell .select,.section-themed-shell .textarea {
  border-color:var(--section-line);background:var(--section-panel);color:var(--section-ink);
}
.section-themed-shell .panel,.section-themed-shell .table-wrap,.section-themed-shell .properties-panel,
.section-themed-shell .editor-surface,.section-themed-shell .graph-filter-panel,.section-themed-shell .graph-reading-guide,
.section-themed-shell .graph-inspector { background:var(--section-panel);border-color:var(--section-line);color:var(--section-ink); }
.section-themed-shell .tag,.section-themed-shell .link-pill { background:var(--section-chip);border-color:var(--section-line);color:var(--section-ink); }
.section-themed-shell table th { color:var(--section-muted);background:color-mix(in srgb,var(--section-chip) 78%,var(--section-panel)); }
.section-themed-shell table td { border-color:var(--section-line); }
.section-themed-shell table tbody tr:hover { background:color-mix(in srgb,var(--section-accent) 9%,var(--section-panel)); }

.section-template-gallery { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px; }
.section-template-choice {
  display:grid;grid-template-rows:150px auto;border:1px solid var(--border);border-radius:15px;
  overflow:hidden;background:var(--panel);text-align:left;color:var(--text);
}
.section-template-choice:hover,.section-template-choice.is-active { border-color:var(--accent);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 14%,transparent); }
.section-template-preview { position:relative;overflow:hidden;background:var(--panel-soft);padding:14px; }
.section-template-preview::before { content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,transparent),transparent 55%); }
.section-template-preview .preview-line { position:relative;height:10px;border-radius:999px;background:color-mix(in srgb,var(--text) 16%,transparent);margin-bottom:9px; }
.section-template-preview .preview-card { position:relative;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--panel);margin-top:9px; }
.section-template-preview.preview-tree .preview-card:nth-child(3) { margin-left:25px;width:82%; }
.section-template-preview.preview-board { display:grid;grid-template-columns:repeat(3,1fr);gap:7px; }
.section-template-preview.preview-board .preview-card { height:105px;margin:0; }
.section-template-preview.preview-timeline::after { content:"";position:absolute;left:38px;top:20px;bottom:20px;width:2px;background:var(--accent); }
.section-template-preview.preview-timeline .preview-card { margin-left:45px;height:26px; }
.section-template-preview.preview-graph::after { content:"●  ───  ●\A  ╲       ╱\A    ●──●";white-space:pre;position:absolute;inset:30px;text-align:center;color:var(--accent);font-size:24px;line-height:1.7; }
.section-template-body { padding:13px; }
.section-template-body h3 { margin:0 0 5px; }
.section-template-body p { color:var(--muted);font-size:12px;min-height:47px; }

.section-theme-gallery { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
.section-theme-card {
  display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:12px;width:100%;
  border:1px solid var(--border);border-radius:13px;background:var(--panel);padding:10px;text-align:left;color:var(--text);
}
.section-theme-card:hover,.section-theme-card.is-active { border-color:var(--accent);background:var(--accent-soft); }
.section-theme-swatches { display:flex;height:43px;overflow:hidden;border:1px solid var(--border);border-radius:9px; }
.section-theme-swatches i { flex:1; }
.section-theme-card-copy { display:grid;gap:2px; }
.section-theme-card-copy small { color:var(--muted); }
.section-custom-theme { margin-top:16px;border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:15px; }
.section-custom-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:13px 0; }
.section-custom-grid label { display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:800; }
.section-custom-grid input { width:100%;height:42px;border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:3px; }

/* Location templates */
.section-kind-locations.template-atlas-registry .entity-card,
.location-atlas-card {
  position:relative;overflow:hidden;border-color:var(--section-line);background:
    linear-gradient(90deg,color-mix(in srgb,var(--section-line) 28%,transparent) 1px,transparent 1px),
    linear-gradient(color-mix(in srgb,var(--section-line) 28%,transparent) 1px,transparent 1px),
    var(--section-panel);background-size:24px 24px;
}
.location-atlas-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px; }
.location-atlas-card { border:1px solid var(--section-line);border-radius:15px;padding:16px;color:var(--section-ink);cursor:pointer;text-align:left; }
.location-atlas-card:hover { border-color:var(--section-accent);transform:translateY(-2px); }
.location-atlas-header { display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px; }
.location-atlas-symbol { width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--section-accent);background:var(--section-chip);color:var(--section-accent);font-size:22px; }
.location-atlas-card h3 { font-family:Georgia,serif;font-size:22px;margin:0; }
.location-atlas-type { color:var(--section-muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em; }
.location-atlas-route { margin-top:13px;border-top:1px dashed var(--section-line);padding-top:10px;color:var(--section-muted);font-size:12px; }
.location-journal-list { display:grid;gap:15px; }
.location-journal-card { display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;border:1px solid var(--section-line);border-radius:18px;background:var(--section-panel);padding:16px;color:var(--section-ink);text-align:left;cursor:pointer; }
.location-journal-card:hover { border-color:var(--section-accent); }
.location-journal-number { display:grid;place-items:center;min-height:110px;border-radius:13px;background:var(--section-chip);font-family:Georgia,serif;font-size:38px;color:var(--section-accent); }
.location-journal-copy h3 { font-family:Georgia,serif;font-size:25px;margin:0 0 7px; }
.location-journal-copy p { color:var(--section-muted);line-height:1.65; }
.template-hierarchy-survey .location-tree-main { border-radius:999px;background:var(--section-panel); }
.template-hierarchy-survey .location-tree-toggle { background:var(--section-accent); }

/* Faction templates */
.faction-heraldic-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px; }
.faction-heraldic-card { border:1px solid var(--section-line);border-radius:17px;background:var(--section-panel);overflow:hidden;color:var(--section-ink);cursor:pointer;text-align:left; }
.faction-heraldic-banner { min-height:100px;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--section-accent) 22%,transparent),transparent 45%),var(--section-paper-2);border-bottom:1px solid var(--section-line); }
.faction-crest { width:66px;height:78px;clip-path:polygon(50% 0,92% 17%,86% 73%,50% 100%,14% 73%,8% 17%);display:grid;place-items:center;background:var(--section-accent);color:var(--section-paper-2);font-family:Georgia,serif;font-size:23px; }

.faction-heraldic-body h3 { font-family:Georgia,serif;font-size:22px;margin:0 0 5px; }

.faction-influence-column { border:1px solid var(--section-line);border-radius:15px;background:color-mix(in srgb,var(--section-panel) 88%,transparent);padding:11px; }
.faction-influence-column h3 { display:flex;justify-content:space-between;gap:8px;color:var(--section-accent);text-transform:uppercase;font-size:12px;letter-spacing:.07em; }
.faction-influence-card { width:100%;border:1px solid var(--section-line);border-radius:11px;background:var(--section-panel);padding:12px;margin-top:9px;text-align:left;color:var(--section-ink); }
.faction-influence-card strong { display:block;margin-bottom:4px; }
.faction-intel-list { display:grid;gap:11px; }
.faction-intel-card { display:grid;grid-template-columns:70px minmax(0,1fr) auto;align-items:center;gap:13px;border:1px solid var(--section-line);border-radius:12px;background:var(--section-panel);padding:12px;color:var(--section-ink);text-align:left;cursor:pointer; }
.faction-intel-code { font-family:ui-monospace,monospace;color:var(--section-accent);font-weight:900; }

/* Timeline templates */
.section-kind-events.template-chronicle-scroll .timeline::before { width:3px;background:linear-gradient(var(--section-accent),var(--section-line)); }
.section-kind-events.template-chronicle-scroll .timeline-card { border-radius:3px 15px 15px 3px;box-shadow:inset 5px 0 0 var(--section-accent); }
.timeline-era-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px; }
.timeline-era-card { border:1px solid var(--section-line);border-radius:16px;background:var(--section-panel);padding:15px;color:var(--section-ink);cursor:pointer;text-align:left; }
.timeline-era-card:hover { border-color:var(--section-accent); }
.timeline-era-date { display:inline-flex;border-radius:999px;background:var(--section-chip);padding:5px 9px;color:var(--section-accent);font-size:11px;font-weight:850; }
.timeline-era-card h3 { font-family:Georgia,serif;font-size:21px;margin:11px 0 7px; }
.timeline-archive-list { display:grid;gap:8px; }
.timeline-archive-row { display:grid;grid-template-columns:115px minmax(0,1fr) 110px;gap:12px;align-items:center;border:1px solid var(--section-line);border-radius:10px;background:var(--section-panel);padding:11px;color:var(--section-ink);cursor:pointer;text-align:left; }
.timeline-archive-row:hover { border-color:var(--section-accent); }
.timeline-archive-date { font-family:ui-monospace,monospace;color:var(--section-accent);font-weight:800; }

/* Entity covers for themed sections */
.section-entity-cover { min-height:176px;display:grid;place-items:center;border-bottom:1px solid var(--section-line);background:
  radial-gradient(circle at 70% 22%,color-mix(in srgb,var(--section-accent) 18%,transparent),transparent 38%),
  linear-gradient(135deg,var(--section-paper-2),var(--section-chip));position:relative;overflow:hidden; }
.section-entity-cover::before,.section-entity-cover::after { content:"";position:absolute;border:1px solid color-mix(in srgb,var(--section-accent) 36%,transparent);border-radius:50%; }
.section-entity-cover::before { width:210px;height:210px;left:-70px;top:-85px; }
.section-entity-cover::after { width:150px;height:150px;right:-42px;bottom:-70px; }
.section-entity-mark { position:relative;z-index:1;display:grid;place-items:center;text-align:center;gap:7px; }
.section-entity-glyph { width:72px;height:72px;display:grid;place-items:center;border:1px solid var(--section-accent);border-radius:20px;background:var(--section-panel);color:var(--section-accent);font-size:31px;box-shadow:0 10px 25px color-mix(in srgb,var(--section-ink) 10%,transparent); }
.section-entity-mark strong { font-family:Georgia,serif;font-size:21px; }
.section-entity-mark span { color:var(--section-muted);font-size:12px; }
.template-travel-journal .section-entity-cover { background:linear-gradient(115deg,var(--section-paper-2),var(--section-chip)); }
.template-heraldic-registry .section-entity-glyph { clip-path:polygon(50% 0,92% 17%,86% 73%,50% 100%,14% 73%,8% 17%);border-radius:0;background:var(--section-accent);color:var(--section-paper-2); }
.template-chronicle-scroll .section-entity-glyph { border-radius:50%; }

/* Graph templates */
.section-kind-graph .graph-stage { border-color:var(--section-line);background-color:var(--section-panel); }
.section-kind-graph.template-constellation-map .graph-stage {
  background:
    radial-gradient(circle at 13% 18%,var(--section-accent) 0 1px,transparent 2px),
    radial-gradient(circle at 73% 34%,var(--section-accent) 0 1px,transparent 2px),
    radial-gradient(circle at 42% 72%,var(--section-accent) 0 1px,transparent 2px),
    radial-gradient(circle at 88% 81%,var(--section-accent) 0 1px,transparent 2px),
    linear-gradient(155deg,var(--section-paper),var(--section-paper-2));
  background-size:190px 170px,230px 210px,280px 250px,330px 300px,auto;
}
.section-kind-graph.template-constellation-map .graph-node,.section-kind-graph.template-constellation-map .story-node-circle { filter:drop-shadow(0 0 8px color-mix(in srgb,var(--section-accent) 42%,transparent));stroke:var(--section-paper-2);stroke-width:2.5px; }
.section-kind-graph.template-tactical-blueprint .graph-stage {
  background:
    linear-gradient(color-mix(in srgb,var(--section-accent) 14%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--section-accent) 14%,transparent) 1px,transparent 1px),
    var(--section-paper-2);background-size:28px 28px;
}
.section-kind-graph.template-tactical-blueprint .graph-node,.section-kind-graph.template-tactical-blueprint .story-node-circle { stroke:var(--section-accent);stroke-width:4px;fill:var(--section-panel)!important; }
.section-kind-graph.template-tactical-blueprint .graph-node-glyph,.section-kind-graph.template-tactical-blueprint .story-step-number { fill:var(--section-accent); }
.section-kind-graph.template-story-threads .graph-stage { background:linear-gradient(135deg,var(--section-paper-2),var(--section-chip)); }
.section-kind-graph.template-story-threads .graph-link,.section-kind-graph.template-story-threads .story-link { stroke-width:3px; }
.section-kind-graph.template-story-threads .graph-node,.section-kind-graph.template-story-threads .story-node-circle { stroke:var(--section-paper-2);stroke-width:4px;filter:drop-shadow(0 5px 8px color-mix(in srgb,var(--section-ink) 18%,transparent)); }
.section-kind-graph .graph-edge-label,.section-kind-graph .graph-node-label,.section-kind-graph .graph-group-label,.section-kind-graph .story-role-label { fill:var(--section-ink); }
.section-kind-graph .graph-node-glyph,.section-kind-graph .story-step-number { fill:var(--section-paper-2); }
.section-kind-graph .graph-link,.section-kind-graph .story-link { stroke:var(--section-accent); }
.section-kind-graph .graph-key-line { border-color:var(--section-accent); }

/* Personalized faction badges */
.faction-heraldic-banner{position:relative}

.faction-badge::before{content:"";position:absolute;inset:7px;border:1px solid color-mix(in srgb,var(--badge-accent) 58%,transparent)}

  const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const cleanNotionRefs = value => String(value ?? '')
    .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
    .replace(/\s*\((?:\.\.\/|\.\/|World%20Codex\/)[^\n]*?\.md\)/gi, '')
    .replace(/\s*\((?=[^\s()]*%[0-9A-Fa-f]{2})[^\n]*?\.md\)/g, '')
    .replace(/\s+([,.;:!?])/g, '$1')

  const renderInlineMarkdown = value => {
    let html = esc(cleanNotionRefs(value));
    html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');

  const editableToMarkdown = root => {
    const walk = node => {
      if (node.nodeType === Node.TEXT_NODE) return node.textContent || '';
      if (node.nodeType !== Node.ELEMENT_NODE) return '';
      const tag = node.tagName.toLowerCase();
      const inner = [...node.childNodes].map(walk).join('');
      if (tag === 'strong' || tag === 'b') return `**${inner}**`;
      if (tag === 'em' || tag === 'i') return `*${inner}*`;
      if (tag === 'code') return `\`${inner}\``;
      if (tag === 'br') return '\n';
      if (tag === 'div' || tag === 'p') return `${inner}\n`;
      return inner;
    };
    return [...root.childNodes].map(walk).join('').replace(/\n{3,}/g, '\n\n').replace(/\n+$/, '');

  const nowISO = () => new Date().toISOString();
  const fmtDate = value => {
    if (!value) return '';
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? value : new Intl.DateTimeFormat('en-US', {month:'short', day:'numeric', year:'numeric'}).format(d);
  };
  const fmtTime = value => {

  let state = loadState();

  let route = parseHash();
  let collectionView = { characters: 'gallery', locations: 'tree', species: 'gallery', factions: 'gallery', events: 'timeline' };

  let editingImageRef = '';
  let suppressImageClickUntil = 0;

  const el = {
