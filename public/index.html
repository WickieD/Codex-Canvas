  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (error) {
      console.warn('Could not load local data', error);
    }
    return deepClone(window.INITIAL_WORLD_DATA);
  }

  function normalizeState() {
    state.schemaVersion ||= VERSION;
    state.workspace ||= {};
    state.workspace.members ||= [];
    state.workspace.access ||= {};
    for (const member of state.workspace.members) {
      if (member.email) state.workspace.access[member.email.toLowerCase()] = member.role;
    }
    state.activity ||= [];
    // Earlier Codex Canvas builds used the Factions database for species and peoples.
    // Move that existing data into Species once, then start a separate Factions database.
    if (!Array.isArray(state.species)) {
      state.species = Array.isArray(state.factions) ? state.factions : [];
      state.factions = [];
    }
    for (const key of Object.keys(COLLECTIONS)) state[key] ||= [];
    for (const species of state.species) {
      species.prevalence ||= species.power || 'Unspecified';
      species.survivalGoal ||= species.goal || '';
      species.relations ||= species.alliesEnemies || '';
      species.keyMemberIds ||= [];
      species.notes ||= '';
      species.blocks ||= [];
    }
    for (const faction of state.factions) {
      faction.power ||= 'Minor';
      faction.goal ||= '';
      faction.alliesEnemies ||= '';
      faction.keyMemberIds ||= [];
      faction.notes ||= '';
      faction.badgeShape ||= 'shield';
      faction.badgeSymbol ||= 'wolf';
      faction.badgePrimary ||= '#1d2736';
      faction.badgeSecondary ||= '#c6a46a';
      faction.badgeAccent ||= '#f5ead3';
      faction.badgeText ||= initials(faction.name);
      faction.badgeMotto ||= '';
      faction.blocks ||= [];
    }
    state.storyGraphs ||= deepClone(window.INITIAL_WORLD_DATA.storyGraphs || []);
    if (!state.storyGraphs.length && window.INITIAL_WORLD_DATA.storyGraphs?.length) state.storyGraphs = deepClone(window.INITIAL_WORLD_DATA.storyGraphs);
    state.workspace.graphPositions ||= {};
    state.workspace.locationTreeExpanded ||= [];
    state.workspace.locationTreeInitialized ||= false;
    for (const character of state.characters) {
      if (typeof character.headerImage === 'string') character.headerImage = { src: character.headerImage };
      if (typeof character.profileImage === 'string') character.profileImage = { src: character.profileImage };
      character.headerImage ||= null;
      character.profileImage ||= null;
      character.dossierMainImage ||= null;
      character.dossierProfileImage ||= null;
      character.dossierDetailImage ||= null;
      character.pageTemplate ||= 'standard';
      character.speciesRace ||= '';
      character.alignment ||= '';
      character.occupation ||= character.role || '';
      character.tagline ||= '';
      character.backstory ||= '';
      character.strengths ||= '';
      character.weaknesses ||= '';
      character.skillsAbilities ||= '';
      character.traits ||= '';
      character.reputationCode ||= '';
      character.distinguishingFeatures ||= '';
      character.motivations ||= '';
      character.quote ||= '';
      character.tags ||= '';
      for (const mediaKey of ['headerImage','profileImage','dossierMainImage','dossierProfileImage','dossierDetailImage']) {
        const media = character[mediaKey];
        if (!media) continue;
        media.positionX = Math.max(0, Math.min(100, Number(media.positionX ?? 50)));
        media.positionY = Math.max(0, Math.min(100, Number(media.positionY ?? (['profileImage','dossierMainImage','dossierProfileImage','dossierDetailImage'].includes(mediaKey) ? 24 : 50))));
        media.zoom = Math.max(1, Math.min(3, Number(media.zoom ?? 1)));
        media.fit = media.fit === 'contain' ? 'contain' : 'cover';
      }
      character.blocks ||= [];
      for (const block of character.blocks) {
        if (block.type !== 'image') continue;
        block.id ||= id('image');
        block.src ||= '';
        block.alt ||= `${character.name || 'Character'} image`;
        const legacyLayout = block.layout || 'wrap-left';
        if (legacyLayout === 'wrap-left' || legacyLayout === 'wrap-right') {
          block.wrapSide ||= legacyLayout === 'wrap-right' ? 'right' : 'left';
          block.layout = 'wrap';
        } else if (legacyLayout === 'center') {
          block.layout = 'front';
        } else if (!['wrap','front','behind'].includes(legacyLayout)) {
          block.layout = 'wrap';
        }
        block.wrapSide = block.wrapSide === 'right' ? 'right' : 'left';
        block.width = Math.max(120, Number(block.width) || 300);
        block.padding = Math.max(0, Math.min(80, Number(block.padding) || 18));
        block.xPct = Math.max(0, Math.min(100, Number(block.xPct) || (block.wrapSide === 'right' ? 58 : 4)));
        block.y = Math.max(0, Number(block.y) || 24);
        block.opacity = Math.max(.15, Math.min(1, Number(block.opacity) || 1));
      }
    }
    for (const story of state.storyGraphs) {
      story.nodes ||= [];
      story.links ||= [];
      story.positions ||= {};
      const orderedNodes = story.nodes.slice().sort((a,b)=>(a.order || 0) - (b.order || 0));
      const hadSingleDocument = Array.isArray(story.rpTurns);
      if (!hadSingleDocument) story.rpTurns = [];
      for (const node of orderedNodes) {
        node.passage ||= { title: '', summary: '', anchorTurnId: '', turns: [] };
        node.passage.title ||= '';
        node.passage.summary ||= '';
        node.passage.anchorTurnId ||= '';
        const legacyTurns = Array.isArray(node.passage.turns) ? node.passage.turns : [];
        for (const turn of legacyTurns) normalizeStoryTurn(turn);
        if (!hadSingleDocument && legacyTurns.length) {
          if (!node.passage.anchorTurnId) node.passage.anchorTurnId = legacyTurns[0].id;
          story.rpTurns.push(...legacyTurns);
        }
        node.passage.turns = [];
      }
      for (const turn of story.rpTurns) normalizeStoryTurn(turn);
      const validTurnIds = new Set(story.rpTurns.map(turn => turn.id));
      for (const node of orderedNodes) {
        const passage = ensureStoryPassage(node);
        if (passage.anchorTurnId && passage.anchorTurnId !== '__start__' && !validTurnIds.has(passage.anchorTurnId)) passage.anchorTurnId = '';
      }
      if (orderedNodes.length && !ensureStoryPassage(orderedNodes[0]).anchorTurnId) ensureStoryPassage(orderedNodes[0]).anchorTurnId = '__start__';
    }
    normalizeLocationHierarchy();
    cleanNotionArtifacts(state);
    applyTheme();
  }

  function normalizeLocationHierarchy() {
    const locationIds = new Set(state.locations.map(location => location.id));
    for (const location of state.locations) {
      location.relatedLocationIds ||= [];
      if (isRegionType(location.type)) location.parentLocationId = '';
      if (location.parentLocationId && !locationIds.has(location.parentLocationId)) location.parentLocationId = '';
    }
    for (const location of state.locations) {
      const directChildren = new Set(state.locations.filter(child => child.parentLocationId === location.id).map(child => child.id));
      location.relatedLocationIds = [...new Set(location.relatedLocationIds)].filter(relatedId =>
        relatedId &&
        relatedId !== location.id &&
        relatedId !== location.parentLocationId &&
        !directChildren.has(relatedId) &&
        locationIds.has(relatedId)
      );
    }
  }

  function autoSizeEntityTitle(title) {
    if (!title) return;
    title.style.height = 'auto';
    title.style.height = `${Math.max(title.scrollHeight, 48)}px`;
  }


  function cleanNotionArtifacts(value, seen = new WeakSet()) {
    if (!value || typeof value !== 'object' || seen.has(value)) return value;
    seen.add(value);
    for (const [key, child] of Object.entries(value)) {
      if (typeof child === 'string') value[key] = cleanNotionRefs(child);
      else if (child && typeof child === 'object') cleanNotionArtifacts(child, seen);
    }
    return value;
  }

  function applyTheme() {
    const theme = state.workspace.theme || 'parchment';
    document.body.classList.remove('theme-slate','theme-moss','theme-ink');
    if (theme !== 'parchment') document.body.classList.add(`theme-${theme}`);
    if (state.workspace.accent) document.documentElement.style.setProperty('--accent', state.workspace.accent);
  }

  function scheduleSave(message = 'Saving…') {
    el.saveStatus.textContent = message;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 450);
  }

  async function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      el.saveStatus.textContent = firebase.connected ? 'Synced' : 'Saved locally';
    } catch (error) {
      el.saveStatus.textContent = 'Save failed';
      toast('Your browser could not save this workspace. Export a backup.', 'error');
      console.error(error);
    }
    if (firebase.connected && firebase.user && !firebase.applyingRemote) {
      try {
        await firebase.api.setDoc(firebase.api.worldRef, state, { merge: false });
        el.saveStatus.textContent = 'Synced';
      } catch (error) {
        el.saveStatus.textContent = 'Sync failed';
        console.error(error);
      }
    }
  }

  function logActivity(text) {
    state.activity.unshift({ id: id('activity'), text, at: nowISO(), by: firebase.user?.email || 'Signed-in account' });
    state.activity = state.activity.slice(0, 30);
  }

  function parseHash() {
    const raw = location.hash.replace(/^#\/?/, '');
    if (!raw) return { view: 'dashboard', id: '' };
    const [view, entityId = ''] = raw.split('/').map(decodeURIComponent);
    return { view, id: entityId };
  }

  function navigate(view, entityId = '') {
    const next = `#/${encodeURIComponent(view)}${entityId ? `/${encodeURIComponent(entityId)}` : ''}`;
    if (location.hash === next) {
      route = { view, id: entityId };
      render();
    } else {
      location.hash = next;
    }
    document.body.classList.remove('sidebar-open');
  }

  function collectionForView(view) {
    if (view === 'timeline') return 'events';
    return COLLECTIONS[view] ? view : null;
  }

  function getItem(kind, itemId) {
    return state[kind]?.find(item => item.id === itemId) || null;
  }

  function getAnyItem(itemId) {
    for (const kind of Object.keys(COLLECTIONS)) {
      const item = getItem(kind, itemId);
      if (item) return { kind, item };
    }
    return null;
  }

  function navButton(view, label, icon, count = '') {
    const active = route.view === view || (view === 'events' && route.view === 'timeline');
    return `<button class="nav-item ${active ? 'active' : ''}" type="button" data-nav="${esc(view)}" aria-label="Open ${esc(label)}">
      <span class="nav-icon">${uiIcon(icon)}</span><span>${esc(label)}</span>${count !== '' ? `<span class="nav-count">${count}</span>` : ''}
    </button>`;
  }

  function renderSidebar() {
    const roots = state.locations.filter(x => !x.parentLocationId || !getItem('locations', x.parentLocationId));
    const expandedLocations = new Set(state.workspace.locationTreeExpanded || []);
    const renderMiniLocationNode = (item, seen = new Set()) => {
      if (seen.has(item.id)) return '';
      const nextSeen = new Set(seen); nextSeen.add(item.id);
      const children = childrenOf(item.id).filter(child => !nextSeen.has(child.id));
      const open = children.length && expandedLocations.has(item.id);
      return `<div class="sidebar-tree-node${open ? ' is-open' : ''}">
        <div class="sidebar-tree-card">
          <button class="tree-link" type="button" data-open="locations:${item.id}"><span>${esc(item.name)}</span><small>${esc(item.type || 'Location')}</small></button>
          ${children.length ? `<button class="sidebar-tree-toggle" type="button" data-location-tree-toggle="${item.id}" data-tree-surface="sidebar" aria-expanded="${open}" aria-label="${open ? 'Collapse' : 'Expand'} locations inside ${esc(item.name)}">${open ? '−' : '+'}</button>` : ''}
        </div>
        ${children.length ? `<div class="sidebar-tree-children" ${open ? '' : 'hidden'}>${children.map(child => renderMiniLocationNode(child, nextSeen)).join('')}</div>` : ''}
      </div>`;

    const treeHtml = roots.slice(0, 7).map(root => renderMiniLocationNode(root)).join('');

    el.sidebar.innerHTML = `

        <div class="nav-group">
          <div class="nav-label">Databases</div>
          ${navButton('characters','Characters','person',state.characters.length)}
          ${navButton('locations','Locations','location',state.locations.length)}
          ${navButton('species','Species','species',state.species.length)}
          ${navButton('factions','Factions','shield',state.factions.length)}
          ${navButton('timeline','Timeline','timeline',state.events.length)}
        </div>
        <div class="nav-group">
          <div class="nav-label">Location tree</div>
          <div class="location-mini-tree">${treeHtml || '<div class="tree-link">No locations yet</div>'}</div>
        </div>
        <div class="nav-group">

        <div class="sidebar-user"><span class="avatar">${initials(firebase.user?.email || 'Signed-in account')}</span><span class="user-copy"><span class="user-name">${esc(firebase.user?.email || 'Signed-in account')}</span><span class="user-mode">${firebase.connected ? 'Shared mode' : 'Local demo mode'}</span></span></div>
      </div>`;
  }

  function renderBreadcrumbs() {
    const crumbs = [{ label: state.workspace.name, view: 'dashboard' }];
    if (route.view === 'dashboard') {
      crumbs.push({label:'Home'});
    } else if (route.view === 'world') {
      crumbs.push({label:'World Overview'});
    } else if (route.view === 'graph') {
      crumbs.push({label:'Graphs'});
    } else if (route.view === 'story') {
      const context = storyPointContext(route.id);
      crumbs.push({label:'Story Reader', view:'story'});
      if (context.story) crumbs.push({label:context.story.name});
      if (context.node) crumbs.push({label:storyPointTitle(context.story, context.node)});
    } else if (route.view === 'share') {
      crumbs.push({label:'Members'});
    } else if (route.view === 'settings') {
      crumbs.push({label:'Settings'});
    } else if (route.view === 'search') {
      crumbs.push({label:'Search'});
    } else {
      const kind = collectionForView(route.view);
      if (kind) {
        crumbs.push({label:COLLECTIONS[kind].label, view: route.view});
        const item = route.id && getItem(kind, route.id);
        if (item) crumbs.push({label:item.name});
      }
    }
    el.breadcrumbs.innerHTML = crumbs.map((crumb, index) => `${index ? '<span class="crumb-separator">/</span>' : ''}${crumb.view ? `<button class="crumb crumb-button" type="button" data-nav="${crumb.view}">${esc(crumb.label)}</button>` : `<span class="crumb">${esc(crumb.label)}</span>`}`).join('');
  }

  function render() {
    renderSidebar();
    renderBreadcrumbs();
    const kind = collectionForView(route.view);
    if (kind && route.id) renderEntity(kind, route.id);
    else if (kind) renderCollection(kind);
    else if (route.view === 'world') renderWorld();
    else if (route.view === 'graph') renderGraphPage();
    else if (route.view === 'story') renderStoryReader();
    else if (route.view === 'share') renderShare();
    else if (route.view === 'settings') renderSettings();
    else if (route.view === 'search') renderSearch(el.search.value.trim());
    else renderDashboard();
    if (route.view === 'characters' && route.id) requestAnimationFrame(installCharacterImageInteractions);
    el.main.focus({ preventScroll: true });
  }

  function pageHead(kicker, title, subtitle, actions = '') {

          <div class="panel-body"><div class="quick-grid">
            ${quick('Characters','Manage profiles, relationships, status, and current location.','characters')}
            ${quick('Location hierarchy','Nest regions, districts, buildings, and rooms under true parents.','locations')}
            ${quick('Species','Track peoples, lineages, traits, and social tensions.','species')}

  function metric(label, value, detail) {

  function quick(title, copy, view) {

  function renderWorld() {
    el.main.innerHTML = `${pageHead('World bible',state.world.name,'The central overview imported from your Notion World Codex. Edit it using blocks just like any other page.', `<button class="button secondary" type="button" data-nav="graph">View world graph</button>`)}
      <div class="editor-surface">${renderBlockEditor('world', state.world.id, state.world.blocks, state.world.name)}</div>`;
  }

  function renderCollection(kind) {
    const meta = COLLECTIONS[kind];
    const filter = collectionFilters[kind].toLowerCase();
    const items = state[kind].filter(item => JSON.stringify(item).toLowerCase().includes(filter));
    const view = collectionView[kind];
    const subtitle = {
      characters:'People, roles, relationships, moods, locations, and story notes.',
      locations:'Regions and places with true parent-child structure and related-location links.',
      factions:'Organizations, species groups, power levels, goals, and alliances.',
      events:'World history and current story events tied to the people involved.'
    }[kind];
    const viewButtons = kind === 'locations'
      ? [['tree','Tree'],['gallery','Gallery'],['table','Table']]
      : kind === 'events' ? [['timeline','Timeline'],['table','Table']] : [['gallery','Gallery'],['table','Table']];
    el.main.innerHTML = `${pageHead('Database',meta.label,subtitle, `<button class="button" type="button" data-new="${kind}">New ${meta.singular.toLowerCase()}</button>`)}
      <div class="collection-toolbar">
        <div class="toolbar-left"><div class="segmented">${viewButtons.map(([v,l]) => `<button type="button" class="${view===v?'active':''}" data-collection-view="${kind}:${v}">${l}</button>`).join('')}</div><button class="button secondary small" type="button" data-graph-kind="${kind === 'events' ? 'world' : kind}">Graph view</button></div>
        <div class="toolbar-right"><input class="input toolbar-search" type="search" value="${esc(collectionFilters[kind])}" placeholder="Filter ${meta.label.toLowerCase()}" data-filter-kind="${kind}"></div>
      </div>
      ${items.length ? renderCollectionView(kind, items, view) : '<div class="panel empty-state">No matching items.</div>'}`;
  }

  function renderCollectionView(kind, items, view) {
    if (kind === 'locations' && view === 'tree') return renderLocationTree(items);
    if (kind === 'events' && view === 'timeline') return renderTimeline(items);
    if (view === 'table') return renderTable(kind, items);
    return `<div class="card-grid">${items.map(item => renderEntityCard(kind,item)).join('')}</div>`;
  }

  function renderEntityCard(kind, item) {
    const meta = cardMeta(kind,item);
    return `<button class="entity-card" type="button" data-open="${kind}:${item.id}"><span class="entity-card-cover"><span class="entity-card-monogram">${esc(initials(item.name))}</span></span><span class="entity-card-body"><span class="entity-card-title">${esc(item.name)}</span><span class="entity-card-meta">${esc(meta.meta)}</span><span class="entity-card-copy">${esc(shortText(meta.copy,160))}</span><span class="tag-row">${meta.tags.filter(Boolean).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span></span></button>`;
  }

  function cardMeta(kind,item) {
    if (kind === 'characters') return { meta:item.role || item.status || 'Character', copy:item.personality || item.notes, tags:[item.status,item.mood,locationNames(item.currentLocationIds)[0]] };
    if (kind === 'locations') return { meta:item.type || 'Location', copy:item.description || item.atmosphere, tags:[parentName(item), item.controlledBy, `${childrenOf(item.id).length} children`] };
    if (kind === 'factions') return { meta:item.power || 'Faction', copy:item.goal || item.notes, tags:[item.power] };
    return { meta:item.date || 'Timeline event', copy:item.description || item.notes, tags:[item.status, `${item.characterIds?.length || 0} people`] };
  }

  function renderTable(kind, items) {
    const headers = {
      characters:['Name','Role','Status','Current location','Mood'],
      locations:['Name','Type','Parent','Controlled by','Children'],
      factions:['Name','Power','Goal','Key members'],
      events:['Event','Date','Status','Involved people']
    }[kind];
    return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${items.map(item=>`<tr data-open="${kind}:${item.id}">${tableCells(kind,item)}</tr>`).join('')}</tbody></table></div>`;
  }

  function tableCells(kind,item) {
    if (kind === 'characters') return `<td class="cell-title">${esc(item.name)}</td><td>${esc(item.role)}</td><td>${esc(item.status)}</td><td>${esc(locationNames(item.currentLocationIds).join(', '))}</td><td>${esc(item.mood)}</td>`;
    if (kind === 'locations') return `<td class="cell-title">${esc(item.name)}</td><td>${esc(item.type)}</td><td>${esc(parentName(item))}</td><td>${esc(item.controlledBy)}</td><td>${childrenOf(item.id).length}</td>`;
    if (kind === 'factions') return `<td class="cell-title">${esc(item.name)}</td><td>${esc(item.power)}</td><td class="cell-muted">${esc(shortText(item.goal,100))}</td><td>${item.keyMemberIds?.length || 0}</td>`;
    return `<td class="cell-title">${esc(item.name)}</td><td>${esc(item.date)}</td><td>${esc(item.status)}</td><td>${item.characterIds?.length || 0}</td>`;
  }

  function childrenOf(locationId) { return state.locations.filter(x => x.parentLocationId === locationId); }
  function parentName(location) { return getItem('locations', location.parentLocationId)?.name || ''; }
  function locationNames(ids = []) { return ids.map(x=>getItem('locations',x)?.name).filter(Boolean); }

  function renderLocationTree(filteredItems = state.locations) {
    const allowed = new Set(filteredItems.map(x=>x.id));
    const filtering = Boolean((collectionFilters.locations || '').trim());
    const roots = state.locations.filter(x => !x.parentLocationId || !getItem('locations', x.parentLocationId));
    const expanded = new Set(state.workspace.locationTreeExpanded || []);
    const subtreeVisible = (item, seen = new Set()) => {
      if (seen.has(item.id)) return false;
      const nextSeen = new Set(seen); nextSeen.add(item.id);
      return allowed.has(item.id) || childrenOf(item.id).some(child => subtreeVisible(child, nextSeen));
    };
    const renderNode = (item, depth = 0, seen = new Set()) => {
      if (seen.has(item.id) || !subtreeVisible(item, seen)) return '';
      const nextSeen = new Set(seen); nextSeen.add(item.id);
      const children = childrenOf(item.id).filter(child => subtreeVisible(child, nextSeen));
      const open = Boolean(children.length && (expanded.has(item.id) || filtering));
      const childListId = `location-children-${item.id}`;
      return `<li class="location-tree-node${open ? ' is-open' : ''}" data-location-tree-node="${item.id}">
        <div class="location-tree-card">
          <button class="location-tree-main" type="button" data-open="locations:${item.id}">
            <span class="location-tree-name">${esc(item.name)}</span>
            <span class="location-tree-meta">${esc(item.type || 'Location')}${children.length ? ` · ${children.length} inside` : ''}</span>
          </button>
          ${children.length ? `<button class="location-tree-toggle" type="button" data-location-tree-toggle="${item.id}" data-tree-surface="collection" aria-expanded="${open}" aria-controls="${esc(childListId)}" aria-label="${open ? 'Collapse' : 'Expand'} locations inside ${esc(item.name)}">${open ? '−' : '+'}</button>` : ''}
        </div>
        ${children.length ? `<ul id="${esc(childListId)}" class="location-tree-children" ${open ? '' : 'hidden'}>${children.map(child=>renderNode(child,depth+1,nextSeen)).join('')}</ul>` : ''}
      </li>`;
    };
    return `<div class="panel panel-body"><div class="location-tree-actions"><button class="button ghost small" type="button" data-location-tree-action="expand">Expand all</button><button class="button ghost small" type="button" data-location-tree-action="collapse">Collapse all</button></div><ul class="location-tree-list">${roots.map(root=>renderNode(root)).join('') || '<li class="empty-state">No location hierarchy yet.</li>'}</ul></div>`;
  }

  function renderTimeline(items) {
    return `<div class="timeline">${items.map(event=>`<div class="timeline-item"><div class="timeline-date">${esc(event.date)}</div><div class="timeline-dot-wrap"><span class="timeline-dot"></span></div><div class="timeline-card" data-open="events:${event.id}"><div class="timeline-title">${esc(event.name)}</div><div class="timeline-copy">${esc(shortText(event.description || event.notes,180))}</div><div class="tag-row"><span class="tag">${esc(event.status || 'Unspecified')}</span>${event.characterIds?.length ? `<span class="tag">${event.characterIds.length} people</span>`:''}</div></div></div>`).join('')}</div>`;
  }

  function characterMediaStyle(media, slot) {
    const x = Math.max(0, Math.min(100, Number(media?.positionX ?? 50)));
    const y = Math.max(0, Math.min(100, Number(media?.positionY ?? characterMediaDefaultY(slot))));
    const zoom = Math.max(1, Math.min(3, Number(media?.zoom ?? 1)));
    const fit = media?.fit === 'contain' ? 'contain' : 'cover';
    return `object-position:${x}% ${y}%;transform:scale(${zoom});transform-origin:${x}% ${y}%;object-fit:${fit};`;
  }

  function renderCharacterCover(item) {
    const media = item.headerImage || null;
    const image = media?.src || '';
    return `<div class="entity-cover character-cover-slot ${image ? 'has-image' : ''}" data-character-media-select="header:${item.id}" data-character-media-drop="header:${item.id}" ${image ? `tabindex="0" role="button" aria-label="Select the cover image for ${esc(item.name)}"` : ''}>
      ${image ? `<img src="${esc(image)}" alt="${esc(media?.alt || `${item.name} cover image`)}" style="${characterMediaStyle(media,'header')}">` : ''}
      ${image ? `<button class="character-cover-upload has-image" type="button" data-character-media-edit="header:${item.id}"><span class="character-media-placeholder-title">Edit cover</span></button>` : `<button class="character-cover-upload" type="button" data-character-media-trigger="header:${item.id}"><span class="character-media-placeholder-title">Add a cover image</span><span class="character-media-placeholder-help">Use a wide image for the top of this character page</span></button>`}
      <input type="file" accept="image/*" hidden data-character-media-input="header:${item.id}">
    </div>`;
  }

  function renderCharacterPortrait(item) {
    const media = item.profileImage || null;
    const image = media?.src || '';
    return `<div class="character-portrait-slot ${image ? 'has-image' : ''}" data-character-media-select="profile:${item.id}" data-character-media-drop="profile:${item.id}" ${image ? `tabindex="0" role="button" aria-label="Select the portrait for ${esc(item.name)}"` : ''}>
      ${image ? `<img src="${esc(image)}" alt="${esc(media?.alt || `${item.name} portrait`)}" style="${characterMediaStyle(media,'profile')}">` : ''}
      ${image ? `<button class="character-portrait-upload has-image" type="button" data-character-media-edit="profile:${item.id}"><span class="character-media-placeholder-title">Edit portrait</span></button>` : `<button class="character-portrait-upload" type="button" data-character-media-trigger="profile:${item.id}"><span class="character-media-placeholder-title">Add portrait</span><span class="character-media-placeholder-help">Character image</span></button>`}
      <input type="file" accept="image/*" hidden data-character-media-input="profile:${item.id}">
    </div>`;
  }

    mainPortrait:'Main portrait', mainPortraitHelp:'Tall', profileView:'Profile view', profileViewHelp:'Square',
    detailView:'Detail view', detailViewHelp:'Flexible', currentPortrait:'Current portrait', currentPortraitHelp:'Compact',
    personality:'Personality', backstory:'Backstory', strengths:'Strengths', weaknesses:'Weaknesses',
    skillsAbilities:'Skills / Abilities', relationships:'Relationships', traits:'Traits', reputationCode:'Reputation / Code',
    distinguishingFeatures:'Distinguishing Features', motivations:'Motivations / Principles', notes:'Notes',
    quote:'Quote', tags:'Tags', currentDetails:'Current Details', additionalWriting:'Additional writing and freeform page elements'
  });

  const DOSSIER_LABEL_GROUPS = Object.freeze([
    {title:'Template and cover', keys:['templateName','coverTitle','coverHelp']},
    {title:'Quick facts', keys:['age','speciesRace','alignment','occupation']},
    {title:'Image slots', keys:['mainPortrait','mainPortraitHelp','profileView','profileViewHelp','detailView','detailViewHelp','currentPortrait','currentPortraitHelp']},
    {title:'Profile sections', keys:['personality','backstory','strengths','weaknesses','skillsAbilities','relationships','traits','reputationCode','distinguishingFeatures','motivations','notes','quote','tags','currentDetails','additionalWriting']}
  ]);

  const DOSSIER_THEMES = Object.freeze({
    'classic-parchment':{name:'Classic Parchment',paper:'#f5efe4',paper2:'#fffaf2',panel:'#fff8ed',ink:'#2d261f',muted:'#756958',line:'#d7c6aa',accent:'#9a7442',chip:'#efe3d1'},
    'gold-black':{name:'Gold & Black',paper:'#11100f',paper2:'#1b1916',panel:'#24211b',ink:'#f8edd5',muted:'#c3b18c',line:'#66502e',accent:'#d6aa52',chip:'#332a1c'},
    'red-gold':{name:'Red & Gold',paper:'#2a0f12',paper2:'#401417',panel:'#4a1b1e',ink:'#fff3dc',muted:'#d8bca6',line:'#9b5e35',accent:'#e0b55c',chip:'#632428'},
    'navy-ivory':{name:'Navy & Ivory',paper:'#e9e3d7',paper2:'#fffaf2',panel:'#f8f2e8',ink:'#19293d',muted:'#607084',line:'#b7a789',accent:'#b68b45',chip:'#e6ddcd'},
    'emerald-bronze':{name:'Emerald & Bronze',paper:'#0f221d',paper2:'#18332a',panel:'#203d33',ink:'#f1e9d4',muted:'#b4c6ba',line:'#6e6b4d',accent:'#c1904b',chip:'#2b493d'},

    'forest-stone':{name:'Forest & Stone',paper:'#17221a',paper2:'#253027',panel:'#303b31',ink:'#f0eee5',muted:'#bec4b8',line:'#66725f',accent:'#b59a67',chip:'#3b473b'}

  function characterTemplateName(value) {
    return value === 'practical-dossier' ? 'Practical Dossier' : 'Standard Profile';
  }

  function dossierLabels(item) {
    return {...DOSSIER_LABEL_DEFAULTS,...(item?.dossierLabels||{})};
  }
  function dossierLabel(item,key) {
    return dossierLabels(item)[key] || DOSSIER_LABEL_DEFAULTS[key] || key;
  }
  function dossierThemeName(item) {
    return item?.dossierTheme === 'custom' ? 'Custom' : (DOSSIER_THEMES[item?.dossierTheme||'classic-parchment']?.name || 'Classic Parchment');
  }
  function safeDossierColor(value,fallback) {
    return /^#[0-9a-f]{6}$/i.test(String(value||'')) ? String(value) : fallback;
  }
  function dossierThemePalette(item,requestedTheme) {
    const themeId=requestedTheme || item?.dossierTheme || 'classic-parchment';
    const base=DOSSIER_THEMES[themeId] || DOSSIER_THEMES['classic-parchment'];
    if(themeId!=='custom') return {...base};
    const custom=item?.dossierCustomTheme||{};
    const fallback=DOSSIER_THEMES['classic-parchment'];
    return {
      name:'Custom',
      paper:safeDossierColor(custom.paper,fallback.paper), paper2:safeDossierColor(custom.paper2,fallback.paper2),
      panel:safeDossierColor(custom.panel,fallback.panel), ink:safeDossierColor(custom.ink,fallback.ink),
      muted:safeDossierColor(custom.muted,fallback.muted), line:safeDossierColor(custom.line,fallback.line),
      accent:safeDossierColor(custom.accent,fallback.accent), chip:safeDossierColor(custom.chip,fallback.chip)
    };
  }
  function dossierThemeStyle(item) {
    const theme=dossierThemePalette(item);
    return `--dossier-paper:${theme.paper};--dossier-paper-2:${theme.paper2};--dossier-panel:${theme.panel};--dossier-ink:${theme.ink};--dossier-muted:${theme.muted};--dossier-line:${theme.line};--dossier-gold:${theme.accent};--dossier-chip:${theme.chip};`;
  }

  function renderCharacterTemplateToolbar(item) {
    return `<div class="character-template-toolbar">
      <div class="character-template-label"><span>Character template</span><strong>${esc(characterTemplateName(item.pageTemplate))}</strong></div>
      <button class="button secondary small" type="button" data-character-template-picker="${item.id}">Change template</button>
    </div>`;
  }

  function showCharacterTemplatePicker(characterId) {
    const item = getItem('characters', characterId);
    if (!item) return;
    const active = item.pageTemplate || 'standard';
    showModal('Choose a character template', `<div class="template-gallery">
      <article class="template-choice ${active === 'standard' ? 'is-active' : ''}">
        <div class="template-choice-preview standard"><div class="mini-cover"></div><div class="mini-card"></div></div>
        <div class="template-choice-body"><h3>Standard Profile</h3><p>The flexible page you already use, with a cover, compact portrait, properties, and the freeform writing canvas.</p><button class="button ${active === 'standard' ? 'secondary' : ''}" type="button" data-character-template-apply="standard:${characterId}">${active === 'standard' ? 'Currently applied' : 'Use Standard Profile'}</button></div>
      </article>
      <article class="template-choice ${active === 'practical-dossier' ? 'is-active' : ''}">
        <div class="template-choice-preview dossier"><div class="mini-cover"></div><div class="mini-card"></div><div class="mini-card"></div><div class="mini-card"></div></div>
        <div class="template-choice-body"><h3>Practical Dossier</h3><p>A wide reference sheet with a cover, four image slots, editable labels, practical stat cards, structured profile sections, and multiple color variations.</p><button class="button ${active === 'practical-dossier' ? 'secondary' : ''}" type="button" data-character-template-apply="practical-dossier:${characterId}">${active === 'practical-dossier' ? 'Currently applied' : 'Use Practical Dossier'}</button></div>
      </article>
    </div>`, `<button class="button secondary" type="button" data-close-modal>Cancel</button>`);
  }

  function applyCharacterTemplate(characterId, template) {
    const item = getItem('characters', characterId);
    if (!item) return;
    item.pageTemplate = template === 'practical-dossier' ? 'practical-dossier' : 'standard';
    if (item.pageTemplate === 'practical-dossier') {
      item.occupation ||= item.role || '';
      item.tagline ||= item.mood || shortText(item.personality, 80);
      item.backstory ||= '';
      item.tags ||= [item.status, item.role].filter(Boolean).join(', ');
      item.dossierTheme ||= 'classic-parchment';
      item.dossierLabels ||= {};
      if (!item.dossierProfileImage && item.profileImage) item.dossierProfileImage = deepClone(item.profileImage);
    }
    item.updatedAt = nowISO();
    logActivity(`Changed ${item.name} to the ${characterTemplateName(item.pageTemplate)} template`);
    scheduleSave();
    closeModal();
    renderEntity('characters', characterId);
    toast(`${characterTemplateName(item.pageTemplate)} applied.`);
  }

    return String(value || '').split(/\n|•|;/).map(part => part.trim().replace(/^[-–—]\s*/, '')).filter(Boolean);
  }
  function dossierChips(value) {
    return String(value || '').split(/,|\n|•/).map(part => part.trim()).filter(Boolean);
  }
  function dossierText(value, fallback='Not added yet.') {
    return value ? `<p>${esc(cleanNotionRefs(value))}</p>` : `<p class="dossier-empty">${esc(fallback)}</p>`;
  }
  function dossierBullets(value, fallback='Add details') {
    const items = dossierList(value);
    return items.length ? `<ul>${items.map(entry => `<li>${esc(entry)}</li>`).join('')}</ul>` : `<p class="dossier-empty">${esc(fallback)}</p>`;
  }
  function dossierChipMarkup(value, fallback='Add tags') {
    const items = dossierChips(value);
    return items.length ? `<div class="dossier-chip-row">${items.map(entry => `<span class="dossier-chip">${esc(entry)}</span>`).join('')}</div>` : `<p class="dossier-empty">${esc(fallback)}</p>`;

  function dossierEditButton(item, field, label) {
    return `<button class="dossier-section-edit" type="button" title="Edit ${esc(label)} content" aria-label="Edit ${esc(label)} content" data-dossier-edit="${item.id}:${field}:${encodeURIComponent(label)}">✎</button>`;
  }
  function dossierLabelButton(item,key,className='') {
    return `<button class="dossier-label-button ${esc(className)}" type="button" title="Rename ${esc(dossierLabel(item,key))}" data-dossier-label-edit="${item.id}:${key}">${esc(dossierLabel(item,key))}</button>`;
  }
  function renderDossierSection(item, field, labelKey, content, extraClass='') {
    const label=dossierLabel(item,labelKey);
    return `<section class="dossier-section ${extraClass}"><h3>${dossierLabelButton(item,labelKey)}</h3>${dossierEditButton(item,field,label)}${content}</section>`;
  }

  function characterMediaKey(slot) {
    return ({header:'headerImage',profile:'profileImage',dossierMain:'dossierMainImage',dossierProfile:'dossierProfileImage',dossierDetail:'dossierDetailImage'})[slot] || 'profileImage';
  }
  function characterMediaLabel(slot) {
    return ({header:'cover image',profile:'portrait',dossierMain:'main portrait',dossierProfile:'profile view',dossierDetail:'detail view'})[slot] || 'image';
  }
  function characterMediaDefaultY(slot) { return slot === 'header' ? 50 : 24; }

  function renderDossierMediaSlot(item, slot, titleKey, helpKey, className='') {
    const media = item[characterMediaKey(slot)] || null;
    const image = media?.src || '';
    const ref = `${slot}:${item.id}`;
    const title=dossierLabel(item,titleKey), help=dossierLabel(item,helpKey);
    return `<article class="dossier-media-card ${esc(className)}">
      <div class="dossier-media-head"><span>${dossierLabelButton(item,titleKey,'media-title')}</span><span>${dossierLabelButton(item,helpKey,'media-help')}</span></div>
      <div class="dossier-media-slot ${image ? 'has-image' : ''}" data-character-media-select="${esc(ref)}" data-character-media-drop="${esc(ref)}" ${image ? `tabindex="0" role="button" aria-label="Select ${esc(title)}"` : ''}>
        ${image ? `<img src="${esc(image)}" alt="${esc(media?.alt || `${item.name} ${title}`)}" style="${characterMediaStyle(media,slot)}">` : `<button class="dossier-media-placeholder" type="button" data-character-media-trigger="${esc(ref)}"><span><strong>Add ${esc(title)}</strong>Click or drop an image here</span></button>`}
