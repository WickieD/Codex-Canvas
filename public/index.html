function sectionTemplateName(kind){ const config=sectionTemplateConfig(kind);return config.templates[sectionDesign(kind).template]?.name || config.templates[config.defaultTemplate].name; }
function sectionThemeName(kind){ const theme=sectionDesign(kind).theme;return theme==='custom'?'Fully Custom':(DOSSIER_THEMES[theme]?.name||'Classic Parchment'); }
function sectionThemePalette(kind,requested){
  const design=sectionDesign(kind);const themeId=requested||design.theme||'classic-parchment';
  if(themeId!=='custom')return {...(DOSSIER_THEMES[themeId]||DOSSIER_THEMES['classic-parchment'])};
  const base=DOSSIER_THEMES['classic-parchment'];const custom=design.customTheme||{};
  return {name:'Custom',paper:safeDossierColor(custom.paper,base.paper),paper2:safeDossierColor(custom.paper2,base.paper2),panel:safeDossierColor(custom.panel,base.panel),ink:safeDossierColor(custom.ink,base.ink),muted:safeDossierColor(custom.muted,base.muted),line:safeDossierColor(custom.line,base.line),accent:safeDossierColor(custom.accent,base.accent),chip:safeDossierColor(custom.chip,base.chip)};
}
function sectionThemeStyle(kind){
  const t=sectionThemePalette(kind);
  return `--section-paper:${t.paper};--section-paper-2:${t.paper2};--section-panel:${t.panel};--section-ink:${t.ink};--section-muted:${t.muted};--section-line:${t.line};--section-accent:${t.accent};--section-chip:${t.chip};`;
}
function sectionCssClass(kind){ return `section-themed-shell section-kind-${kind} template-${sectionDesign(kind).template}`; }
function sectionDesignToolbar(kind){
  const config=sectionTemplateConfig(kind);
  return `<div class="section-design-toolbar"><div class="section-design-heading"><span class="section-design-icon">${config.icon}</span><span class="section-design-copy"><span>${esc(config.label)}</span><strong>${esc(sectionTemplateName(kind))}</strong></span></div><div class="section-design-actions"><button class="button secondary small" type="button" data-section-template-picker="${esc(kind)}">Change layout</button><button class="button secondary small" type="button" data-section-theme-picker="${esc(kind)}">Colors: ${esc(sectionThemeName(kind))}</button></div></div>`;
}
function showSectionTemplatePicker(kind){
  const config=sectionTemplateConfig(kind);const active=sectionDesign(kind).template;
  const cards=Object.entries(config.templates).map(([id,item])=>`<article class="section-template-choice ${active===id?'is-active':''}"><div class="section-template-preview ${esc(item.preview)}"><div class="preview-line" style="width:58%"></div><div class="preview-line" style="width:82%"></div><div class="preview-card"></div><div class="preview-card"></div><div class="preview-card"></div></div><div class="section-template-body"><h3>${esc(item.name)}</h3><p>${esc(item.description)}</p><button class="button ${active===id?'secondary':''}" type="button" data-section-template-apply="${esc(kind)}:${esc(id)}">${active===id?'Currently applied':'Use this layout'}</button></div></article>`).join('');
  showModal(`Choose a ${config.label.toLowerCase()}`,`<div class="section-template-gallery">${cards}</div>`,`<button class="button secondary" type="button" data-close-modal>Cancel</button>`);
}
function sectionThemeCard(kind,id,theme,active){
  const colors=[theme.paper,theme.paper2,theme.panel,theme.accent,theme.chip];
  return `<button class="section-theme-card ${active===id?'is-active':''}" type="button" data-section-theme-apply="${esc(kind)}:${esc(id)}"><span class="section-theme-swatches">${colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span class="section-theme-card-copy"><strong>${esc(theme.name)}</strong><small>${active===id?'Currently applied':'Apply to this section'}</small></span></button>`;
}
function showSectionThemePicker(kind){
  const design=sectionDesign(kind);const active=design.theme||'classic-parchment';
  const cards=Object.entries(DOSSIER_THEMES).map(([id,t])=>sectionThemeCard(kind,id,t,active)).join('');
  const custom=sectionThemePalette(kind,'custom');
  const fields=[['paper','Page background'],['paper2','Top surface'],['panel','Cards and panels'],['ink','Main text'],['muted','Secondary text'],['line','Borders and connectors'],['accent','Accent'],['chip','Tags and highlights']];
  showModal(`${sectionTemplateConfig(kind).label} colors`,`<div class="section-theme-gallery">${cards}</div><section class="section-custom-theme"><h3>Fully customizable</h3><p class="page-subtitle">Choose a custom palette for this section without changing the other databases.</p><div class="section-custom-grid">${fields.map(([key,label])=>`<label><span>${esc(label)}</span><input type="color" value="${safeDossierColor(custom[key],'#000000')}" data-section-custom-color="${esc(key)}"></label>`).join('')}</div><button class="button" type="button" data-section-custom-save="${esc(kind)}">Save custom colors</button></section>`,`<button class="button secondary" type="button" data-close-modal>Done</button>`);
}
function sectionEntityCover(kind,item){
  const design=sectionDesign(kind);let glyph='⌖',detail='';
  if(kind==='locations'){glyph=item.type==='Region'?'◉':'⌖';detail=`${item.type||'Location'}${childrenOf(item.id).length?` · ${childrenOf(item.id).length} inside`:''}`;}
  else if(kind==='factions'){glyph=initials(item.name);detail=`${item.power||'Faction'}${item.keyMemberIds?.length?` · ${item.keyMemberIds.length} key members`:''}`;}
  else {glyph='⌛';detail=`${item.date||'Undated'}${item.status?` · ${item.status}`:''}`;}
  return `<div class="section-entity-cover"><div class="section-entity-mark"><span class="section-entity-glyph">${esc(glyph)}</span><strong>${esc(sectionTemplateName(kind))}</strong><span>${esc(detail)}</span></div></div>`;
}

function renderLocationAtlasCards(items){
  return `<div class="location-atlas-grid">${items.map((item,index)=>`<button class="location-atlas-card" type="button" data-open="locations:${item.id}"><span class="location-atlas-header"><span><span class="location-atlas-type">${esc(item.type||'Location')}</span><h3>${esc(item.name)}</h3></span><span class="location-atlas-symbol">${item.type==='Region'?'◉':'⌖'}</span></span><p>${esc(shortText(item.description||item.atmosphere,190)||'No description yet.')}</p><span class="tag-row">${[parentName(item),item.controlledBy,childrenOf(item.id).length?`${childrenOf(item.id).length} inside`:null].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</span><span class="location-atlas-route">Atlas entry ${String(index+1).padStart(2,'0')} · ${parentName(item)?`Inside ${esc(parentName(item))}`:'Top-level location'}</span></button>`).join('')}</div>`;
}
function renderLocationJournal(items){
  return `<div class="location-journal-list">${items.map((item,index)=>`<button class="location-journal-card" type="button" data-open="locations:${item.id}"><span class="location-journal-number">${String(index+1).padStart(2,'0')}</span><span class="location-journal-copy"><span class="location-atlas-type">${esc(item.type||'Location')}</span><h3>${esc(item.name)}</h3><p>${esc(shortText(item.atmosphere||item.description,260)||'Add the feeling, sights, and story of this place.')}</p><span class="tag-row">${[parentName(item),item.controlledBy].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</span></span></button>`).join('')}</div>`;
}
function renderFactionHeraldic(items){
  return `<div class="faction-heraldic-grid">${items.map(item=>`<button class="faction-heraldic-card" type="button" data-open="factions:${item.id}"><span class="faction-heraldic-banner"><span class="faction-crest">${esc(initials(item.name))}</span></span><span class="faction-heraldic-body"><span class="location-atlas-type">${esc(item.power||'Faction')}</span><h3>${esc(item.name)}</h3><p>${esc(shortText(item.goal||item.notes,175)||'No stated goal yet.')}</p><span class="tag-row"><span class="tag">${item.keyMemberIds?.length||0} key members</span></span></span></button>`).join('')}</div>`;
}
function factionPowerOrder(value){ return ({Dominant:0,Major:1,Moderate:2,Minor:3,Hidden:4})[value]??5; }
function renderFactionInfluence(items){
  const groups=[...new Set(items.map(i=>i.power||'Unspecified'))].sort((a,b)=>factionPowerOrder(a)-factionPowerOrder(b)||a.localeCompare(b));
  return `<div class="faction-influence-board">${groups.map(group=>{const entries=items.filter(i=>(i.power||'Unspecified')===group);return `<section class="faction-influence-column"><h3><span>${esc(group)}</span><span>${entries.length}</span></h3>${entries.map(item=>`<button class="faction-influence-card" type="button" data-open="factions:${item.id}"><strong>${esc(item.name)}</strong><span class="cell-muted">${esc(shortText(item.goal||item.notes,110))}</span></button>`).join('')}</section>`;}).join('')}</div>`;
}
function renderFactionIntel(items){
  return `<div class="faction-intel-list">${items.map((item,index)=>`<button class="faction-intel-card" type="button" data-open="factions:${item.id}"><span class="faction-intel-code">F-${String(index+1).padStart(2,'0')}</span><span><strong>${esc(item.name)}</strong><small class="cell-muted">${esc(shortText(item.goal||item.notes,145))}</small></span><span class="tag">${esc(item.power||'Unspecified')}</span></button>`).join('')}</div>`;
}
function renderTimelineEraCards(items){
  return `<div class="timeline-era-grid">${items.map(item=>`<button class="timeline-era-card" type="button" data-open="events:${item.id}"><span class="timeline-era-date">${esc(item.date||'Undated')}</span><h3>${esc(item.name)}</h3><p>${esc(shortText(item.description||item.notes,190)||'No event description yet.')}</p><span class="tag-row"><span class="tag">${esc(item.status||'Unspecified')}</span>${item.characterIds?.length?`<span class="tag">${item.characterIds.length} people</span>`:''}</span></button>`).join('')}</div>`;
}
function renderTimelineArchive(items){
  return `<div class="timeline-archive-list">${items.map(item=>`<button class="timeline-archive-row" type="button" data-open="events:${item.id}"><span class="timeline-archive-date">${esc(item.date||'Undated')}</span><span><strong>${esc(item.name)}</strong><small class="cell-muted">${esc(shortText(item.description||item.consequences||item.notes,130))}</small></span><span class="tag">${esc(item.status||'Unspecified')}</span></button>`).join('')}</div>`;
}

function renderCollectionView(kind,items,view){
  const template=SECTION_TEMPLATE_CONFIG[kind]?sectionDesign(kind).template:'';
  if(kind==='locations'){
    if(view==='table')return renderTable(kind,items);
    if(view==='tree'||template==='hierarchy-survey')return renderLocationTree(items);
    return template==='travel-journal'?renderLocationJournal(items):renderLocationAtlasCards(items);
  }
  if(kind==='factions'){
    if(view==='table')return renderTable(kind,items);
    if(template==='influence-board')return renderFactionInfluence(items);
    if(template==='intelligence-files')return renderFactionIntel(items);
    return renderFactionHeraldic(items);
  }
  if(kind==='events'){
    if(view==='table'||template==='archive-ledger')return template==='archive-ledger'?renderTimelineArchive(items):renderTable(kind,items);
    if(template==='era-cards')return renderTimelineEraCards(items);
    return renderTimeline(items);
  }
  if(view==='table')return renderTable(kind,items);
  return `<div class="card-grid">${items.map(item=>renderEntityCard(kind,item)).join('')}</div>`;
}

function renderCollection(kind){
  if(kind==='characters'){
    const meta=COLLECTIONS[kind],filter=collectionFilters[kind].toLowerCase(),items=state[kind].filter(item=>JSON.stringify(item).toLowerCase().includes(filter)),view=collectionView[kind];
    const viewButtons=[['gallery','Gallery'],['table','Table']];
    el.main.innerHTML=`${pageHead('Database',meta.label,'People, roles, relationships, moods, locations, and story notes.',`<button class="button" type="button" data-new="${kind}">New ${meta.singular.toLowerCase()}</button>`)}<div class="collection-toolbar"><div class="toolbar-left"><div class="segmented">${viewButtons.map(([v,l])=>`<button type="button" class="${view===v?'active':''}" data-collection-view="${kind}:${v}">${l}</button>`).join('')}</div><button class="button secondary small" type="button" data-graph-kind="characters">Graph view</button></div><div class="toolbar-right"><input class="input toolbar-search" type="search" value="${esc(collectionFilters[kind])}" placeholder="Filter characters" data-filter-kind="${kind}"></div></div>${items.length?renderCollectionView(kind,items,view):'<div class="panel empty-state">No matching items.</div>'}`;
    return;
  }
  const meta=COLLECTIONS[kind],filter=collectionFilters[kind].toLowerCase(),items=state[kind].filter(item=>JSON.stringify(item).toLowerCase().includes(filter)),view=collectionView[kind];
  const subtitle={locations:'Regions and places with true parent-child structure and related-location links.',factions:'Organizations, species groups, power levels, goals, and alliances.',events:'World history and current story events tied to the people involved.'}[kind];
  const viewButtons=kind==='locations'?[['tree','Tree'],['gallery','Gallery'],['table','Table']]:kind==='events'?[['timeline','Timeline'],['table','Table']]:[['gallery','Gallery'],['table','Table']];
  el.main.innerHTML=`<section class="${sectionCssClass(kind)}" style="${sectionThemeStyle(kind)}">${sectionDesignToolbar(kind)}${pageHead('Database',meta.label,subtitle,`<button class="button" type="button" data-new="${kind}">New ${meta.singular.toLowerCase()}</button>`)}<div class="collection-toolbar"><div class="toolbar-left"><div class="segmented">${viewButtons.map(([v,l])=>`<button type="button" class="${view===v?'active':''}" data-collection-view="${kind}:${v}">${l}</button>`).join('')}</div><button class="button secondary small" type="button" data-graph-kind="${kind==='events'?'world':kind}">Graph view</button></div><div class="toolbar-right"><input class="input toolbar-search" type="search" value="${esc(collectionFilters[kind])}" placeholder="Filter ${meta.label.toLowerCase()}" data-filter-kind="${kind}"></div></div>${items.length?renderCollectionView(kind,items,view):'<div class="panel empty-state">No matching items.</div>'}</section>`;

function renderEntity(kind,itemId){
  const item=getItem(kind,itemId);if(!item){navigate(kind);return;}const meta=COLLECTIONS[kind];
  if(kind==='characters'&&item.pageTemplate==='practical-dossier'){el.main.innerHTML=renderPracticalDossier(item);requestAnimationFrame(()=>{autoSizeEntityTitle(document.querySelector('.entity-title-input'));installCharacterImageInteractions();});return;}
  const breadcrumb=kind==='locations'?renderLocationBreadcrumb(item):'';
  const snapshot=kind==='characters'?renderCharacterSnapshot(item):'';
  const entityCover=kind==='characters'?renderCharacterCover(item):sectionEntityCover(kind,item);
  const templateToolbar=kind==='characters'?renderCharacterTemplateToolbar(item):sectionDesignToolbar(kind);
  const body=`${templateToolbar}${breadcrumb}<section class="entity-hero">${entityCover}<div class="entity-title-row"><textarea class="entity-title-input" rows="1" aria-label="${meta.singular} name" data-title-kind="${kind}" data-title-id="${item.id}">${esc(item.name)}</textarea><button class="favorite-button ${item.favorite?'on':''}" type="button" data-favorite="${kind}:${item.id}" title="Favorite">☆</button></div></section><div class="entity-layout"><div class="editor-surface ${kind==='characters'?'character-editor-surface':''}">${snapshot}${renderBlockEditor(kind,item.id,item.blocks,item.name)}</div><aside class="properties-panel"><div class="panel-head" style="padding:0 0 14px"><h2>Properties</h2><button class="button ghost small" type="button" data-delete="${kind}:${item.id}">Delete</button></div>${renderProperties(kind,item)}</aside></div>`;
  el.main.innerHTML=kind==='characters'?body:`<section class="${sectionCssClass(kind)}" style="${sectionThemeStyle(kind)}">${body}</section>`;
  requestAnimationFrame(()=>{autoSizeEntityTitle(document.querySelector('.entity-title-input'));if(kind==='characters')installCharacterImageInteractions();});
}

function applyGraphTemplateVisuals(){
  const design=sectionDesign('graph');const svg=document.getElementById('graphSvg');if(!svg)return;
  const nodeRadius=design.template==='story-threads'?16:design.template==='tactical-blueprint'?12:13;
  svg.querySelectorAll('.graph-node').forEach(node=>node.setAttribute('r',nodeRadius));
  svg.querySelectorAll('.story-node-circle').forEach(node=>node.setAttribute('r',design.template==='story-threads'?22:19));
}

function renderGraphPage(){
  const focusOptions=graphFocusOptions();if(graphSettings.graphType==='story'&&!activeStoryGraph())graphSettings.storyId=state.storyGraphs?.[0]?.id||'';if(graphSettings.layout==='focus'&&!graphSettings.focus)graphSettings.focus=graphDefaultFocus();

tions"><button class="button secondary small" type="button" data-graph-items="all">Select all items</button><button class="button ghost small" type="button" data-graph-items="none">Clear all items</button><button class="button ghost small" type="button" data-reset-graph-layout>Reset positions</button></div></div><div class="graph-filter-grid"><fieldset class="graph-filter-group"><legend>Item types</legend><div class="graph-check-row">${typeOptions.map(option=>graphCheckbox(`type:${option.key}`,option.label,graphSettings.visibleTypes[option.key]!==false,'data-graph-type')).join('')}</div></fieldset><fieldset class="graph-filter-group"><legend>Connections</legend><div class="graph-check-row">${relationOptions.map(option=>graphCheckbox(`relation:${option.key}`,option.label,graphSettings.visibleRelations[option.key]!==false,'data-graph-relation')).join('')}</div></fieldset></div><details class="graph-item-details"><summary>Included ${includedLabel} <span id="graphItemCount">${items.filter(item=>!graphSettings.hiddenNodeIds.includes(item.nodeId)).length} of ${items.length}</span></summary><div class="graph-item-list">${items.map(item=>graphCheckbox(item.nodeId,item.label,!graphSettings.hiddenNodeIds.includes(item.nodeId),'data-graph-node',item.type)).join('')}</div></details></section><div class="graph-visual-grid"><div class="graph-stage" id="graphStage"><svg id="graphSvg" role="img" aria-label="Interactive story and relationship graph"></svg><div class="graph-legend" id="graphLegend"></div></div><aside class="graph-inspector" id="graphInspector" aria-live="polite">${graphSettings.graphType==='story'?'<span class="eyebrow">Story graph</span><h2>Choose a story point</h2><p class="graph-empty-inspector">Tap a circle to preview that part of the RP. Drag a circle to rearrange the story map.</p>':'<span class="eyebrow">Connection details</span><h2>Select a circle</h2><p class="graph-empty-inspector">Select an item to see why it is connected. Double-click a circle to open its full page.</p>'}</aside></div><p class="graph-help">${esc(help)}</p></section>`;
  requestAnimationFrame(()=>{drawGraph();requestAnimationFrame(applyGraphTemplateVisuals);});
}

async function readWorkspaceFromRef(workspaceRef){
  const api=firebase.api;
  const [metaSnap,...collectionSnaps]=await Promise.all([
    api.getDoc(workspaceRef),...SYNC_COLLECTIONS.map(kind=>api.getDocs(api.collection(workspaceRef,kind)))
  ]);
  const hasRemote=metaSnap.exists()||collectionSnaps.some(snap=>!snap.empty);
  if(!hasRemote)return false;
  const next=deepClone(window.INITIAL_WORLD_DATA);
  if(metaSnap.exists())Object.assign(next,metaSnap.data());
  SYNC_COLLECTIONS.forEach((kind,i)=>{
    next[kind]=collectionSnaps[i].docs.map(docSnap=>{
      const value=docSnap.data(),order=Number(value.__order)||0;delete value.__order;return {value,order};
    }).sort((a,b)=>a.order-b.order).map(entry=>entry.value);
  });
  firebase.applyingRemote=true;state=next;normalizeState();firebase.applyingRemote=false;
  return true;

async function bootstrapSharedWorkspace(){
  const api=firebase.api,workspaceRef=firebaseWorkspaceRef(),email=normalizeMemberEmail(firebase.user.email);
  const memberRef=firebaseMemberRef(email);
  const memberSnap=await api.getDoc(memberRef);
  if(memberSnap.exists()){
    firebase.currentMember={id:memberSnap.id,...memberSnap.data()};
    firebase.currentRole=firebase.currentMember.role||'Viewer';
    await api.setDoc(memberRef,{uid:firebase.user.uid,lastSeenAt:nowISO()},{merge:true});
    return;
  }

  // No membership exists for this email. Attempt the one-time shared-world
  // initialization as a single atomic batch. If another owner already created
  // the world, Firestore rejects this batch and the account remains uninvited.
  await readWorkspaceFromRef(firebaseLegacyWorkspaceRef());
  normalizeState();
  state.workspace.members=[];state.workspace.access={};
  const createdAt=nowISO();
  state.createdAt=createdAt;state.createdByUid=firebase.user.uid;state.createdByEmail=email;
  const ownerRecord={email,role:'Owner',status:'Access granted',uid:firebase.user.uid,addedAt:createdAt,addedBy:email,lastSeenAt:createdAt};
  const meta={...stateMetaPayload(),createdAt,createdByUid:firebase.user.uid,createdByEmail:email};
  const batch=api.writeBatch(api.db);
  batch.set(workspaceRef,meta,{merge:false});
  batch.set(memberRef,ownerRecord,{merge:false});
  try{
    await batch.commit();
  }catch(error){
    if(error.code==='permission-denied'||error.code==='already-exists'||error.code==='failed-precondition'){
      const denied=new Error('This account has not been granted access to this shared world. Please contact the admin team.');
      denied.code='codex/access-denied';throw denied;
    }
    throw error;
  }
  firebase.currentMember={id:email,...ownerRecord};firebase.currentRole='Owner';
  await syncStateToFirestore(true);
}

async function loadRemoteWorkspace(){

  const next=deepClone(window.INITIAL_WORLD_DATA);

  SYNC_COLLECTIONS.forEach((kind,i)=>{
    const docs=collectionSnaps[i].docs.map(docSnap=>{

    }).sort((a,b)=>a.order-b.order).map(entry=>entry.value);

async function commitFirestoreOperations(operations){
  const api=firebase.api;
  for(let start=0;start<operations.length;start+=400){
    const batch=api.writeBatch(api.db);
    for(const op of operations.slice(start,start+400)){
      if(op.type==='delete')batch.delete(op.ref);else batch.set(op.ref,op.data,{merge:false});
    }
    await batch.commit();
  }
}

async function syncStateToFirestore(force=false){
  if(!firebase.connected||!firebase.user||firebase.applyingRemote||!canEditSharedWorld())return;
  const api=firebase.api,workspaceRef=firebaseWorkspaceRef(),operations=[];
  const meta=stateMetaPayload(),metaJson=JSON.stringify(meta);
  if(force||metaJson!==firebase.remoteCache.meta){operations.push({type:'set',ref:workspaceRef,data:meta});firebase.remoteCache.meta=metaJson;}
  for(const kind of SYNC_COLLECTIONS){
    const cache=firebase.remoteCache.collections[kind]||new Map(),nextIds=new Set();
    (state[kind]||[]).forEach((item,index)=>{
      const docId=String(item.id||id(kind)).replaceAll('/','_');if(!item.id)item.id=docId;nextIds.add(docId);
      const data=entityPayload(item,index),json=JSON.stringify(data);

    });
    for(const oldId of [...cache.keys()])if(!nextIds.has(oldId)){
      operations.push({type:'delete',ref:api.doc(api.collection(workspaceRef,kind),oldId)});cache.delete(oldId);

  if(operations.length)await commitFirestoreOperations(operations);

  },error=>{console.error(error);toast('Live workspace updates stopped. Check the Firestore rules.','error');}));
  for(const kind of SYNC_COLLECTIONS){
    firebase.unsubscribes.push(api.onSnapshot(api.collection(workspaceRef,kind),{includeMetadataChanges:true},snap=>{
      if(snap.metadata.hasPendingWrites)return;

        firebase.remoteCache.collections[kind].set(docSnap.id,json);delete raw.__order;return {value:raw,order};
      }).sort((a,b)=>a.order-b.order);
      const incoming=entries.map(x=>x.value);if(JSON.stringify(incoming)===JSON.stringify(state[kind]||[]))return;
      firebase.applyingRemote=true;state[kind]=incoming;firebase.applyingRemote=false;queueRemoteRender();
    },error=>{console.error(error);toast(`Live ${kind} updates stopped.`,'error');}));
  }
}

function generatedTemporaryPassword(){

}

const normalizeStateBeforeStoryTools = normalizeState;
normalizeState = function(){
  normalizeStateBeforeStoryTools();
  state.storyGraphs ||= [];
  state.storyIntersections ||= [];
  state.graphConnections ||= [];
  for(const story of state.storyGraphs){
    story.id ||= id('story'); story.name ||= 'Untitled Story'; story.description ||= '';
    story.nodes ||= []; story.links ||= []; story.positions ||= {}; story.rpTurns ||= [];
    story.links.forEach(link=>{link.id ||= id('story-link');link.label ||= 'Continues to';link.description ||= '';});
  }
  state.storyIntersections = state.storyIntersections.filter(Boolean).map(item=>({id:item.id||id('intersection'),label:item.label||'Story intersection',description:item.description||'',...item}));
  state.graphConnections = state.graphConnections.filter(Boolean).map(item=>({id:item.id||id('connection'),label:item.label||'Connected',description:item.description||'',...item}));
};
normalizeState();

const stateMetaPayloadBeforeStoryTools = stateMetaPayload;

function graphNodePrefixForKind(kind){return ({characters:'character',locations:'location',species:'species',factions:'faction',events:'event'})[kind]||kind;}
const deleteItemBeforeStoryTools = deleteItem;
deleteItem = function(kind,itemId){
  const existing=getItem(kind,itemId); if(!existing)return;
  const nodeId=`${graphNodePrefixForKind(kind)}:${itemId}`;
  deleteItemBeforeStoryTools(kind,itemId);
  if(getItem(kind,itemId))return;
  for(const story of state.storyGraphs||[]){
    story.nodes=(story.nodes||[]).filter(node=>node.id!==nodeId);
    story.links=(story.links||[]).filter(link=>link.source!==nodeId&&link.target!==nodeId);
    delete story.positions?.[nodeId];
  }
  state.storyIntersections=(state.storyIntersections||[]).filter(item=>item.nodeAId!==nodeId&&item.nodeBId!==nodeId);
  state.graphConnections=(state.graphConnections||[]).filter(item=>item.source!==nodeId&&item.target!==nodeId);
  if(kind==='species')state.characters.forEach(person=>{if(person.speciesId===itemId)person.speciesId='';});
  scheduleSave();
};

function storyFirstRoute(story){const first=(story?.nodes||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0))[0];return first?storyRouteValue(story.id,first.id):story.id;}
function storyIntersectionCount(storyId){return (state.storyIntersections||[]).filter(item=>item.storyAId===storyId||item.storyBId===storyId).length;}
function allGraphPointOptions(){
  return [
    ...state.characters.map(x=>({value:`character:${x.id}`,label:`Person · ${x.name}`})),
    ...state.locations.map(x=>({value:`location:${x.id}`,label:`Location · ${x.name}`})),
    ...state.species.map(x=>({value:`species:${x.id}`,label:`Species · ${x.name}`})),
    ...state.factions.map(x=>({value:`faction:${x.id}`,label:`Faction · ${x.name}`})),
    ...state.events.map(x=>({value:`event:${x.id}`,label:`Event · ${x.name}`}))
  ];
}
function storyPointOptions(story){return (story?.nodes||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0)).map(node=>({value:node.id,label:`${node.order||''} · ${storyNodeName(node.id)}`}));}
function renderStoryLibrary(){

  }).join('');

    const a=storyById(item.storyAId),b=storyById(item.storyBId);if(!a||!b)return '';
    return `<article class="story-intersection-card"><div><strong>${esc(item.label||'Story intersection')}</strong><small>${esc(a.name)} at ${esc(storyNodeName(item.nodeAId))} ↔ ${esc(b.name)} at ${esc(storyNodeName(item.nodeBId))}${item.description?` · ${esc(item.description)}`:''}</small></div><button class="button ghost small" type="button" data-delete-intersection="${esc(item.id)}">Remove</button></article>`;
  }).join('');
  el.main.innerHTML=`${pageHead('Roleplay writing','Story Library','Create as many independent or interconnected stories as your world needs.',`<button class="button" type="button" data-new-story>New story</button><button class="button secondary" type="button" data-nav="graph">Open graphs</button>`)}<div class="story-library-toolbar"><p class="page-subtitle">Each story keeps its own RP sheet and graph points. Intersections record where two stories meet without forcing every story into one path.</p></div>${cards?`<div class="story-library-grid">${cards}</div>`:'<div class="empty-story-workspace"><h2>No stories yet</h2><p>Create the first story, then add people, places, factions, species, or events as story points.</p><button class="button" type="button" data-new-story>Create the first story</button></div>'}<section class="intersection-board"><h2>Story intersections</h2><p class="page-subtitle">Intersections are shared moments where two otherwise separate stories cross.</p><div class="story-intersection-list">${intersectionCards||'<div class="panel empty-state">No story intersections have been added yet.</div>'}</div></section>`;
}

function showStoryManager(storyId){
  const story=storyById(storyId);if(!story)return;
  const points=storyPointOptions(story),allPoints=allGraphPointOptions().filter(option=>!(story.nodes||[]).some(node=>node.id===option.value));

  const intersections=(state.storyIntersections||[]).filter(item=>item.storyAId===story.id||item.storyBId===story.id).map(item=>{const other=storyById(item.storyAId===story.id?item.storyBId:item.storyAId);return `<div class="story-point-manager-row"><span><strong>${esc(item.label)}</strong><small>${esc(other?.name||'Other story')} · ${esc(item.description||'Shared story point')}</small></span><button class="button ghost small" type="button" data-delete-intersection="${esc(item.id)}">Remove</button></div>`;}).join('');
  showModal(`Manage ${story.name}`,`<div class="story-manager"><div class="story-manager-grid"><label><span>Story name</span><input class="input" value="${esc(story.name)}" data-story-name="${esc(story.id)}"></label><label><span>Description</span><textarea class="textarea" rows="3" data-story-description="${esc(story.id)}">${esc(story.description||'')}</textarea></label></div><section class="story-manager-section"><h3>Story points</h3><div class="story-manager-add"><label><span>Add a person, place, group, species, or event</span><select id="storyPointToAdd" class="select"><option value="">Choose a point</option>${allPoints.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></label><label><span>Point role</span><input id="storyPointRole" class="input" placeholder="Story turn, setting, branch…"></label><button class="button" type="button" data-add-story-point="${esc(story.id)}">Add point</button></div><div class="story-point-manager-list">${pointRows||'<p class="page-subtitle">No points yet.</p>'}</div></section><section class="story-manager-section"><h3>Connect this story to another story</h3>${otherStories.length&&points.length?`<div class="story-manager-add"><label><span>Other story</span><select id="intersectionOtherStory" class="select"><option value="">Choose a story</option>${otherStories.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label><label><span>This story point</span><select id="intersectionThisPoint" class="select">${points.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></label><label><span>Other story point</span><select id="intersectionOtherPoint" class="select"><option value="">Choose the other story first</option></select></label><label><span>Intersection name</span><input id="intersectionLabel" class="input" placeholder="Paths cross, shared aftermath…"></label><label style="grid-column:1/-1"><span>Description</span><input id="intersectionDescription" class="input" placeholder="What connects these stories here?"></label><button class="button" type="button" data-add-intersection="${esc(story.id)}">Add intersection</button></div>`:'<p class="page-subtitle">Add points to this story and create at least one other story before adding an intersection.</p>'}<div class="story-point-manager-list">${intersections||''}</div></section></div>`,`<button class="button secondary" type="button" data-close-modal>Done</button><button class="button" type="button" data-open-story="${esc(story.id)}">Open story</button>`);
}
function addStoryPoint(storyId){
  const story=storyById(storyId),nodeId=document.getElementById('storyPointToAdd')?.value;if(!story||!nodeId)return;
  const role=document.getElementById('storyPointRole')?.value.trim()||'Story point';const ordered=(story.nodes||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));const previous=ordered.at(-1);
  const node={id:nodeId,order:ordered.length+1,role,passage:{title:'',summary:'',anchorTurnId:'',turns:[]}};story.nodes.push(node);
  if(previous)story.links.push({id:id('story-link'),source:previous.id,target:nodeId,label:'Continues to',description:'',mainPath:true,curve:0});
  scheduleSave();showStoryManager(storyId);
}
function removeStoryPoint(storyId,nodeId){
  const story=storyById(storyId);if(!story)return;story.nodes=(story.nodes||[]).filter(node=>node.id!==nodeId);story.links=(story.links||[]).filter(link=>link.source!==nodeId&&link.target!==nodeId);delete story.positions?.[nodeId];story.nodes.sort((a,b)=>(a.order||0)-(b.order||0)).forEach((node,index)=>node.order=index+1);state.storyIntersections=(state.storyIntersections||[]).filter(item=>!(item.storyAId===storyId&&item.nodeAId===nodeId)&&!(item.storyBId===storyId&&item.nodeBId===nodeId));scheduleSave();showStoryManager(storyId);
}
function addStoryIntersection(storyId){
  const otherStoryId=document.getElementById('intersectionOtherStory')?.value,nodeAId=document.getElementById('intersectionThisPoint')?.value,nodeBId=document.getElementById('intersectionOtherPoint')?.value,label=document.getElementById('intersectionLabel')?.value.trim()||'Story intersection',description=document.getElementById('intersectionDescription')?.value.trim()||'';
  if(!otherStoryId||!nodeAId||!nodeBId){toast('Choose both stories and both story points.','error');return;}
  state.storyIntersections.push({id:id('intersection'),storyAId:storyId,nodeAId,storyBId:otherStoryId,nodeBId,label,description});scheduleSave();showStoryManager(storyId);
}
function deleteStory(storyId){const story=storyById(storyId);if(!story||!confirm(`Delete “${story.name}” and its RP sheet?`))return;state.storyGraphs=state.storyGraphs.filter(x=>x.id!==storyId);state.storyIntersections=(state.storyIntersections||[]).filter(x=>x.storyAId!==storyId&&x.storyBId!==storyId);if(graphSettings.storyId===storyId)graphSettings.storyId=state.storyGraphs[0]?.id||'';scheduleSave();renderStoryLibrary();}

const graphRelationFiltersBeforeCustom = graphRelationFilters;
graphRelationFilters = function(){const values=graphRelationFiltersBeforeCustom();if(graphSettings.graphType!=='story'&&!values.some(x=>x.key==='custom'))values.push({key:'custom',label:'Custom branches'});return values;};
const graphRelationLabelBeforeCustom = graphRelationLabel;
graphRelationLabel = function(type){return type==='custom'?'custom branch':graphRelationLabelBeforeCustom(type);};
const graphConnectionSentenceBeforeCustom = graphConnectionSentence;
graphConnectionSentence = function(nodeId,link,byId){
  if(link.type==='custom'){
    const sourceId=typeof link.source==='string'?link.source:link.source.id,targetId=typeof link.target==='string'?link.target:link.target.id,other=byId.get(sourceId===nodeId?targetId:sourceId);
    return `${link.label||'Connected'}${other?` · ${other.label}`:''}${link.description?` — ${link.description}`:''}`;
  }
  const base=graphConnectionSentenceBeforeCustom(nodeId,link,byId);return link.description?`${base} — ${link.description}`:base;
};
const graphDataBeforeCustom = graphData;
graphData = function(){
  const data=graphDataBeforeCustom();
  if(graphSettings.graphType==='story'){
    const story=activeStoryGraph();for(const link of data.links){const source=typeof link.source==='string'?link.source:link.source.id,target=typeof link.target==='string'?link.target:link.target.id;const saved=(story?.links||[]).find(x=>x.source===source&&x.target===target&&x.label===link.label);if(saved){link.id=saved.id;link.description=saved.description||'';}}
    return data;
  }
  if(graphSettings.visibleRelations.custom===false)return data;
  const nodeIds=new Set(data.nodes.map(node=>node.id)),existing=new Set(data.links.map(link=>{const s=typeof link.source==='string'?link.source:link.source.id,t=typeof link.target==='string'?link.target:link.target.id;return `${s}|${t}|${link.type}|${link.label||''}`;}));
  for(const branch of state.graphConnections||[]){
    if(!nodeIds.has(branch.source)||!nodeIds.has(branch.target))continue;const key=`${branch.source}|${branch.target}|custom|${branch.label||''}`;if(existing.has(key))continue;data.links.push({id:branch.id,source:branch.source,target:branch.target,type:'custom',label:branch.label||'Connected',description:branch.description||''});
  }
  return data;
};

function graphConnectionNodeOptions(){
  if(graphSettings.graphType==='story')return storyPointOptions(activeStoryGraph());

  if(graphSettings.graphType==='locations')return state.locations.map(x=>({value:`location:${x.id}`,label:x.name}));
  return allGraphPointOptions();
}

  return `<details class="graph-connection-panel"><summary>Add or rename custom branches</summary><div class="graph-connection-panel-body"><div class="graph-connection-form"><label><span>First point</span><select id="graphConnectionFrom" class="select"><option value="">Choose a point</option>${options.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></label><label><span>Second point</span><select id="graphConnectionTo" class="select"><option value="">Choose a point</option>${options.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></label><label><span>Branch name</span><input id="graphConnectionLabel" class="input" placeholder="Bond established"></label><label><span>Description</span><input id="graphConnectionDescription" class="input" placeholder="Optional explanation"></label><button class="button" type="button" data-add-graph-connection>Add branch</button></div><div class="graph-connection-manager-list">${rows||'<p class="page-subtitle">No custom branches in this view.</p>'}</div></div></details>`;
}

function addGraphConnection(){

async function changeOwnPassword(){
  const current=document.getElementById('currentAccountPassword')?.value||'',next=document.getElementById('newAccountPassword')?.value||'',confirmNext=document.getElementById('confirmAccountPassword')?.value||'';
  if(!current||!next){toast('Enter your current and new password.','error');return;}if(next.length<6){toast('Use a password with at least six characters.','error');return;}if(next!==confirmNext){toast('The new passwords do not match.','error');return;}
  try{const credential=firebase.api.EmailAuthProvider.credential(firebase.user.email,current);await firebase.api.reauthenticateWithCredential(firebase.user,credential);await firebase.api.updatePassword(firebase.user,next);closeModal();toast('Your password was changed.');}
  catch(error){console.error(error);toast(error.code==='auth/invalid-credential'?'The current password is not correct.':'The password could not be changed.','error');}
}
async function ownerSendPasswordReset(memberId){
  if(!isWorkspaceOwner()){toast('Only owners can send password resets.','error');return;}const member=memberById(memberId);if(!member)return;
  if(!confirm(`Send a password-reset email to ${member.email}?`))return;
  try{await firebase.api.sendPasswordResetEmail(firebase.api.auth,member.email,{url:'https://codex-canvas.pages.dev'});toast(`Password-reset email sent to ${member.email}.`);}
  catch(error){console.error(error);toast('The reset email could not be sent. Confirm that this email already has a Firebase Authentication account.','error');}
}

document.addEventListener('click',event=>{
  const newStory=event.target.closest('[data-new-story]');if(newStory){event.preventDefault();showNewStoryModal();return;}
  const createStory=event.target.closest('[data-create-story]');if(createStory){event.preventDefault();createStoryFromModal();return;}
  const manageStory=event.target.closest('[data-manage-story]');if(manageStory){event.preventDefault();closeModal();showStoryManager(manageStory.dataset.manageStory);return;}
  const openStory=event.target.closest('[data-open-story]');if(openStory){event.preventDefault();closeModal();const story=storyById(openStory.dataset.openStory);if(story)navigate('story',storyFirstRoute(story));return;}

/* === Firestore-safe shared image assets === */
const FIRESTORE_ASSET_COLLECTION = 'assets';
const FIRESTORE_ASSET_MAX_DATA_URL = 700000;
firebase.remoteCache.assets ||= new Map();
firebase.assetData ||= new Map();

function isInlineImageSource(value){
  return typeof value === 'string' && value.startsWith('data:image/');
}
function walkImageMedia(value,visit,seen=new WeakSet()){
  if(!value || typeof value !== 'object' || seen.has(value))return;
  seen.add(value);
  if(Array.isArray(value)){
    value.forEach(child=>walkImageMedia(child,visit,seen));
    return;
  }
  if(value.assetId || isInlineImageSource(value.src) || (value.type === 'image' && typeof value.src === 'string'))visit(value);
  for(const [key,child] of Object.entries(value)){
    if(key === 'src')continue;
    if(child && typeof child === 'object')walkImageMedia(child,visit,seen);
  }
}
function ensureImageAssetId(media){
  if(!media.assetId)media.assetId=id('asset');
  return media.assetId;
}
function imageAssetCollection(){
  return firebase.api.collection(firebaseWorkspaceRef(),FIRESTORE_ASSET_COLLECTION);
}
function imageAssetRef(assetId){
  return firebase.api.doc(imageAssetCollection(),String(assetId).replaceAll('/','_'));
}
function canvasDataUrl(canvas,quality){
  let data=canvas.toDataURL('image/webp',quality);
  if(!data.startsWith('data:image/webp'))data=canvas.toDataURL('image/jpeg',quality);
  return data;
}
async function loadImageSource(source){
  return await new Promise((resolve,reject)=>{
    const image=new Image();
    image.onload=()=>resolve(image);
    image.onerror=()=>reject(new Error('The image could not be opened.'));
    image.src=source;
  });
}
async function compressImageSource(source,targetLength=FIRESTORE_ASSET_MAX_DATA_URL,maxSide=1600){
  const image=await loadImageSource(source);
  let scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
  let width=Math.max(1,Math.round(image.naturalWidth*scale));
  let height=Math.max(1,Math.round(image.naturalHeight*scale));
  let quality=.82,data='';
  for(let attempt=0;attempt<12;attempt++){
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const context=canvas.getContext('2d',{alpha:true});
    context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';
    context.drawImage(image,0,0,width,height);
    data=canvasDataUrl(canvas,quality);
    if(data.length<=targetLength)return {data,width,height};
    if(quality>.52)quality=Math.max(.52,quality-.08);
    else{width=Math.max(420,Math.round(width*.84));height=Math.max(260,Math.round(height*.84));quality=.72;}
  }
  if(data.length>900000)throw new Error('This image is too detailed to prepare safely. Try a smaller image.');
  return {data,width,height};
}

imageFileToBlock=async function(file,character){
  if(!file || !file.type?.startsWith('image/'))throw new Error('Choose an image file.');
  if(file.size>18*1024*1024)throw new Error('That image is larger than 18 MB.');
  const source=await new Promise((resolve,reject)=>{
    const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('The image could not be read.'));reader.readAsDataURL(file);
  });
  const prepared=await compressImageSource(source);
  return {id:id('image'),type:'image',content:'',src:prepared.data,assetId:id('asset'),alt:`${character?.name||'World'} image`,layout:'front',wrapSide:'left',width:Math.min(360,prepared.width),padding:18,xPct:8,y:24,opacity:1,ratio:prepared.width/prepared.height};
};

async function collectStateImageAssets(){
  const assets=new Map();
  for(const kind of SYNC_COLLECTIONS){
    for(const item of state[kind]||[]){
      const mediaNodes=[];walkImageMedia(item,media=>mediaNodes.push(media));
      for(const media of mediaNodes){
        const assetId=media.assetId || (isInlineImageSource(media.src)?ensureImageAssetId(media):'');
        if(!assetId)continue;
        let dataUrl=isInlineImageSource(media.src)?media.src:(firebase.assetData.get(assetId)||'');
        if(dataUrl && dataUrl.length>FIRESTORE_ASSET_MAX_DATA_URL){
          const compressed=await compressImageSource(dataUrl);
          dataUrl=compressed.data;media.src=dataUrl;
        }
        assets.set(assetId,{assetId,dataUrl,ownerKind:kind,ownerId:item.id||'',updatedAt:item.updatedAt||nowISO()});
      }
    }
  }
  return assets;
}
function assetSafeClone(value){
  const clone=cleanFirestoreValue(value);
  walkImageMedia(clone,media=>{
    if(isInlineImageSource(media.src)){
      ensureImageAssetId(media);
      delete media.src;
    }
  });
  return clone;
}
function hydrateImageAssets(value){
  walkImageMedia(value,media=>{
    if(media.assetId){
      const dataUrl=firebase.assetData.get(media.assetId);
      if(dataUrl)media.src=dataUrl;
    }
  });
  return value;
}
function hydrateAllStateImages(){
  for(const kind of SYNC_COLLECTIONS)for(const item of state[kind]||[])hydrateImageAssets(item);
}
function comparableEntity(value){return JSON.stringify(assetSafeClone(value));}

loadRemoteWorkspace=async function(){
  const api=firebase.api,workspaceRef=firebaseWorkspaceRef();
  const [metaSnap,assetSnap,...collectionSnaps]=await Promise.all([
    api.getDoc(workspaceRef),api.getDocs(imageAssetCollection()),...SYNC_COLLECTIONS.map(kind=>api.getDocs(api.collection(workspaceRef,kind)))
  ]);
  firebase.assetData=new Map();firebase.remoteCache.assets=new Map();
  assetSnap.docs.forEach(docSnap=>{
    const raw=docSnap.data();
    if(raw.dataUrl)firebase.assetData.set(docSnap.id,raw.dataUrl);
    firebase.remoteCache.assets.set(docSnap.id,JSON.stringify(raw));
  });
  const next=deepClone(window.INITIAL_WORLD_DATA);
  if(metaSnap.exists())Object.assign(next,metaSnap.data());
  SYNC_COLLECTIONS.forEach((kind,i)=>{
    const docs=collectionSnaps[i].docs.map(docSnap=>{
      const raw=docSnap.data(),order=Number(raw.__order)||0;delete raw.__order;hydrateImageAssets(raw);return {value:raw,order};
    }).sort((a,b)=>a.order-b.order).map(entry=>entry.value);
    next[kind]=docs;
    firebase.remoteCache.collections[kind]=new Map(collectionSnaps[i].docs.map(docSnap=>[docSnap.id,JSON.stringify(docSnap.data())]));
  });
  firebase.remoteCache.meta=metaSnap.exists()?JSON.stringify(metaSnap.data()):'';
  const members=state.workspace?.members||[],access=state.workspace?.access||{};
  firebase.applyingRemote=true;state=next;normalizeState();state.workspace.members=members;state.workspace.access=access;hydrateAllStateImages();localStateSnapshot();firebase.applyingRemote=false;
};

syncStateToFirestore=async function(force=false){
  if(!firebase.connected||!firebase.user||firebase.applyingRemote||!canEditSharedWorld())return;
  const api=firebase.api,workspaceRef=firebaseWorkspaceRef(),operations=[];
  const assets=await collectStateImageAssets(),nextAssetIds=new Set();
  const assetCache=firebase.remoteCache.assets||new Map();
  for(const [assetId,asset] of assets){
    nextAssetIds.add(assetId);
    if(!asset.dataUrl)continue;
    const data={dataUrl:asset.dataUrl,ownerKind:asset.ownerKind,ownerId:asset.ownerId,updatedAt:asset.updatedAt};
    const json=JSON.stringify(data);
    if(force||assetCache.get(assetId)!==json){operations.push({type:'set',ref:imageAssetRef(assetId),data});assetCache.set(assetId,json);}
    firebase.assetData.set(assetId,asset.dataUrl);
  }
  for(const oldId of [...assetCache.keys()])if(!nextAssetIds.has(oldId)){
    operations.push({type:'delete',ref:imageAssetRef(oldId)});assetCache.delete(oldId);firebase.assetData.delete(oldId);
  }
  firebase.remoteCache.assets=assetCache;
  const meta=stateMetaPayload(),metaJson=JSON.stringify(meta);
  if(force||metaJson!==firebase.remoteCache.meta){operations.push({type:'set',ref:workspaceRef,data:meta});firebase.remoteCache.meta=metaJson;}
  for(const kind of SYNC_COLLECTIONS){
    const cache=firebase.remoteCache.collections[kind]||new Map(),nextIds=new Set();
    (state[kind]||[]).forEach((item,index)=>{
      const docId=String(item.id||id(kind)).replaceAll('/','_');if(!item.id)item.id=docId;nextIds.add(docId);
      const data=assetSafeClone({...item,__order:index}),json=JSON.stringify(data);
      if(force||cache.get(docId)!==json){operations.push({type:'set',ref:api.doc(api.collection(workspaceRef,kind),docId),data});cache.set(docId,json);}
    });
    for(const oldId of [...cache.keys()])if(!nextIds.has(oldId)){
      operations.push({type:'delete',ref:api.doc(api.collection(workspaceRef,kind),oldId)});cache.delete(oldId);
    }
    firebase.remoteCache.collections[kind]=cache;
  }
  if(operations.length)await commitFirestoreOperations(operations);
};

attachFirestoreListeners=function(){
  detachFirestoreListeners();const api=firebase.api,workspaceRef=firebaseWorkspaceRef();
  firebase.unsubscribes.push(api.onSnapshot(firebaseMembersCollection(),{includeMetadataChanges:true},snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const members=snap.docs.map(docSnap=>({id:docSnap.id,...docSnap.data()})).sort((a,b)=>{
      const order={Owner:0,Admin:1,Editor:2,Commenter:3,Viewer:4};return (order[a.role]??9)-(order[b.role]??9)||a.email.localeCompare(b.email);
    });
    state.workspace.members=members;state.workspace.access=Object.fromEntries(members.map(member=>[normalizeMemberEmail(member.email),member.role]));
    firebase.currentMember=members.find(member=>normalizeMemberEmail(member.email)===normalizeMemberEmail(firebase.user?.email))||null;
    firebase.currentRole=firebase.currentMember?.role||'';localStateSnapshot();render();
  },error=>{console.error(error);toast('Member access updates stopped. Check the Firestore rules.','error');}));
  firebase.unsubscribes.push(api.onSnapshot(workspaceRef,{includeMetadataChanges:true},snap=>{
    if(!snap.exists()||snap.metadata.hasPendingWrites)return;const data=snap.data(),json=JSON.stringify(data);firebase.remoteCache.meta=json;
    if(json===JSON.stringify(stateMetaPayload()))return;applyRemoteMeta(data);queueRemoteRender();
  },error=>{console.error(error);toast('Live workspace updates stopped. Check the Firestore rules.','error');}));
  firebase.unsubscribes.push(api.onSnapshot(imageAssetCollection(),{includeMetadataChanges:true},snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const nextData=new Map(),nextCache=new Map();
    snap.docs.forEach(docSnap=>{const raw=docSnap.data();if(raw.dataUrl)nextData.set(docSnap.id,raw.dataUrl);nextCache.set(docSnap.id,JSON.stringify(raw));});
    firebase.assetData=nextData;firebase.remoteCache.assets=nextCache;firebase.applyingRemote=true;hydrateAllStateImages();firebase.applyingRemote=false;localStateSnapshot();queueRemoteRender();
  },error=>{console.error(error);toast('Shared images stopped syncing. Publish the updated Firestore rules.','error');}));
  for(const kind of SYNC_COLLECTIONS){
    firebase.unsubscribes.push(api.onSnapshot(api.collection(workspaceRef,kind),{includeMetadataChanges:true},snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const entries=snap.docs.map(docSnap=>{
        const raw=docSnap.data(),json=JSON.stringify(raw),order=Number(raw.__order)||0;
        firebase.remoteCache.collections[kind].set(docSnap.id,json);delete raw.__order;hydrateImageAssets(raw);return {value:raw,order};
      }).sort((a,b)=>a.order-b.order);
      const incoming=entries.map(x=>x.value);
      const incomingComparable=JSON.stringify(incoming.map(value=>assetSafeClone(value)));
      const localComparable=JSON.stringify((state[kind]||[]).map(value=>assetSafeClone(value)));
      if(incomingComparable===localComparable)return;
      firebase.applyingRemote=true;state[kind]=incoming;firebase.applyingRemote=false;queueRemoteRender();
    },error=>{console.error(error);toast(`Live ${kind} updates stopped.`,'error');}));
  }
};

function browserSafeWorkspaceSnapshot(){
  // Images live in the shared Firestore assets collection. Keep only their
  // asset IDs in the browser cache so localStorage never fills with data URLs.
  return assetSafeClone(state);
}
function writeBrowserWorkspaceSnapshot(){
  const payload=JSON.stringify(browserSafeWorkspaceSnapshot());
  try{
    localStorage.setItem(STORAGE_KEY,payload);
    return true;
  }catch(error){
    // A legacy build may already have filled the quota with embedded images.
    // Remove that oversized copy and retry with the image-free snapshot.
    try{
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem(STORAGE_KEY,payload);
      return true;
    }catch(retryError){
      console.warn('Local workspace cache is unavailable. Firestore sync will continue.',retryError);
      return false;
    }
  }
}
localStateSnapshot=function(){
  writeBrowserWorkspaceSnapshot();
};

saveState=async function(){
  if(firebase.connected&&firebase.user&&!firebase.applyingRemote&&!canEditSharedWorld()){
    el.saveStatus.textContent='Read only';
    try{await loadRemoteWorkspace();render();}catch(error){console.error(error);}
    toast('Your current role is read-only. Ask an owner to change your access.','error');
    return;
  }

  const localSaved=writeBrowserWorkspaceSnapshot();
  el.saveStatus.textContent=firebase.connected?'Syncing…':(localSaved?'Saved locally':'Local cache unavailable');

  if(firebase.connected&&firebase.user&&!firebase.applyingRemote){
    try{
      await syncStateToFirestore();
      el.saveStatus.textContent='Synced';
    }catch(error){
      el.saveStatus.textContent='Sync failed';
      console.error(error);
      toast(error.code==='permission-denied'
        ? 'Your role does not allow this change, or the Firestore rules need updating.'
        : 'The workspace could not sync.','error');
    }
  }else if(!localSaved){
    toast('This browser could not keep an offline cache. Sign in to save changes online.','error');
  }
};

/* === Ordered collaboration saves, conflict merging, and recovery copies === */
(function(){
  const RECOVERY_COLLECTION='recovery';
  const LOCAL_RECOVERY_KEY='codex-canvas-local-recovery-v1';
  const originalSyncStateToFirestore=syncStateToFirestore;

  firebase.saveChain=Promise.resolve();
  firebase.saveRequest=0;
  firebase.saveActive=false;
  firebase.editBases={meta:undefined,collections:{}};
  for(const kind of SYNC_COLLECTIONS)firebase.editBases.collections[kind]=new Map();

  function recoveryCollection(){return firebase.api.collection(firebaseWorkspaceRef(),RECOVERY_COLLECTION);}
  function recoveryRef(key){return firebase.api.doc(recoveryCollection(),String(key).replaceAll('/','_'));}
  function parseJson(value,fallback=null){try{return value==null?fallback:JSON.parse(value);}catch(error){return fallback;}}
  function stripSyncFields(value){
    const copy=assetSafeClone(value);
    if(copy&&typeof copy==='object'){
      delete copy.__syncRevision;delete copy.__syncUpdatedAt;delete copy.__syncUpdatedBy;
    }
    return copy;
  }
  function logicalJson(value){return JSON.stringify(stripSyncFields(value));}
  function valuesEqual(a,b){return JSON.stringify(a)===JSON.stringify(b);}
  function threeWayMerge(base,local,remote){
    const cleanBase=stripSyncFields(base||{}),cleanLocal=stripSyncFields(local||{}),cleanRemote=stripSyncFields(remote||{});
    const merged={...cleanRemote};const conflicts=[];
    const keys=new Set([...Object.keys(cleanBase),...Object.keys(cleanLocal),...Object.keys(cleanRemote)]);
    for(const key of keys){
      const b=cleanBase[key],l=cleanLocal[key],r=cleanRemote[key];
      if(valuesEqual(l,b))merged[key]=r;
      else if(valuesEqual(r,b)||valuesEqual(l,r))merged[key]=l;
      else{merged[key]=l;conflicts.push(key);}
      if(merged[key]===undefined)delete merged[key];
    }
    return {merged,conflicts};
  }
  function localRecoverySnapshot(label='Unsynced edits'){
    try{
      const snapshot={id:`recovery-${Date.now()}`,savedAt:nowISO(),savedBy:firebase.user?.email||'',label,state:browserSafeWorkspaceSnapshot()};
      const current=parseJson(localStorage.getItem(LOCAL_RECOVERY_KEY),[]);
      const latest=Array.isArray(current)?current:[];
      const json=JSON.stringify(snapshot.state);
      if(latest[0]&&JSON.stringify(latest[0].state)===json)return;
      latest.unshift(snapshot);
      while(latest.length>4)latest.pop();
      localStorage.setItem(LOCAL_RECOVERY_KEY,JSON.stringify(latest));
    }catch(error){console.warn('A local recovery copy could not be created.',error);}
  }
  function captureEditBases(){
    const metaJson=JSON.stringify(stateMetaPayload());
    if(metaJson!==logicalJson(parseJson(firebase.remoteCache.meta,{}))&&firebase.editBases.meta===undefined){
      firebase.editBases.meta=firebase.remoteCache.meta||null;
    }
    for(const kind of SYNC_COLLECTIONS){
      const bases=firebase.editBases.collections[kind],cache=firebase.remoteCache.collections[kind]||new Map();
      const localIds=new Set();
      (state[kind]||[]).forEach((item,index)=>{
        const docId=String(item.id||id(kind)).replaceAll('/','_');if(!item.id)item.id=docId;localIds.add(docId);
        const local=assetSafeClone({...item,__order:index});
        const remoteRaw=cache.get(docId)||null;
        if(logicalJson(local)!==logicalJson(parseJson(remoteRaw,{}))&&!bases.has(docId))bases.set(docId,remoteRaw);
      });
      for(const [oldId,oldJson] of cache)if(!localIds.has(oldId)&&!bases.has(oldId))bases.set(oldId,oldJson);
    }
  }

  scheduleSave=function(message='Saving…'){
    el.saveStatus.textContent=message;
    captureEditBases();
    localRecoverySnapshot('Before shared save');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(saveState,450);
  };

  async function transactionalSet(ref,baseJson,localData,recoveryKey,kind,documentId){
    const api=firebase.api,email=normalizeMemberEmail(firebase.user?.email),savedAt=nowISO();let committed=null;
    await api.runTransaction(api.db,async transaction=>{
      const snap=await transaction.get(ref),remote=snap.exists()?snap.data():null,base=parseJson(baseJson,null);
      const merge=remote&&base&&logicalJson(remote)!==logicalJson(base)?threeWayMerge(base,localData,remote):{merged:stripSyncFields(localData),conflicts:[]};
      const revision=(Number(remote?.__syncRevision)||0)+1;
      committed={...merge.merged,__syncRevision:revision,__syncUpdatedAt:savedAt,__syncUpdatedBy:email};
      if(remote&&logicalJson(remote)!==logicalJson(committed)){
        transaction.set(recoveryRef(recoveryKey),{
          kind,documentId,previous:stripSyncFields(remote),replacement:stripSyncFields(committed),conflicts:merge.conflicts,
          savedAt,savedBy:email,action:'update'
        },{merge:false});
      }
      transaction.set(ref,committed,{merge:false});
    });
    return committed;
  }
  async function transactionalDelete(ref,baseJson,recoveryKey,kind,documentId){
    const api=firebase.api,email=normalizeMemberEmail(firebase.user?.email),savedAt=nowISO();
    await api.runTransaction(api.db,async transaction=>{
      const snap=await transaction.get(ref);if(!snap.exists())return;
      const remote=snap.data();
      transaction.set(recoveryRef(recoveryKey),{kind,documentId,previous:stripSyncFields(remote),replacement:null,conflicts:[],savedAt,savedBy:email,action:'delete'},{merge:false});
      transaction.delete(ref);
    });
  }

  syncStateToFirestore=async function(force=false){
    if(force)return originalSyncStateToFirestore(true);
    if(!firebase.connected||!firebase.user||firebase.applyingRemote||!canEditSharedWorld())return;
    const api=firebase.api,workspaceRef=firebaseWorkspaceRef();

    // Assets use unique IDs, so ordered batching is sufficient for them.
    const assets=await collectStateImageAssets(),nextAssetIds=new Set(),assetCache=firebase.remoteCache.assets||new Map(),assetOps=[],nextAssetCache=new Map(assetCache);
    for(const [assetId,asset] of assets){
      nextAssetIds.add(assetId);if(!asset.dataUrl)continue;
      const data={dataUrl:asset.dataUrl,ownerKind:asset.ownerKind,ownerId:asset.ownerId,updatedAt:asset.updatedAt},json=JSON.stringify(data);
      if(assetCache.get(assetId)!==json){assetOps.push({type:'set',ref:imageAssetRef(assetId),data});nextAssetCache.set(assetId,json);}
      firebase.assetData.set(assetId,asset.dataUrl);
    }
    for(const oldId of [...assetCache.keys()])if(!nextAssetIds.has(oldId)){
      assetOps.push({type:'delete',ref:imageAssetRef(oldId)});nextAssetCache.delete(oldId);firebase.assetData.delete(oldId);
    }
    if(assetOps.length)await commitFirestoreOperations(assetOps);
    firebase.remoteCache.assets=nextAssetCache;

    const meta=stateMetaPayload();
    if(JSON.stringify(meta)!==logicalJson(parseJson(firebase.remoteCache.meta,{}))){
      const base=firebase.editBases.meta===undefined?firebase.remoteCache.meta:firebase.editBases.meta;
      const committed=await transactionalSet(workspaceRef,base,meta,'workspace-meta','workspace','main');
      firebase.remoteCache.meta=JSON.stringify(committed);firebase.editBases.meta=undefined;
    }

    for(const kind of SYNC_COLLECTIONS){
      const cache=firebase.remoteCache.collections[kind]||new Map(),bases=firebase.editBases.collections[kind],nextIds=new Set();
      for(const [index,item] of (state[kind]||[]).entries()){
        const docId=String(item.id||id(kind)).replaceAll('/','_');if(!item.id)item.id=docId;nextIds.add(docId);
        const localData=assetSafeClone({...item,__order:index}),remoteJson=cache.get(docId)||null;
        if(logicalJson(localData)===logicalJson(parseJson(remoteJson,{})))continue;
        const base=bases.has(docId)?bases.get(docId):remoteJson;
        const ref=api.doc(api.collection(workspaceRef,kind),docId);
        const committed=await transactionalSet(ref,base,localData,`${kind}-${docId}`,kind,docId);
        cache.set(docId,JSON.stringify(committed));bases.delete(docId);
      }
      for(const oldId of [...cache.keys()])if(!nextIds.has(oldId)){
        const base=bases.has(oldId)?bases.get(oldId):cache.get(oldId);
        await transactionalDelete(api.doc(api.collection(workspaceRef,kind),oldId),base,`${kind}-${oldId}`,kind,oldId);
        cache.delete(oldId);bases.delete(oldId);
      }
      firebase.remoteCache.collections[kind]=cache;
    }
  };

  saveState=function(){
    if(firebase.connected&&firebase.user&&!firebase.applyingRemote&&!canEditSharedWorld()){
      el.saveStatus.textContent='Read only';toast('Your current role is read-only. Ask an owner to change your access.','error');return;
    }
    const localSaved=writeBrowserWorkspaceSnapshot();
    el.saveStatus.textContent=firebase.connected?'Waiting to sync…':(localSaved?'Saved locally':'Local cache unavailable');
    if(!firebase.connected||!firebase.user||firebase.applyingRemote)return;
    const request=++firebase.saveRequest;
    firebase.saveChain=firebase.saveChain.catch(error=>console.error(error)).then(async()=>{
      if(request<firebase.saveRequest)return;
      firebase.saveActive=true;el.saveStatus.textContent='Syncing…';
      try{
        await syncStateToFirestore();
        writeBrowserWorkspaceSnapshot();
        el.saveStatus.textContent='Synced';
      }catch(error){
        console.error(error);el.saveStatus.textContent='Sync failed';localRecoverySnapshot('Sync failed');
        toast(error.code==='permission-denied'?'Your role does not allow this change, or the Firestore rules need updating.':'The workspace could not sync. A recovery copy was kept in this browser.','error');
      }finally{firebase.saveActive=false;}
    });
  };

  // Preserve unsaved local entities while remote snapshots arrive. The original
  // remote version remains in remoteCache and is used as the merge base.
  attachFirestoreListeners=function(){
    detachFirestoreListeners();const api=firebase.api,workspaceRef=firebaseWorkspaceRef();
    firebase.unsubscribes.push(api.onSnapshot(firebaseMembersCollection(),{includeMetadataChanges:true},snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const members=snap.docs.map(docSnap=>({id:docSnap.id,...docSnap.data()})).sort((a,b)=>{const order={Owner:0,Admin:1,Editor:2,Commenter:3,Viewer:4};return (order[a.role]??9)-(order[b.role]??9)||a.email.localeCompare(b.email);});
      state.workspace.members=members;state.workspace.access=Object.fromEntries(members.map(member=>[normalizeMemberEmail(member.email),member.role]));
      firebase.currentMember=members.find(member=>normalizeMemberEmail(member.email)===normalizeMemberEmail(firebase.user?.email))||null;firebase.currentRole=firebase.currentMember?.role||'';localStateSnapshot();render();
    },error=>{console.error(error);toast('Member access updates stopped. Check the Firestore rules.','error');}));
    firebase.unsubscribes.push(api.onSnapshot(workspaceRef,{includeMetadataChanges:true},snap=>{
      if(!snap.exists()||snap.metadata.hasPendingWrites)return;const data=snap.data(),json=JSON.stringify(data);firebase.remoteCache.meta=json;
      if(firebase.editBases.meta!==undefined)return;
      if(logicalJson(data)===JSON.stringify(stateMetaPayload()))return;applyRemoteMeta(stripSyncFields(data));queueRemoteRender();
    },error=>{console.error(error);toast('Live workspace updates stopped. Check the Firestore rules.','error');}));
    firebase.unsubscribes.push(api.onSnapshot(imageAssetCollection(),{includeMetadataChanges:true},snap=>{
      if(snap.metadata.hasPendingWrites)return;const nextData=new Map(),nextCache=new Map();
      snap.docs.forEach(docSnap=>{const raw=docSnap.data();if(raw.dataUrl)nextData.set(docSnap.id,raw.dataUrl);nextCache.set(docSnap.id,JSON.stringify(raw));});
      firebase.assetData=nextData;firebase.remoteCache.assets=nextCache;firebase.applyingRemote=true;hydrateAllStateImages();firebase.applyingRemote=false;localStateSnapshot();queueRemoteRender();
    },error=>{console.error(error);toast('Shared images stopped syncing. Publish the updated Firestore rules.','error');}));
    for(const kind of SYNC_COLLECTIONS){
      firebase.unsubscribes.push(api.onSnapshot(api.collection(workspaceRef,kind),{includeMetadataChanges:true},snap=>{
        if(snap.metadata.hasPendingWrites)return;
        const bases=firebase.editBases.collections[kind],localMap=new Map((state[kind]||[]).map(item=>[String(item.id).replaceAll('/','_'),item]));
        const entries=snap.docs.map(docSnap=>{
          const raw=docSnap.data(),json=JSON.stringify(raw),order=Number(raw.__order)||0;firebase.remoteCache.collections[kind].set(docSnap.id,json);
          if(bases.has(docSnap.id)&&localMap.has(docSnap.id))return {value:localMap.get(docSnap.id),order:Number(localMap.get(docSnap.id).__order)||order,dirty:true};
          delete raw.__order;hydrateImageAssets(raw);return {value:stripSyncFields(raw),order};
        });
        const remoteIds=new Set(snap.docs.map(doc=>doc.id));
        for(const [docId,item] of localMap)if(bases.has(docId)&&!remoteIds.has(docId))entries.push({value:item,order:(state[kind]||[]).indexOf(item),dirty:true});
        entries.sort((a,b)=>a.order-b.order);
        const incoming=entries.map(x=>x.value),incomingComparable=JSON.stringify(incoming.map(value=>assetSafeClone(value))),localComparable=JSON.stringify((state[kind]||[]).map(value=>assetSafeClone(value)));
        if(incomingComparable===localComparable)return;firebase.applyingRemote=true;state[kind]=incoming;firebase.applyingRemote=false;queueRemoteRender();
      },error=>{console.error(error);toast(`Live ${kind} updates stopped.`,'error');}));
    }
  };

  async function showRecoveryCopies(){
    if(!firebase.connected||!firebase.user){toast('Sign in to view recovery copies.','error');return;}
    try{
      const snap=await firebase.api.getDocs(recoveryCollection());
      const records=snap.docs.map(doc=>({id:doc.id,...doc.data()})).sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')));
      const localCopies=parseJson(localStorage.getItem(LOCAL_RECOVERY_KEY),[]);
      const remoteHtml=records.length?records.map(record=>{
        const previous=record.previous||{},name=previous.name||record.documentId||'Workspace';
        return `<div class="member-row"><div><strong>${esc(name)}</strong><div class="member-email">${esc(record.kind)} · ${esc(record.savedAt||'')} · replaced by ${esc(record.savedBy||'another member')}${record.conflicts?.length?` · conflicting fields: ${esc(record.conflicts.join(', '))}`:''}</div></div><button class="button secondary small" type="button" data-restore-remote-recovery="${esc(record.id)}">Restore previous</button></div>`;
      }).join(''):'<p class="page-subtitle">No shared recovery copies have been created yet.</p>';
      const localHtml=Array.isArray(localCopies)&&localCopies.length?localCopies.map(copy=>`<div class="member-row"><div><strong>${esc(copy.label||'Browser recovery')}</strong><div class="member-email">${esc(copy.savedAt||'')} · ${esc(copy.savedBy||'this browser')}</div></div><button class="button secondary small" type="button" data-restore-local-recovery="${esc(copy.id)}">Restore copy</button></div>`).join(''):'<p class="page-subtitle">No browser recovery copies are available.</p>';
      showModal('Recovery copies',`<h3>Shared item recovery</h3><div class="member-list">${remoteHtml}</div><h3 style="margin-top:22px">This browser</h3><div class="member-list">${localHtml}</div>`,`<button class="button secondary" type="button" data-close-modal>Close</button>`);
    }catch(error){console.error(error);toast('Recovery copies could not be loaded. Publish the updated Firestore rules.','error');}
  }
  const baseRenderSettings=renderSettings;
  renderSettings=function(){
    baseRenderSettings();
    document.querySelector('.settings-grid')?.insertAdjacentHTML('beforeend',`<section class="settings-card"><h2>Recovery copies</h2><p class="page-subtitle">Codex Canvas keeps the previous shared version of an item when it is overwritten, plus several recent browser snapshots.</p><button class="button secondary" type="button" data-open-recovery-copies>View recovery copies</button></section>`);
  };
  document.addEventListener('click',async event=>{
    const open=event.target.closest('[data-open-recovery-copies]');if(open){event.preventDefault();await showRecoveryCopies();return;}
    const remoteButton=event.target.closest('[data-restore-remote-recovery]');if(remoteButton){
      event.preventDefault();const snap=await firebase.api.getDoc(recoveryRef(remoteButton.dataset.restoreRemoteRecovery));if(!snap.exists())return;
      const record=snap.data(),previous=record.previous;if(!previous)return;
      if(record.kind==='workspace'){applyRemoteMeta(previous);}else if(SYNC_COLLECTIONS.includes(record.kind)){
        const index=(state[record.kind]||[]).findIndex(item=>String(item.id).replaceAll('/','_')===record.documentId);
        const restored=stripSyncFields(previous);delete restored.__order;hydrateImageAssets(restored);
        if(index>=0)state[record.kind][index]=restored;else state[record.kind].push(restored);
      }
      localRecoverySnapshot('Before recovery restore');captureEditBases();scheduleSave('Restoring previous version…');closeModal();render();toast('The previous version was restored and is syncing.');return;
    }
    const localButton=event.target.closest('[data-restore-local-recovery]');if(localButton){
      event.preventDefault();const copies=parseJson(localStorage.getItem(LOCAL_RECOVERY_KEY),[]),copy=copies.find(item=>item.id===localButton.dataset.restoreLocalRecovery);if(!copy)return;
      localRecoverySnapshot('Before browser recovery restore');firebase.applyingRemote=true;state=deepClone(copy.state);normalizeState();hydrateAllStateImages();firebase.applyingRemote=false;captureEditBases();scheduleSave('Restoring browser recovery…');closeModal();render();toast('The browser recovery copy was restored and is syncing.');
    }
  },true);
})();

</script>



<style id="codex-save-lock-styles">
  .save-lock-overlay{
    position:fixed;inset:0;z-index:100000;display:none;place-items:center;
    padding:24px;background:rgba(8,14,22,.76);backdrop-filter:blur(10px);
  }
  .save-lock-overlay.is-visible{display:grid}
  .save-lock-card{
    width:min(430px,calc(100vw - 36px));box-sizing:border-box;text-align:center;
    border:1px solid rgba(217,181,110,.46);border-radius:26px;padding:34px 30px;
    color:#f8eedc;background:linear-gradient(155deg,#101a27,#0d1520 68%,#17130e);
    box-shadow:0 32px 100px rgba(0,0,0,.52)
  }
  .save-lock-mark{
    width:64px;height:64px;margin:0 auto 19px;border-radius:21px;display:grid;place-items:center;
    border:1px solid rgba(217,181,110,.48);background:rgba(217,181,110,.09);color:#ddb566;
    font:700 27px Georgia,serif
  }
  .save-lock-spinner{
    width:28px;height:28px;border:3px solid rgba(221,181,102,.24);border-top-color:#ddb566;
    border-radius:50%;animation:codexSaveSpin .8s linear infinite
  }
  .save-lock-check{font-size:30px;line-height:1;color:#b9e1c3}
  .save-lock-error{font-size:30px;line-height:1;color:#ffb6b6}
  .save-lock-card h2{margin:0;font:700 28px Georgia,serif;color:#fff6e8}
  .save-lock-card p{margin:10px auto 0;max-width:340px;line-height:1.55;color:#adb9c7}
  .save-lock-detail{font-size:.83rem!important;color:#8290a0!important}
  .save-lock-actions{display:none;margin-top:22px}
  .save-lock-overlay.is-error .save-lock-actions{display:block}
  .save-lock-actions button{
    border:1px solid rgba(221,181,102,.55);border-radius:12px;padding:11px 16px;
    background:#ddb566;color:#17120b;font:800 .94rem Inter,system-ui,sans-serif;cursor:pointer
  }
  body.is-save-locked{overflow:hidden}
  @keyframes codexSaveSpin{to{transform:rotate(360deg)}}
  @media(max-width:600px){.save-lock-card{padding:29px 22px;border-radius:22px}.save-lock-card h2{font-size:25px}}
  @media(prefers-reduced-motion:reduce){.save-lock-spinner{animation-duration:1.6s}}
</style>

<div id="saveLockOverlay" class="save-lock-overlay" role="status" aria-live="assertive" aria-modal="true" aria-hidden="true">
  <div class="save-lock-card">
    <div id="saveLockIcon" class="save-lock-mark"><span class="save-lock-spinner" aria-hidden="true"></span></div>
    <h2 id="saveLockTitle">Saving your world…</h2>
    <p id="saveLockMessage">Please wait. Editing will unlock after Firestore confirms the newest version.</p>
    <p id="saveLockDetail" class="save-lock-detail">Keep this tab open while the save finishes.</p>
    <div class="save-lock-actions"><button id="saveLockDismiss" type="button">Return to workspace</button></div>
  </div>
</div>

<script id="codex-save-lock-controller">
(() => {
  const overlay = document.getElementById('saveLockOverlay');
  const icon = document.getElementById('saveLockIcon');
  const title = document.getElementById('saveLockTitle');
  const message = document.getElementById('saveLockMessage');
  const detail = document.getElementById('saveLockDetail');
  const dismiss = document.getElementById('saveLockDismiss');
  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modalRoot');
  const status = document.getElementById('saveStatus');
  let hideTimer = 0;
  let longSaveTimer = 0;

  function lockSurface() {
    clearTimeout(hideTimer);
    clearTimeout(longSaveTimer);
    overlay.classList.remove('is-error');
    overlay.classList.add('is-visible');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('is-save-locked');
    if (app) app.inert = true;
    if (modalRoot) modalRoot.inert = true;
    document.activeElement?.blur?.();
    icon.innerHTML = '<span class="save-lock-spinner" aria-hidden="true"></span>';
    title.textContent = 'Saving your world…';
    message.textContent = 'Please wait. Editing will unlock after Firestore confirms the newest version.';
    detail.textContent = 'Keep this tab open while the save finishes.';
    longSaveTimer = setTimeout(() => {
      if (!overlay.classList.contains('is-visible') || overlay.classList.contains('is-error')) return;
      detail.textContent = 'This save is taking a little longer, but Codex Canvas is still waiting for confirmation.';
    }, 7000);
  }

  function unlockSurface() {
    clearTimeout(longSaveTimer);
    overlay.classList.remove('is-visible', 'is-error');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('is-save-locked');
    if (app) app.inert = false;
    if (modalRoot) modalRoot.inert = false;
  }

  function showSaved() {
    if (!overlay.classList.contains('is-visible')) return;
    clearTimeout(longSaveTimer);
    icon.innerHTML = '<span class="save-lock-check" aria-hidden="true">✓</span>';
    title.textContent = 'Saved';
    message.textContent = 'Your newest changes are safely synced to the shared world.';
    detail.textContent = 'Editing will reopen now.';
    hideTimer = setTimeout(unlockSurface, 500);
  }

  function showError() {
    clearTimeout(longSaveTimer);
    clearTimeout(hideTimer);
    overlay.classList.add('is-visible', 'is-error');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('is-save-locked');
    if (app) app.inert = true;
    if (modalRoot) modalRoot.inert = true;
    icon.innerHTML = '<span class="save-lock-error" aria-hidden="true">!</span>';
    title.textContent = 'The save did not finish';
    message.textContent = 'A recovery copy may still be available, but these changes are not confirmed in the shared world.';
    detail.textContent = 'Return to the workspace only after noting what you changed, then retry or download a backup.';
  }

  function reactToStatus() {
    const value = (status?.textContent || '').trim().toLowerCase();
    if (!app || app.hidden) return;
    if (value.includes('waiting to sync') || value === 'syncing…' || value === 'syncing...') {
      lockSurface();
      return;
    }
    if (value === 'synced') {
      showSaved();
      return;
    }
    if (value.includes('sync failed') || value.includes('save failed')) {
      showError();
      return;
    }
    if (value.includes('read only') || value.includes('saved locally') || value.includes('local cache unavailable')) {
      unlockSurface();
    }
  }

  dismiss.addEventListener('click', unlockSurface);
  if (status) new MutationObserver(reactToStatus).observe(status, {childList:true, characterData:true, subtree:true});
  window.addEventListener('pageshow', reactToStatus);
})();
</script>
