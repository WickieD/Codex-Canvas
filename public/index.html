        <input type="file" accept="image/*" hidden data-character-media-input="${esc(ref)}">
      </div>
    </article>`;
  }

  function renderPracticalDossier(item) {
    const locationText = locationNames(item.currentLocationIds).join(', ');
    const occupation = item.occupation || item.role || '';
    const coverMedia = item.headerImage;
    return `<section class="practical-dossier-page" data-dossier-character="${item.id}" data-dossier-theme="${esc(item.dossierTheme||'classic-parchment')}" style="${dossierThemeStyle(item)}">
      <div class="dossier-topbar"><div class="dossier-template-name"><span>Template:</span>${dossierLabelButton(item,'templateName','template-title')}</div><div class="dossier-top-actions"><button class="button secondary small" type="button" data-dossier-theme-picker="${item.id}">Colors: ${esc(dossierThemeName(item))}</button><button class="button secondary small" type="button" data-dossier-labels="${item.id}">Rename labels</button><button class="button secondary small" type="button" data-character-template-picker="${item.id}">Change template</button><button class="button small" type="button" data-dossier-edit="${item.id}:tagline:${encodeURIComponent('Subtitle / tagline')}">Edit subtitle</button></div></div>
      <div class="dossier-cover">
        <div class="dossier-cover-meta">${dossierLabelButton(item,'coverTitle','cover-title')}<span>${dossierLabelButton(item,'coverHelp','cover-help')}</span></div>
        ${coverMedia?.src ? `<div class="character-cover-slot has-image" data-character-media-select="header:${item.id}" data-character-media-drop="header:${item.id}" tabindex="0" role="button" aria-label="Select the cover image for ${esc(item.name)}"><img src="${esc(coverMedia.src)}" alt="${esc(coverMedia.alt || `${item.name} cover image`)}" style="${characterMediaStyle(coverMedia,'header')}"><button class="dossier-media-edit" type="button" data-character-media-edit="header:${item.id}">Edit cover</button><input type="file" accept="image/*" hidden data-character-media-input="header:${item.id}"></div>` : `<div class="dossier-cover-placeholder"><button class="character-cover-upload" type="button" data-character-media-trigger="header:${item.id}"><span><strong>Add ${esc(dossierLabel(item,'coverTitle'))}</strong><span>${esc(dossierLabel(item,'coverHelp'))}</span></span></button><input type="file" accept="image/*" hidden data-character-media-input="header:${item.id}"></div>`}
      </div>
      <div class="dossier-identity">
        <div class="dossier-name-wrap"><textarea class="dossier-title-input entity-title-input" rows="1" aria-label="Character name" data-title-kind="characters" data-title-id="${item.id}">${esc(item.name)}</textarea><div class="dossier-tagline">${esc(item.tagline || item.mood || 'Add a short character description')}</div></div>
        <div class="dossier-stat">${dossierLabelButton(item,'age','dossier-stat-label')}<button class="dossier-stat-value" type="button" data-dossier-edit="${item.id}:age:${encodeURIComponent(dossierLabel(item,'age'))}">${esc(item.age || 'Not set')}</button></div>
        <div class="dossier-stat">${dossierLabelButton(item,'speciesRace','dossier-stat-label')}<button class="dossier-stat-value" type="button" data-dossier-edit="${item.id}:speciesRace:${encodeURIComponent(dossierLabel(item,'speciesRace'))}">${esc(item.speciesRace || 'Not set')}</button></div>
        <div class="dossier-stat">${dossierLabelButton(item,'alignment','dossier-stat-label')}<button class="dossier-stat-value" type="button" data-dossier-edit="${item.id}:alignment:${encodeURIComponent(dossierLabel(item,'alignment'))}">${esc(item.alignment || 'Not set')}</button></div>
        <div class="dossier-stat">${dossierLabelButton(item,'occupation','dossier-stat-label')}<button class="dossier-stat-value" type="button" data-dossier-edit="${item.id}:occupation:${encodeURIComponent(dossierLabel(item,'occupation'))}">${esc(occupation || 'Not set')}</button></div>
      </div>
      <div class="dossier-body">
        <div class="dossier-image-grid">
          ${renderDossierMediaSlot(item,'dossierMain','mainPortrait','mainPortraitHelp','main')}
          ${renderDossierMediaSlot(item,'dossierProfile','profileView','profileViewHelp','center')}
          <div class="dossier-side-stack">${renderDossierMediaSlot(item,'dossierDetail','detailView','detailViewHelp','side')}${renderDossierMediaSlot(item,'profile','currentPortrait','currentPortraitHelp','side')}</div>
        </div>
        <div class="dossier-content-grid">
          <div class="dossier-main-column">
            ${renderDossierSection(item,'personality','personality',dossierText(item.personality,'Add the character’s temperament, habits, and emotional style.'))}
            ${renderDossierSection(item,'backstory','backstory',dossierText(item.backstory || item.notes,'Add the character’s history and the experiences that shaped them.'))}
            <div class="dossier-two-column">${renderDossierSection(item,'strengths','strengths',dossierBullets(item.strengths,'Add strengths'))}${renderDossierSection(item,'weaknesses','weaknesses',dossierBullets(item.weaknesses,'Add weaknesses'))}</div>
            ${renderDossierSection(item,'skillsAbilities','skillsAbilities',dossierBullets(item.skillsAbilities,'Add skills, abilities, training, or practical expertise.'))}
            ${renderDossierSection(item,'relationshipsText','relationships',dossierText(item.relationshipsText,'Add allies, family, rivals, clients, mentors, or other important connections.'))}
          </div>
          <div class="dossier-side-column">
            ${renderDossierSection(item,'traits','traits',dossierChipMarkup(item.traits,'Add traits'))}
            ${renderDossierSection(item,'reputationCode','reputationCode',dossierChipMarkup(item.reputationCode,'Add principles, rules, or reputation notes.'))}
            ${renderDossierSection(item,'distinguishingFeatures','distinguishingFeatures',dossierText(item.distinguishingFeatures,'Add scars, tusks, clothing, markings, mannerisms, or other identifying details.'))}
            ${renderDossierSection(item,'motivations','motivations',dossierChipMarkup(item.motivations,'Add motivations or principles.'))}
            ${renderDossierSection(item,'notes','notes',dossierBullets(item.notes,'Add useful character notes.'))}
          </div>
        </div>
        <div class="dossier-footer-grid">${renderDossierSection(item,'quote','quote',dossierText(item.quote,'Add a line that sounds like this character.'))}${renderDossierSection(item,'tags','tags',dossierChipMarkup(item.tags,'Add tags'))}<section class="dossier-section"><h3>${dossierLabelButton(item,'currentDetails')}</h3><p>${esc([item.status, item.mood, item.outfit, locationText].filter(Boolean).join(' · ') || 'No current details set.')}</p></section></div>
        <details class="dossier-additional"><summary><span>${esc(dossierLabel(item,'additionalWriting'))}</span><button class="dossier-summary-rename" type="button" data-dossier-label-edit="${item.id}:additionalWriting" title="Rename this section">Rename</button></summary><div class="editor-surface character-editor-surface">${renderBlockEditor('characters',item.id,item.blocks,item.name)}</div></details>
      </div>
    </section>`;
  }

  function showDossierFieldEditor(characterId, field, label) {
    const item = getItem('characters', characterId);
    if (!item) return;
    const listField = ['strengths','weaknesses','skillsAbilities','notes'].includes(field);
    const chipField = ['traits','reputationCode','motivations','tags'].includes(field);
    const help = listField ? 'Put each item on its own line.' : chipField ? 'Separate items with commas.' : 'Write the text exactly as you want it shown in the dossier.';
    showModal(`Edit ${label}`, `<div class="dossier-field-editor"><textarea class="textarea" rows="12" data-dossier-field-input="${esc(characterId)}:${esc(field)}">${esc(item[field] || '')}</textarea><div class="dossier-field-help">${esc(help)}</div></div>`, `<button class="button secondary" type="button" data-close-modal>Cancel</button><button class="button" type="button" data-dossier-save="${esc(characterId)}:${esc(field)}">Save</button>`);
    requestAnimationFrame(()=>el.modal.querySelector('[data-dossier-field-input]')?.focus());
  }

  function showDossierLabelEditor(characterId,key) {
    const item=getItem('characters',characterId); if(!item) return;
    const current=dossierLabel(item,key), fallback=DOSSIER_LABEL_DEFAULTS[key]||key;
    showModal('Rename dossier label', `<label class="dossier-label-single"><span>Label</span><input class="input" type="text" value="${esc(current)}" data-dossier-label-input="${esc(characterId)}:${esc(key)}"><small>Default: ${esc(fallback)}</small></label>`, `<button class="button secondary" type="button" data-dossier-label-reset="${esc(characterId)}:${esc(key)}">Use default</button><button class="button secondary" type="button" data-close-modal>Cancel</button><button class="button" type="button" data-dossier-label-save="${esc(characterId)}:${esc(key)}">Save label</button>`);
    requestAnimationFrame(()=>{const input=el.modal.querySelector('[data-dossier-label-input]');input?.focus();input?.select();});
  }

  function showDossierLabelsEditor(characterId) {
    const item=getItem('characters',characterId); if(!item) return;
    const labels=dossierLabels(item);
    const body=DOSSIER_LABEL_GROUPS.map(group=>`<section class="dossier-label-group"><h3>${esc(group.title)}</h3><div class="dossier-label-grid">${group.keys.map(key=>`<label><span>${esc(DOSSIER_LABEL_DEFAULTS[key]||key)}</span><input class="input" type="text" value="${esc(labels[key]||'')}" data-dossier-label-bulk="${esc(key)}"></label>`).join('')}</div></section>`).join('');
    showModal('Rename Practical Dossier labels', `<div class="dossier-label-manager">${body}</div>`, `<button class="button secondary" type="button" data-dossier-labels-reset="${esc(characterId)}">Reset all</button><button class="button secondary" type="button" data-close-modal>Cancel</button><button class="button" type="button" data-dossier-labels-save="${esc(characterId)}">Save labels</button>`);
  }

  function dossierThemeCard(characterId,id,theme,active) {
    const colors=[theme.paper,theme.paper2,theme.panel,theme.ink,theme.accent];
    return `<button class="dossier-theme-card ${active===id?'is-active':''}" type="button" data-dossier-theme-apply="${esc(characterId)}:${esc(id)}"><span class="dossier-theme-swatches">${colors.map(color=>`<i style="background:${color}"></i>`).join('')}</span><strong>${esc(theme.name)}</strong><small>${active===id?'Currently applied':'Apply colors'}</small></button>`;
  }

  function showDossierThemePicker(characterId) {
    const item=getItem('characters',characterId); if(!item) return;
    const active=item.dossierTheme||'classic-parchment';
    const custom=dossierThemePalette(item,'custom');
    const cards=Object.entries(DOSSIER_THEMES).map(([id,theme])=>dossierThemeCard(characterId,id,theme,active)).join('');
    const customFields=[['paper','Page background'],['paper2','Top surface'],['panel','Cards and panels'],['ink','Main text'],['muted','Muted text'],['line','Borders and dividers'],['accent','Accent color'],['chip','Tags and chips']];
    showModal('Practical Dossier colors', `<div class="dossier-theme-gallery">${cards}</div><section class="dossier-custom-theme ${active==='custom'?'is-active':''}"><div class="dossier-custom-head"><div><h3>Fully custom</h3><p>Choose every main color used by this character’s dossier.</p></div><span class="dossier-theme-swatches">${[custom.paper,custom.paper2,custom.panel,custom.ink,custom.accent].map(color=>`<i style="background:${color}"></i>`).join('')}</span></div><div class="dossier-custom-grid">${customFields.map(([key,label])=>`<label><span>${esc(label)}</span><input type="color" value="${safeDossierColor(custom[key],'#000000')}" data-dossier-custom-color="${esc(key)}"></label>`).join('')}</div><button class="button" type="button" data-dossier-custom-save="${esc(characterId)}">Save and use custom colors</button></section>`, `<button class="button secondary" type="button" data-close-modal>Done</button>`);
  }

  function renderEntity(kind, itemId) {
    const item = getItem(kind,itemId);
    if (!item) { navigate(kind); return; }
    const meta = COLLECTIONS[kind];
    if (kind === 'characters' && item.pageTemplate === 'practical-dossier') {
      el.main.innerHTML = renderPracticalDossier(item);
      requestAnimationFrame(() => {
        autoSizeEntityTitle(document.querySelector('.entity-title-input'));
        installCharacterImageInteractions();
      });
      return;
    }
    const breadcrumb = kind === 'locations' ? renderLocationBreadcrumb(item) : '';
    const snapshot = kind === 'characters' ? renderCharacterSnapshot(item) : '';
    const entityCover = kind === 'characters' ? renderCharacterCover(item) : '<div class="entity-cover"></div>';
    const templateToolbar = kind === 'characters' ? renderCharacterTemplateToolbar(item) : '';
    el.main.innerHTML = `${templateToolbar}${breadcrumb}<section class="entity-hero">${entityCover}<div class="entity-title-row"><textarea class="entity-title-input" rows="1" aria-label="${meta.singular} name" data-title-kind="${kind}" data-title-id="${item.id}">${esc(item.name)}</textarea><button class="favorite-button ${item.favorite?'on':''}" type="button" data-favorite="${kind}:${item.id}" title="Favorite">☆</button></div></section>
      <div class="entity-layout"><div class="editor-surface ${kind === 'characters' ? 'character-editor-surface' : ''}">${snapshot}${renderBlockEditor(kind,item.id,item.blocks,item.name)}</div><aside class="properties-panel"><div class="panel-head" style="padding:0 0 14px"><h2>Properties</h2><button class="button ghost small" type="button" data-delete="${kind}:${item.id}">Delete</button></div>${renderProperties(kind,item)}</aside></div>`;
    requestAnimationFrame(() => {
      autoSizeEntityTitle(document.querySelector('.entity-title-input'));
      if (kind === 'characters') installCharacterImageInteractions();
    });
  }

  function renderCharacterSnapshot(item) {
    const locations = (item.currentLocationIds || []).map(locationId => getItem('locations', locationId)).filter(Boolean);
    const field = (label, fieldName, value) => value ? `<div class="snapshot-field"><span class="snapshot-label">${esc(label)}</span><span class="snapshot-value" data-snapshot-value="${esc(fieldName)}">${esc(cleanNotionRefs(value))}</span></div>` : '';
    return `<section class="character-snapshot" aria-label="Current character details">
      <div class="character-snapshot-layout">
        ${renderCharacterPortrait(item)}
        <div class="character-snapshot-details">
          <div class="snapshot-grid">
            ${field('Age', 'age', item.age)}
            <div class="snapshot-field"><span class="snapshot-label">Current location</span><div class="property-links">${locations.map(location => `<button class="link-pill" type="button" data-open="locations:${location.id}">${esc(location.name)}</button>`).join('') || '<span class="snapshot-value">Not set</span>'}</div></div>
            ${field('Current mood', 'mood', item.mood)}
            ${field('Current outfit', 'outfit', item.outfit)}
            ${field('Current position', 'position', item.position)}
            ${field('Current status', 'status', item.status)}
          </div>
        </div>
        ${item.relationshipsText ? `<div class="snapshot-relationships character-snapshot-wide"><span class="snapshot-label">Key relationships</span><p data-snapshot-value="relationshipsText">${esc(cleanNotionRefs(item.relationshipsText))}</p></div>` : ''}
      </div>
    </section>`;
  }

  function renderLocationBreadcrumb(item) {
    const chain = [];
    const seen = new Set();
    let current = item;
    while (current && !seen.has(current.id)) {
      seen.add(current.id); chain.unshift(current); current = getItem('locations',current.parentLocationId);
    }
    return `<div class="breadcrumb-trail">${chain.map((x,i)=>`${i?'<span>›</span>':''}<button class="breadcrumb-pill" type="button" data-open="locations:${x.id}">${esc(x.name)}</button>`).join('')}</div>`;
  }

  function renderProperties(kind,item) {
    if (kind === 'locations') {
      const children = childrenOf(item.id);
      const connectedIds = (item.relatedLocationIds || []).filter(locationId => locationId !== item.parentLocationId && !children.some(child => child.id === locationId));
      const parentControl = isRegionType(item.type)
        ? `<div class="property-row hierarchy-root-note"><label>Location hierarchy</label><div class="hierarchy-root-copy"><strong>Top-level region</strong><span>Regions are the largest locations in this world, so they do not have a parent.</span></div></div>`
        : `<div class="property-row"><label>Inside / parent location</label><select class="select" data-property="${kind}:${item.id}:parentLocationId"><option value="">No parent selected</option>${state.locations.filter(x=>x.id!==item.id && !isDescendant(item.id,x.id)).map(x=>`<option value="${x.id}" ${item.parentLocationId===x.id?'selected':''}>${esc(x.name)} · ${esc(x.type || 'Location')}</option>`).join('')}</select><div class="property-help">Choose the place this location is physically inside.</div></div>`;
      return `<div class="property-list">
        ${propertySelect('Type','type',item.type,['Region','Realm','Territory','Settlement','City','Urban District','District','Transit Point','Building','Room','Landmark'],kind,item.id,true)}
        ${parentControl}
        ${propertyTextarea('Atmosphere','atmosphere',item.atmosphere,kind,item.id)}
        ${propertyTextarea('Description','description',item.description,kind,item.id)}
        ${propertyInput('Controlled by','controlledBy',item.controlledBy,kind,item.id)}
        <div class="property-row"><label>Key characters</label>${linkedPills('characters',item.keyCharacterIds)}</div>
        ${connectedIds.length ? `<div class="property-row"><label>Other connected locations</label>${linkedPills('locations',connectedIds)}<div class="property-help">For neighbors, roads, portals, or story links that are not part of the parent hierarchy.</div></div>` : ''}
        <div class="property-row"><label>Locations inside this place</label><div class="children-list">${children.map(x=>`<div class="child-row"><button class="button ghost small" type="button" data-open="locations:${x.id}">${esc(x.name)}</button><span class="cell-muted">${esc(x.type)}</span></div>`).join('') || '<span class="property-help">No sub-locations yet.</span>'}</div><button class="button secondary small" style="margin-top:8px" type="button" data-new-child="${item.id}">Add location inside</button></div>
      </div>`;
    }
    if (kind === 'characters') {
      return `<div class="property-list">
        ${propertyInput('Age','age',item.age,kind,item.id)}
        ${propertyInput('Species / race','speciesRace',item.speciesRace,kind,item.id)}
        ${propertyInput('Alignment','alignment',item.alignment,kind,item.id)}
        ${propertyInput('Role / occupation','role',item.role,kind,item.id)}
        ${propertyInput('Dossier occupation','occupation',item.occupation,kind,item.id)}
        ${propertyInput('Subtitle / tagline','tagline',item.tagline,kind,item.id)}
        ${propertyInput('Aliases','aliases',item.aliases,kind,item.id)}
        ${propertySelect('Status','status',item.status,['Active','Off-screen','Missing','Inactive','Deceased','Unknown'],kind,item.id,true)}
        ${propertyInput('Current mood','mood',item.mood,kind,item.id)}
        ${propertyInput('Current outfit','outfit',item.outfit,kind,item.id)}
        ${propertyTextarea('Current position','position',item.position,kind,item.id)}
        <div class="property-row"><label>Current location</label><select class="select" data-character-location="${item.id}"><option value="">No location</option>${state.locations.map(x=>`<option value="${x.id}" ${item.currentLocationIds?.[0]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
        ${propertyTextarea('Personality','personality',item.personality,kind,item.id)}
        ${propertyTextarea('Backstory','backstory',item.backstory,kind,item.id)}
        ${propertyTextarea('Strengths','strengths',item.strengths,kind,item.id)}
        ${propertyTextarea('Weaknesses','weaknesses',item.weaknesses,kind,item.id)}
        ${propertyTextarea('Skills / abilities','skillsAbilities',item.skillsAbilities,kind,item.id)}
        ${propertyInput('Traits (comma separated)','traits',item.traits,kind,item.id)}
        ${propertyInput('Reputation / code','reputationCode',item.reputationCode,kind,item.id)}
        ${propertyTextarea('Distinguishing features','distinguishingFeatures',item.distinguishingFeatures,kind,item.id)}
        ${propertyInput('Motivations / principles','motivations',item.motivations,kind,item.id)}
        ${propertyTextarea('Relationships','relationshipsText',item.relationshipsText,kind,item.id)}
        <div class="property-row"><label>Linked people</label>${linkedPills('characters',item.relationshipIds)}</div>
        ${propertyTextarea('Secrets','secrets',item.secrets,kind,item.id)}
        ${propertyTextarea('Quote','quote',item.quote,kind,item.id)}
        ${propertyInput('Tags (comma separated)','tags',item.tags,kind,item.id)}
        ${propertyTextarea('Notes','notes',item.notes,kind,item.id)}
      </div>`;
    }
    if (kind === 'factions') {
      return `<div class="property-list">
        ${propertySelect('Power level','power',item.power,['Minor','Moderate','Major','Dominant','Hidden'],kind,item.id,true)}
        ${propertyTextarea('Goal','goal',item.goal,kind,item.id)}
        ${propertyTextarea('Allies / enemies','alliesEnemies',item.alliesEnemies,kind,item.id)}
        <div class="property-row"><label>Key members</label>${linkedPills('characters',item.keyMemberIds)}</div>
        ${propertyTextarea('Notes','notes',item.notes,kind,item.id)}
      </div>`;
    }
    return `<div class="property-list">
      ${propertyInput('Date / order','date',item.date,kind,item.id)}
      ${propertySelect('Status','status',item.status,['Planned','In Progress','Complete','Uncertain'],kind,item.id,true)}
      ${propertyTextarea('Description','description',item.description,kind,item.id)}
      ${propertyTextarea('Consequences','consequences',item.consequences,kind,item.id)}
      <div class="property-row"><label>Involved people</label>${linkedPills('characters',item.characterIds)}</div>
      ${propertyTextarea('Notes','notes',item.notes,kind,item.id)}
    </div>`;
  }

  function isDescendant(possibleAncestorId, possibleChildId) {
    let current = getItem('locations', possibleChildId);
    const seen = new Set();
    while (current?.parentLocationId && !seen.has(current.id)) {
      seen.add(current.id);
      if (current.parentLocationId === possibleAncestorId) return true;
      current = getItem('locations',current.parentLocationId);
    }
    return false;
  }

  function propertyInput(label,field,value,kind,itemId) {
    return `<div class="property-row"><label>${esc(label)}</label><input class="input" value="${esc(cleanNotionRefs(value))}" data-property="${kind}:${itemId}:${field}"></div>`;
  }
  function propertyTextarea(label,field,value,kind,itemId) {
    return `<div class="property-row"><label>${esc(label)}</label><textarea class="textarea" data-property="${kind}:${itemId}:${field}">${esc(cleanNotionRefs(value))}</textarea></div>`;
  }
  function propertySelect(label,field,value,options,kind,itemId,allowCustom=false) {
    const values = [...new Set([...(options||[]), ...(allowCustom && value && !options.includes(value) ? [value] : [])])];
    return `<div class="property-row"><label>${esc(label)}</label><select class="select" data-property="${kind}:${itemId}:${field}">${values.map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  }
  function linkedPills(kind,ids=[]) {
    const html = ids.map(itemId=>getItem(kind,itemId)).filter(Boolean).map(x=>`<button class="link-pill" type="button" data-open="${kind}:${x.id}">${esc(x.name)}</button>`).join('');
    return `<div class="property-links">${html || '<span class="property-help">None linked yet.</span>'}</div>`;
  }

  function renderBlockEditor(kind,itemId,blocks=[],pageTitle='') {
    const displayBlocks = blocks.map((block,index)=>({block,index})).filter(({block,index}) => {
      const sameAsTitle = /^h[1-3]$/.test(block.type) && stripMd(block.content).toLowerCase() === stripMd(pageTitle).toLowerCase();
      if (sameAsTitle) return false;
      if (kind === 'characters' && isImportedCharacterSummary(block)) return false;
      if (kind === 'locations' && isImportedLocationSummary(block)) return false;
      if (kind === 'locations' && /^want the property-field version next\??$/i.test(stripMd(block.content))) return false;
      return true;
    });
    const characterTools = kind === 'characters' ? `<button class="block-tool" type="button" data-add-image title="Add or drop an image">▧</button><input type="file" accept="image/*" data-character-image-input="${esc(itemId)}" hidden>` : '';
    const minHeight = kind === 'characters' ? characterCanvasMinHeight(blocks) : 0;
    const imageBlocks = kind === 'characters' ? displayBlocks.filter(({block})=>block.type === 'image') : [];
    const writingBlocks = kind === 'characters' ? displayBlocks.filter(({block})=>block.type !== 'image') : displayBlocks;
    const writingHtml = writingBlocks.map(({block,index})=>renderBlock(kind,itemId,block,index)).join('');
    return `<div class="block-toolbar" data-editor="${kind}:${itemId}">
      <button class="block-tool" type="button" data-add-block="text" title="Text">T</button>
      <button class="block-tool" type="button" data-add-block="h2" title="Heading">H</button>
      <button class="block-tool" type="button" data-add-block="bullet" title="Bulleted list">•</button>
      <button class="block-tool" type="button" data-add-block="quote" title="Quote">❝</button>
      <button class="block-tool" type="button" data-add-block="divider" title="Divider">―</button>
      ${characterTools}
      ${kind === 'characters' ? '<span class="block-toolbar-help">Images can sit anywhere. Wrap mode reflows the writing on both sides while you drag.</span>' : ''}
    </div><div class="block-list ${kind === 'characters' ? 'character-block-list' : ''}" data-block-list="${kind}:${itemId}" ${kind === 'characters' ? `data-character-drop-zone="${esc(itemId)}" style="min-height:${minHeight}px"` : ''}>${kind === 'characters' ? `${imageBlocks.map(({block,index})=>renderBlock(kind,itemId,block,index)).join('')}<div class="character-flow-layer" data-character-flow="${esc(itemId)}"></div><div class="character-writing-source">${writingHtml || (!imageBlocks.length ? '<div class="block-placeholder">Use the toolbar to add the first block.</div>' : '')}</div>` : (writingHtml || '<div class="block-placeholder">Use the toolbar to add the first block.</div>')}</div>`;
  }

  function characterCanvasMinHeight(blocks=[]) {
    const furthest = blocks.filter(block=>block.type==='image').reduce((max,block)=>Math.max(max,(Number(block.y)||0)+(Number(block.width)||300)/(Number(block.ratio)||1.25)+90),0);
    return Math.max(300,Math.ceil(furthest));
  }

  function isImportedCharacterSummary(block) {
    const text = stripMd(block?.content || '');
    return block?.type === 'text' && /Current Location:/i.test(text) && /Current Status:/i.test(text) && /(Age:|Aliases:)/i.test(text);
  }

  function isImportedLocationSummary(block) {
    const text = stripMd(block?.content || '');
    return block?.type === 'text' && /Atmosphere:/i.test(text) && /Description:/i.test(text) && /Type:/i.test(text) && /(Related Locations:|Key Characters:|Notes:)/i.test(text);
  }

  function worldQuickLink(block) {
    const byId = {
      b69:{label:'Characters',view:'characters',copy:'Profiles, relationships, and current status'},
      b70:{label:'Locations',view:'locations',copy:'Parent locations, children, and connected places'},
      b71:{label:'Species',view:'species',copy:'Peoples, lineages, traits, and social tensions'},
      b72:{label:'Timeline / Events',view:'events',copy:'The world history and current events'},
      b73:{label:'Open Threads',view:'search',copy:'Search unresolved questions, goals, and mysteries'},
      b74:{label:'Characters',view:'characters',copy:'Open the character database'},
      b75:{label:'Locations',view:'locations',copy:'Open the location database'},
      b76:{label:'Species',view:'species',copy:'Open the species database'},
      b77:{label:'Timeline / Events',view:'events',copy:'Open the timeline'},
      b78:{label:'Open Threads',view:'search',copy:'Search open story threads'}
    };
    if (byId[block?.id]) return byId[block.id];
    const text = stripMd(block?.content || '').toLowerCase();
    if (/^characters(?:\s*\(characters\))?$/.test(text)) return {label:'Characters',view:'characters',copy:'Open the character database'};
    if (/^locations(?:\s*\(locations\))?$/.test(text)) return {label:'Locations',view:'locations',copy:'Open the location database'};
    if (/^factions(?:\s*\(factions\))?$/.test(text)) return {label:'Species',view:'species',copy:'Open the species database'};
    if (/^timeline(?:\s*\/\s*events)?(?:\s*\(timeline\s*\/\s*events\))?$/.test(text)) return {label:'Timeline / Events',view:'events',copy:'Open the timeline'};
    if (/^open threads/.test(text)) return {label:'Open Threads',view:'search',copy:'Search unresolved questions and mysteries'};
    return null;
  }

  function renderBlock(kind,itemId,block,index) {
    const quickLink = kind === 'world' ? worldQuickLink(block) : null;
    if (quickLink) return `<div class="block-row world-quick-link-row" data-block-row="${kind}:${itemId}:${index}"><span class="block-handle">⋮⋮</span><button class="world-quick-link" type="button" data-nav="${quickLink.view}" ${quickLink.label==='Open Threads'?'data-prefill-search="thread"':''}><span><strong>${esc(quickLink.label)}</strong><small>${esc(quickLink.copy)}</small></span><span aria-hidden="true">→</span></button></div>`;
    if (block.type === 'image' && kind === 'characters') return renderCharacterImageBlock(kind,itemId,block,index);
    if (block.type === 'divider') return `<div class="block-row" data-block-row="${kind}:${itemId}:${index}"><span class="block-handle">⋮⋮</span><div class="block-divider" data-block-index="${index}"></div></div>`;
    const labelClass = /^\s*(?:\*\*|__)[^\n]+?(?:\*\*|__)\s*$/.test(String(block.content || '')) ? ' markdown-label-block' : '';
    return `<div class="block-row" data-block-row="${kind}:${itemId}:${index}"><span class="block-handle">⋮⋮</span><div class="block-content${labelClass}" contenteditable="true" role="textbox" data-type="${esc(block.type)}" data-block="${kind}:${itemId}:${index}" spellcheck="true">${renderInlineMarkdown(block.content)}</div></div>`;
  }

  function renderCharacterImageBlock(kind,itemId,block,index) {
    const layout = ['wrap','front','behind'].includes(block.layout) ? block.layout : 'wrap';
    const wrapSide = block.wrapSide === 'right' ? 'right' : 'left';
    const width = Math.max(120,Number(block.width)||300);
    const padding = Math.max(0,Math.min(80,Number(block.padding)||18));
    const opacity = Math.max(.15,Math.min(1,Number(block.opacity)||1));
    const xPct = Math.max(0,Math.min(100,Number(block.xPct)||0));
    const y = Math.max(0,Number(block.y)||0);
    const ref = `${kind}:${itemId}:${index}`;
    const placementStyle = `left:${xPct}%;top:${y}px;`;
    const stateClass = `${activeImageRef === ref ? ' is-selected' : ''}${editingImageRef === ref ? ' is-editing' : ''}`;
    return `<figure class="character-image-block image-layout-${layout} image-wrap-${wrapSide}${stateClass}" data-block-row="${ref}" data-image-block="${ref}" style="--image-width:${width}px;--image-gap:${padding}px;--image-opacity:${opacity};${placementStyle}">
      <img src="${esc(block.src)}" alt="${esc(block.alt || 'Character image')}" draggable="false" data-image-select="${ref}" title="Click to select this image">
      <button class="image-selection-edit" type="button" data-image-start-edit="${ref}">Edit image</button>
      <div class="image-edit-toolbar" aria-label="Image editing controls">
        <label><span>Behavior</span><select data-image-quick-layout="${ref}"><option value="wrap" ${layout==='wrap'?'selected':''}>Fit words around image</option><option value="front" ${layout==='front'?'selected':''}>In front of words</option><option value="behind" ${layout==='behind'?'selected':''}>Behind words</option></select></label>
        <button type="button" data-image-more="${ref}">More settings</button>
        <button type="button" data-image-done="${ref}">Done</button>
      </div>
      <button class="image-resize-dot" type="button" data-image-resize="${ref}" aria-label="Drag to resize image" title="Drag to resize"></button>
    </figure>`;
  }

  function normalizeStoryTurn(turn) {
    turn.id ||= id('turn');
    turn.type ||= 'dialogue';
    turn.characterId ||= '';
    turn.speakerName ||= turn.characterId ? (getItem('characters', turn.characterId)?.name || 'Character') : 'Narrator';
    turn.text ||= '';
    return turn;
  }

  function ensureStoryPassage(node) {
    if (!node) return { title: '', summary: '', anchorTurnId: '', turns: [] };
    node.passage ||= { title: '', summary: '', anchorTurnId: '', turns: [] };
    node.passage.title ||= '';
    node.passage.summary ||= '';
    node.passage.anchorTurnId ||= '';
    node.passage.turns ||= [];
    return node.passage;
  }

  function ensureStoryDocument(story) {
    if (!story) return [];
    story.rpTurns ||= [];
    for (const turn of story.rpTurns) normalizeStoryTurn(turn);
    return story.rpTurns;
  }

  function storyRouteValue(storyId, nodeId = '') {
    return nodeId ? `${storyId}~${nodeId}` : storyId;
  }

  function parseStoryRouteValue(value = '') {
    const raw = String(value || '');
    const splitAt = raw.indexOf('~');
    return splitAt < 0 ? { storyId: raw, nodeId: '' } : { storyId: raw.slice(0, splitAt), nodeId: raw.slice(splitAt + 1) };
  }

  function storyPointContext(value = route.id) {
    const parsed = parseStoryRouteValue(value);
    const stories = state.storyGraphs || [];
    const story = stories.find(item => item.id === parsed.storyId) || stories[0] || null;
    const ordered = (story?.nodes || []).slice().sort((a,b)=>(a.order || 0) - (b.order || 0));
    const node = ordered.find(item => item.id === parsed.nodeId) || ordered[0] || null;
    return { story, node, ordered, index: node ? ordered.findIndex(item => item.id === node.id) : -1 };
  }

  function storyPointTitle(story, node) {
    if (!node) return 'Untitled story point';
    const passage = ensureStoryPassage(node);
    const resolved = resolveGraphNode(node.id);
    return passage.title.trim() || resolved?.label || node.role || `Point ${node.order || ''}`.trim();
  }

  function storyAnchorIndex(story, node) {
    const turns = ensureStoryDocument(story);
    const anchor = ensureStoryPassage(node).anchorTurnId;
    if (!anchor) return -1;
    if (anchor === '__start__') return turns.length ? 0 : -1;
    return turns.findIndex(turn => turn.id === anchor);
  }

  function storyPointRange(story, node) {
    const turns = ensureStoryDocument(story);
    const start = storyAnchorIndex(story, node);
    if (start < 0) return { start: -1, end: -1, turns: [], anchored: false };
    const laterStarts = (story?.nodes || [])
      .filter(other => other !== node)
      .map(other => storyAnchorIndex(story, other))
      .filter(index => index > start);
    const end = laterStarts.length ? Math.min(...laterStarts) : turns.length;
    return { start, end, turns: turns.slice(start, end), anchored: true };
  }

  function storyAnchorDescription(story, node) {
    const turns = ensureStoryDocument(story);
    const passage = ensureStoryPassage(node);
    if (!passage.anchorTurnId) return 'Not linked to the RP yet';
    if (!turns.length) return 'Start of the empty RP sheet';
    const index = storyAnchorIndex(story, node);
    if (index < 0) return 'Anchor needs to be reassigned';
    const turn = turns[index];
    const speaker = storySpeakerMeta(turn);
    return `Starts at Post ${index + 1} · ${speaker.name}`;
  }

  function storyAnchorOptions(story, node) {
    const passage = ensureStoryPassage(node);
    const turns = ensureStoryDocument(story);
    const options = [
      `<option value="" ${!passage.anchorTurnId?'selected':''}>Not linked yet</option>`,
      `<option value="__start__" ${passage.anchorTurnId==='__start__'?'selected':''}>Start of the full RP</option>`
    ];
    turns.forEach((turn,index)=>{
      const speaker = storySpeakerMeta(turn);
      const excerpt = shortText(turn.text || storyTurnTypeLabel(turn.type), 55);
      options.push(`<option value="${esc(turn.id)}" ${passage.anchorTurnId===turn.id?'selected':''}>Post ${index + 1} · ${esc(speaker.name)}${excerpt?` · ${esc(excerpt)}`:''}</option>`);
    });
    return options.join('');
  }

  function storyPointMarkers(story) {
    const markers = new Map();
    for (const node of story?.nodes || []) {
      const index = storyAnchorIndex(story,node);
      if (index < 0) continue;
      if (!markers.has(index)) markers.set(index,[]);
      markers.get(index).push(node);
    }
    return markers;
  }

  function openStoryPoint(storyId, nodeId, edit = false) {
    storyEditMode = edit;
    navigate('story', storyRouteValue(storyId, nodeId));
  }

  function storyNodeName(nodeId) {
    return resolveGraphNode(nodeId)?.label || 'Unknown point';
  }

  function storyRoleSentence(node) {
    const name = storyNodeName(node?.id);
    const role = String(node?.role || '').toLowerCase();
    if (role === 'setting') return `The story begins in ${name}.`;
    if (role === 'scene location') return `The action narrows to ${name}.`;
    if (role === 'scene opener') return `${name} opens the scene.`;
    if (role === 'story turn') return `The story shifts to ${name}.`;
    if (role === 'connection point') return `${name} reconnects the main thread.`;
    if (role === 'shared branch') return `${name} appears on a shared branch of the scene.`;
    return `${name} is a saved point in this story.`;
  }

  function storyFlowRows(story,node) {
    if (!story || !node) return [];
    const byId = new Map((story.nodes || []).map(item => [item.id,item]));
    const orderOf = nodeId => Number(byId.get(nodeId)?.order) || 0;
    const rows = [];
    const incoming = (story.links || []).filter(link => link.target === node.id);
    const outgoing = (story.links || []).filter(link => link.source === node.id);
    const names = list => [...new Set(list.map(link => storyNodeName(link.source === node.id ? link.target : link.source)))];
    const incomingEarlier = incoming.filter(link => link.mainPath !== false && orderOf(link.source) < orderOf(node.id));
    const outgoingLater = outgoing.filter(link => link.mainPath !== false && orderOf(link.target) > orderOf(node.id));
    const incomingLater = incoming.filter(link => link.mainPath !== false && orderOf(link.source) > orderOf(node.id));
    const outgoingEarlier = outgoing.filter(link => link.mainPath !== false && orderOf(link.target) < orderOf(node.id));
    const branchOut = outgoing.filter(link => link.mainPath === false);
    const branchIn = incoming.filter(link => link.mainPath === false);
    const push = (label,values) => { if (values.length) rows.push({label, value:values.join(', ')}); };
    push('Comes after', names(incomingEarlier));
    push('Continues to', names(outgoingLater));
    push('Reconnects here later', names(incomingLater));
    push('Returns to', names(outgoingEarlier));
    push('Branches from here', names(branchOut));
    push('Joins this branch from', names(branchIn));
    return rows;
  }

  function showStoryPointPopup(story,node) {
    if (!story || !node) return;
    const passage = ensureStoryPassage(node);
    const resolved = resolveGraphNode(node.id);
    const range = storyPointRange(story,node);
    const totalPoints = (story.nodes || []).length;
    const flowRows = storyFlowRows(story,node);
    const previewTurns = range.turns.slice(0,3);
    const preview = previewTurns.length ? `<section class="story-popup-preview"><h3>RP from this point</h3>${previewTurns.map((turn,index)=>{
      const speaker=storySpeakerMeta(turn);
      const postNumber=range.start+index+1;
      return `<article class="rp-popup-post"><header><span class="rp-avatar">${esc(speaker.initials)}</span><span><strong>${esc(speaker.name)}</strong><small>${esc(storyTurnTypeLabel(turn.type))} · Post ${postNumber}</small></span></header><p>${esc(turn.text || 'No text added yet.').replace(/\n/g,'<br>')}</p></article>`;
    }).join('')}</section>` : '';
    const bookmarkCopy = passage.anchorTurnId
      ? `<strong>${esc(storyAnchorDescription(story,node))}</strong><p>${range.turns.length} RP post${range.turns.length===1?'':'s'} belong to this section before the next story point begins.</p>`
      : `<strong>Not linked to the RP yet</strong><p>Choose the exact RP post where this story point begins. The full RP will stay together on one sheet.</p>`;
    const entityButton = resolved ? `<button class="button ghost" type="button" data-modal-open-entity="${esc(resolved.kind)}:${esc(resolved.refId)}">Open ${esc(resolved.label)} page</button>` : '';
    const primaryButton = passage.anchorTurnId
      ? `<button class="button" type="button" data-modal-story-open="${esc(storyRouteValue(story.id,node.id))}">Read from this point</button>`
      : `<button class="button" type="button" data-modal-story-edit="${esc(storyRouteValue(story.id,node.id))}">Link this point to the RP</button>`;
    const changeButton = passage.anchorTurnId ? `<button class="button secondary" type="button" data-modal-story-edit="${esc(storyRouteValue(story.id,node.id))}">Change RP bookmark</button>` : '';
    showModal(resolved?.label || storyPointTitle(story,node),`<div class="story-point-popup-simple">
      <div class="story-point-popup-intro"><span class="story-point-number">Story point ${esc(node.order || '')} of ${totalPoints}</span><p>${esc(storyRoleSentence(node))}</p>${passage.summary?`<p class="story-point-user-summary">${esc(passage.summary)}</p>`:''}</div>
      <section class="story-flow-summary"><h3>Where this point fits</h3>${flowRows.length?flowRows.map(row=>`<div class="story-flow-row"><span>${esc(row.label)}</span><strong>${esc(row.value)}</strong></div>`).join(''):'<p>This is the only visible point in the current story view.</p>'}</section>
      <section class="story-bookmark-card"><span class="eyebrow">RP bookmark</span>${bookmarkCopy}</section>
      ${preview}
    </div>`,`${changeButton}${entityButton}${primaryButton}`);
  }

  function storySpeakerValue(turn) {
    if (turn.characterId) return `character:${turn.characterId}`;
    if ((turn.speakerName || '').toLowerCase() === 'narrator') return 'narrator';
    return 'custom';
  }

  function storySpeakerMeta(turn) {
    const character = turn.characterId ? getItem('characters', turn.characterId) : null;
    const name = character?.name || turn.speakerName || 'Narrator';
    return { character, name, initials: initials(name) };
  }

  function storySpeakerOptions(story, selected) {
    const storyCharacterIds = new Set((story?.nodes || []).filter(node => node.id.startsWith('character:')).map(node => node.id.split(':')[1]));
    const storyCharacters = state.characters.filter(character => storyCharacterIds.has(character.id)).sort((a,b)=>a.name.localeCompare(b.name));
    const otherCharacters = state.characters.filter(character => !storyCharacterIds.has(character.id)).sort((a,b)=>a.name.localeCompare(b.name));
    const option = character => `<option value="character:${esc(character.id)}" ${selected===`character:${character.id}`?'selected':''}>${esc(character.name)}</option>`;
    return `<option value="narrator" ${selected==='narrator'?'selected':''}>Narrator</option>${storyCharacters.length?`<optgroup label="Story characters">${storyCharacters.map(option).join('')}</optgroup>`:''}${otherCharacters.length?`<optgroup label="Other characters">${otherCharacters.map(option).join('')}</optgroup>`:''}<option value="custom" ${selected==='custom'?'selected':''}>Custom or other speaker</option>`;
  }

  function storyTurnTypeLabel(type) {
    return ({ dialogue:'Dialogue', action:'Action', narration:'Narration', ooc:'Out of character' })[type] || 'Roleplay post';
  }

  function renderStoryTurnRead(turn, index, story, selectedNode, markerMap) {
    const speaker = storySpeakerMeta(turn);
    const body = esc(turn.text || '').replace(/\n/g, '<br>');
    const open = speaker.character ? ` data-open="characters:${speaker.character.id}"` : '';
    const selectedRange = storyPointRange(story,selectedNode);
    const inSelectedSection = selectedRange.start >= 0 && index >= selectedRange.start && index < selectedRange.end;
    const startsSelectedSection = selectedRange.start === index;
    const markers = markerMap.get(index) || [];
    const marker = markers.length ? `<div class="rp-story-anchor ${markers.some(point=>point.id===selectedNode.id)?'active':''}">${markers.map(point=>`<button type="button" data-story-point="${esc(storyRouteValue(story.id,point.id))}"><span>Point ${esc(point.order || '')}</span><strong>${esc(storyPointTitle(story,point))}</strong></button>`).join('')}</div>` : '';
    return `${marker}<article id="rp-turn-${esc(turn.id)}" data-rp-turn-id="${esc(turn.id)}" class="rp-post rp-post-${esc(turn.type || 'dialogue')} ${inSelectedSection?'rp-post-selected-section':''} ${startsSelectedSection?'rp-post-selected-start':''}">
      <header class="rp-post-head"><button class="rp-avatar" type="button"${open} ${speaker.character?'':'disabled'}>${esc(speaker.initials)}</button><div><div class="rp-speaker">${esc(speaker.name)}</div><div class="rp-post-meta">${esc(storyTurnTypeLabel(turn.type))} · Post ${index + 1}</div></div></header>
      <div class="rp-post-body">${body || '<span class="rp-empty-copy">No text added yet.</span>'}</div>
    </article>`;
  }

  function renderStoryTurnEditor(story, turn, index, total, selectedNode) {
    const selected = storySpeakerValue(turn);
    const custom = selected === 'custom';
    const passage = ensureStoryPassage(selectedNode);
    const isSelectedAnchor = passage.anchorTurnId === turn.id || (passage.anchorTurnId === '__start__' && index === 0);
    const anchoredPoints = (story.nodes || []).filter(point => storyAnchorIndex(story,point) === index);
    return `<section class="rp-editor ${isSelectedAnchor?'rp-editor-selected-anchor':''}" data-story-turn-card="${esc(turn.id)}">
      ${anchoredPoints.length?`<div class="rp-editor-anchor-list">${anchoredPoints.map(point=>`<span>Point ${esc(point.order || '')}: ${esc(storyPointTitle(story,point))}</span>`).join('')}</div>`:''}
      <div class="rp-editor-toolbar">
        <label><span>Speaker</span><select class="select" data-story-turn-speaker="${esc(turn.id)}">${storySpeakerOptions(story,selected)}</select></label>
        <label><span>Post type</span><select class="select" data-story-turn-type="${esc(turn.id)}">${['dialogue','action','narration','ooc'].map(type=>`<option value="${type}" ${turn.type===type?'selected':''}>${storyTurnTypeLabel(type)}</option>`).join('')}</select></label>
        <div class="rp-editor-actions"><button class="button ghost small" type="button" data-story-set-anchor="${esc(turn.id)}">${isSelectedAnchor?'Point starts here':'Start selected point here'}</button><button class="button ghost small" type="button" data-story-turn-up="${esc(turn.id)}" ${index===0?'disabled':''} aria-label="Move post up">↑</button><button class="button ghost small" type="button" data-story-turn-down="${esc(turn.id)}" ${index===total-1?'disabled':''} aria-label="Move post down">↓</button><button class="button ghost small" type="button" data-story-turn-delete="${esc(turn.id)}">Delete</button></div>
      </div>
      ${custom?`<label class="rp-custom-speaker"><span>Speaker name</span><input class="input" type="text" value="${esc(turn.speakerName || '')}" data-story-turn-custom="${esc(turn.id)}" placeholder="Character or player name"></label>`:''}
      <label class="rp-editor-text"><span>Roleplay post</span><textarea class="textarea" rows="7" data-story-turn-text="${esc(turn.id)}" placeholder="Paste or write this character's part of the RP here…">${esc(turn.text || '')}</textarea></label>
    </section>`;
  }

  function renderStoryReader() {
    const context = storyPointContext(route.id);
    const { story, node, ordered, index } = context;
    if (!story || !node) {
      el.main.innerHTML = `${pageHead('Roleplay story','No story points yet','Create a story graph first, then link each point to a place in the full roleplay.', `<button class="button secondary" type="button" data-nav="graph">Open graphs</button>`)}`;
      return;
    }
    const passage = ensureStoryPassage(node);
    const resolved = resolveGraphNode(node.id);
    const previous = ordered[index - 1] || null;
    const next = ordered[index + 1] || null;
    const turns = ensureStoryDocument(story);
    const selectedRange = storyPointRange(story,node);
    const participants = [...new Set(turns.map(turn => storySpeakerMeta(turn).name).filter(Boolean))];
    const markerMap = storyPointMarkers(story);
    const jumpButtons = ordered.map(point => {
      const range = storyPointRange(story,point);
      const active = point.id === node.id;
      return `<button class="story-jump ${active?'active':''}" type="button" data-story-point="${esc(storyRouteValue(story.id,point.id))}"><span>${esc(point.order || '')}</span><strong>${esc(storyPointTitle(story,point))}</strong><small>${esc(storyAnchorDescription(story,point))}${range.anchored?` · ${range.turns.length} post${range.turns.length===1?'':'s'}`:''}</small></button>`;
    }).join('');
    const actions = `<button class="button secondary" type="button" data-nav="graph">Back to graph</button><button class="button" type="button" data-story-mode="${storyEditMode?'read':'edit'}">${storyEditMode?'Read full RP':'Edit RP and anchors'}</button>`;
    const reading = turns.length ? turns.map((turn,turnIndex)=>renderStoryTurnRead(turn,turnIndex,story,node,markerMap)).join('') : `<div class="rp-empty"><h3>The full RP sheet is empty</h3><p>Add the roleplay once, in its real posting order. Then each graph point can jump to the post where that part of the story begins.</p><button class="button" type="button" data-story-mode="edit">Add the first post</button></div>`;
    const editing = `<section class="story-point-editor">
      <div class="story-anchor-callout"><strong>One RP, multiple jump points</strong><span>The writing below is one continuous sheet. This point only stores where its section begins.</span></div>
      <div class="story-point-fields story-point-fields-anchor"><label><span>Point title</span><input class="input" type="text" value="${esc(passage.title)}" data-story-point-title placeholder="${esc(resolved?.label || `Point ${node.order}`)}"></label><label><span>Point summary</span><textarea class="textarea" rows="3" data-story-point-summary placeholder="What changes at this point in the scene?">${esc(passage.summary)}</textarea></label><label class="story-point-anchor-control"><span>This point starts at</span><select class="select" data-story-point-anchor>${storyAnchorOptions(story,node)}</select><small>Choose a post here, or use “Start selected point here” beside any post below.</small></label></div>
      <div class="rp-editor-list">${turns.map((turn,turnIndex)=>renderStoryTurnEditor(story,turn,turnIndex,turns.length,node)).join('') || '<p class="rp-empty-copy">No posts yet. Add the first RP entry below.</p>'}</div>
      <button class="button" type="button" data-story-add-turn>Add roleplay post to full RP</button>
    </section>`;
    el.main.innerHTML = `${pageHead('Roleplay story',story.name,story.description || 'Keep the entire RP together and use graph points as bookmarks into the story.',actions)}
      <section class="story-jump-panel" aria-label="Jump to a story point"><div class="story-jump-heading"><span class="eyebrow">Story bookmarks</span><p>Each point opens the same RP sheet at a saved post.</p></div><div class="story-jump-list">${jumpButtons}</div></section>
      <article class="story-reader-page">
        <header class="story-point-head"><div><span class="story-point-number">Point ${esc(node.order || index + 1)}</span><span class="viz-badge">${esc(node.role || resolved?.type || 'Story point')}</span><h2>${esc(storyPointTitle(story,node))}</h2><p>${esc(passage.summary || `This bookmark is connected to ${resolved?.label || 'the selected graph node'}.`)}</p><p class="story-anchor-status">${esc(storyAnchorDescription(story,node))}</p></div><div class="story-point-stats"><span>${selectedRange.turns.length} post${selectedRange.turns.length===1?'':'s'} in section</span><span>${turns.length} total post${turns.length===1?'':'s'}</span><span>${participants.length} participant${participants.length===1?'':'s'}</span></div></header>
        ${storyEditMode ? editing : `<div class="rp-reading-list">${reading}</div>`}
        <footer class="story-reader-nav"><button class="button secondary" type="button" ${previous?`data-story-point="${esc(storyRouteValue(story.id,previous.id))}"`:'disabled'}>← Previous point</button><button class="button secondary" type="button" ${next?`data-story-point="${esc(storyRouteValue(story.id,next.id))}"`:'disabled'}>Next point →</button></footer>
      </article>`;
    requestAnimationFrame(()=>scrollToStoryAnchor(story,node,storyEditMode));
  }

  function scrollToStoryAnchor(story,node,editing=false) {
    const passage = ensureStoryPassage(node);
    let target = null;
    if (passage.anchorTurnId && passage.anchorTurnId !== '__start__') {
      const attr = editing ? 'data-story-turn-card' : 'data-rp-turn-id';
      target = document.querySelector(`[${attr}="${CSS.escape(passage.anchorTurnId)}"]`);
    } else if (passage.anchorTurnId === '__start__') {
      target = document.querySelector(editing?'[data-story-turn-card]':'[data-rp-turn-id]');
    }
    target ||= document.querySelector('.story-point-anchor-control') || document.querySelector('.story-reader-page');
    target?.scrollIntoView({behavior:'smooth',block:'start'});
    target?.classList.add('rp-anchor-flash');
    setTimeout(()=>target?.classList.remove('rp-anchor-flash'),1200);
  }

  function currentStoryPassage() {
    const context = storyPointContext(route.id);
    return { ...context, passage: context.node ? ensureStoryPassage(context.node) : null, turns: ensureStoryDocument(context.story) };
  }

  function findStoryTurn(turnId) {
    const context = currentStoryPassage();
    const turn = context.turns?.find(item => item.id === turnId) || null;
    return { ...context, turn };
  }

  function activeStoryGraph() {
    const stories = state.storyGraphs || [];
    return stories.find(story => story.id === graphSettings.storyId) || stories[0] || null;
  }

  function graphGuideCopy() {
    if (graphSettings.graphType === 'story') {
      return {
        title: 'Read the story from left to right',
        copy: 'The numbered circles show the scene order. The main path moves from Ashfall Dominion to the Outskirts, then to Astra, Ashara, and Braum. Grace and Martha branch from both Astra and Braum. Drag any circle to refine the arrangement.'
      };
    }
    if (graphSettings.graphType === 'locations' && graphSettings.layout === 'hierarchy') {
      return { title: 'Read this from top to bottom', copy: 'A line with an arrow means the upper location contains the lower location. Dashed lines are optional related-place links, not part of the parent structure. You can drag circles to adjust the layout.' };
    }
    if (graphSettings.layout === 'focus') {
      return { title: 'The selected item stays in the center', copy: 'Connected locations, people, factions, and events are grouped around it. Every line is labeled with the reason for the connection, and the circles can be moved.' };
    }
    return { title: 'Every line should answer why two items are connected', copy: 'Colors and letter markers identify item types. Read the text printed on each line, click a circle for a plain-language explanation, or drag it to rearrange the view.' };
  }

  function graphLayoutOptions() {
    if (graphSettings.graphType === 'story') return [
      ['story','Story path'],
      ['network','Free relationship map']
    ];
    if (graphSettings.graphType === 'locations') return [
      ['hierarchy','Location tree'],
      ['focus','Focus on one location'],
      ['network','Relationship map']
    ];
    return [
      ['focus','Focus on one item'],
      ['network','Relationship map']
    ];
  }

  function graphDefaultFocus() {
    const items = graphFocusOptions();
    const visible = items.find(item => !(graphSettings.hiddenNodeIds || []).includes(item.value));
    return visible?.value || items[0]?.value || '';
  }

  function graphNodeKey() {
    const entries = graphTypeFilters();
    const colorMap = { Location:'var(--accent)', Person:'var(--success)', Species:'var(--muted)', Faction:'var(--warning)', Event:'var(--danger)' };
    return entries.map(entry => `<span class="graph-key-row"><span class="graph-key-dot" style="background:${colorMap[entry.key]}"></span><strong>${esc(entry.label)}</strong></span>`).join('');
  }

  function storySummaryHtml() {
    if (graphSettings.graphType !== 'story') return '';
    const story = activeStoryGraph();
    if (!story) return '';
    const names = (story.nodes || []).map(node => resolveGraphNode(node.id)).filter(Boolean);
    const byId = new Map(names.map(node => [node.id,node]));
    const ordered = (story.nodes || []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
    const mainNames = ordered.slice(0,5).map(node => byId.get(node.id)?.label).filter(Boolean);
    const branchNames = ordered.slice(5).map(node => byId.get(node.id)?.label).filter(Boolean);
    return `<section class="story-map-summary" aria-label="Story path summary">
      <div><span class="eyebrow">Main story path</span><div class="story-path-chips">${mainNames.map((name,index)=>`<span class="story-path-chip"><strong>${index+1}</strong>${esc(name)}</span>${index<mainNames.length-1?'<span class="story-path-arrow">→</span>':''}`).join('')}</div></div>
      <p><strong>Branches:</strong> ${esc(branchNames.join(' and '))} connect to both Astra and Braum. Chrome Hollow is not part of this story view.</p>
    </section>`;
  }

  function renderGraphPage() {

    if (graphSettings.graphType === 'story' && !activeStoryGraph()) graphSettings.storyId = state.storyGraphs?.[0]?.id || '';
    if (graphSettings.layout === 'focus' && !graphSettings.focus) graphSettings.focus = graphDefaultFocus();

      : `<div class="property-row"><label>${graphSettings.layout==='focus'?'Centered item':'Preview item'}</label><select class="select" id="graphFocus"><option value="">Choose an item</option>${focusOptions.map(x=>`<option value="${x.value}" ${graphSettings.focus===x.value?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>`;
